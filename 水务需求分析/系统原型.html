<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>供水营销管理系统 · 需求沟通原型</title>
<style>
:root{
  --bg:#f9f9f7; --card:#fcfcfb; --line:rgba(11,11,11,0.10); --line2:rgba(11,11,11,0.16);
  --ink:#1e1e1c; --mut:#6d6d67; --blue:#1c5cab; --blue-d:#153f72; --blue-bg:#eef3fa;
  --ok:#0ca30c; --warn:#fab219; --over:#ec835a; --bad:#d03b3b;
  --sh:0 1px 3px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.05);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;font-size:14px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:7px 10px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(28,92,171,.15)}
h1,h2,h3,h4{margin:0;font-weight:600}
/* ============ 顶部工具栏 ============ */
#toolbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:900;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);}
#toolbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
#toolbar .brand small{font-weight:400;color:var(--mut);font-size:12px}
.seg{display:flex;background:#efefec;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;cursor:pointer;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--blue);font-weight:600;box-shadow:0 1px 3px rgba(11,11,11,.12)}
.tchip{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;white-space:nowrap;color:var(--mut)}
.tchip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);font-weight:600}
.tchip .cnt{display:inline-block;min-width:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center;margin-left:4px}
#toolbar .sp{flex:1}
/* ============ 舞台与设备壳 ============ */
#stage{position:absolute;top:56px;left:0;right:0;bottom:0;overflow:auto;}
#stage.center{display:block;overflow:hidden}
#frame-desktop{min-width:1280px;height:100%;}
.devwrap{position:absolute;left:50%;top:50%;}
.tab-shell{width:1072px;height:816px;background:#15181d;border-radius:28px;padding:24px;box-shadow:0 22px 70px rgba(0,0,0,.28);}
.tab-screen{width:1024px;height:768px;background:var(--bg);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.mb-shell{width:412px;height:866px;background:#15181d;border-radius:54px;padding:11px;box-shadow:0 22px 70px rgba(0,0,0,.28);position:relative}
.mb-screen{width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.mb-notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#15181d;border-radius:18px;z-index:60}
.mb-status{height:58px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-size:13px;font-weight:600}
/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
.card .chd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.card .cbd{padding:14px 16px}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-d);color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{color:#fff;filter:brightness(.92)}
.btn-bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn-bad:hover{color:#fff;filter:brightness(.92)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-lg{padding:14px 26px;font-size:17px;border-radius:12px;font-weight:600}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#f2f2ee;text-align:left;padding:8px 10px;font-weight:600;color:#4c4c47;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(28,92,171,.045)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;border:1px solid transparent;white-space:nowrap}
.st-ok{color:var(--ok);background:rgba(12,163,12,.09);border-color:rgba(12,163,12,.25)}
.st-warn{color:#9a6a00;background:rgba(250,178,25,.14);border-color:rgba(250,178,25,.45)}
.st-over{color:#b34a24;background:rgba(236,131,90,.13);border-color:rgba(236,131,90,.4)}
.st-bad{color:var(--bad);background:rgba(208,59,59,.09);border-color:rgba(208,59,59,.3)}
.st-mut{color:var(--mut);background:rgba(11,11,11,.05);border-color:var(--line)}
.st-blue{color:var(--blue);background:var(--blue-bg);border-color:rgba(28,92,171,.3)}
.badge-todo{display:inline-flex;align-items:center;gap:5px;background:rgba(250,178,25,.15);border:1px solid rgba(250,178,25,.55);
  color:#8a5d00;border-radius:8px;padding:3px 10px;font-size:12.5px;font-weight:600}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:600}
.money{font-variant-numeric:tabular-nums}
.flexr{display:flex;align-items:center;gap:10px}.flexw{display:flex;flex-wrap:wrap;gap:12px}
.toolrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-2px;position:relative}
.subtabs button.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.formrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.formrow label{width:110px;flex:none;text-align:right;color:#4c4c47}
.formrow input[type=text],.formrow input[type=number],.formrow select,.formrow textarea{flex:1}
.switch{position:relative;width:44px;height:24px;border-radius:12px;background:#d4d4cf;cursor:pointer;transition:.15s;flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)}.switch.on::after{left:22px}
.kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .kv{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .kl{color:var(--mut);font-size:12.5px}
.kpi .kd{font-size:12px;margin-top:3px}
/* ============ 桌面端 ============ */
.dt-shell{display:flex;height:100%;background:var(--bg)}
.dt-nav{width:212px;flex:none;background:linear-gradient(180deg,#123a69 0%,#1c5cab 130%);color:#cfdff2;display:flex;flex-direction:column;}
.dt-logo{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;color:#fff;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.14)}
.dt-menu{flex:1;overflow:auto;padding:8px 0}
.dt-menu .grp{padding:10px 18px 4px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:2px}
.dt-menu a{display:flex;align-items:center;gap:9px;padding:9px 18px;color:#cfdff2;text-decoration:none;cursor:pointer;font-size:13.5px}
.dt-menu a:hover{background:rgba(255,255,255,.08);color:#fff}
.dt-menu a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600;border-right:3px solid #fab219}
.dt-menu .ic{width:18px;text-align:center;flex:none;opacity:.9}
.dt-user{padding:12px 16px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:rgba(255,255,255,.75)}
.dt-main{flex:1;display:flex;flex-direction:column;min-width:0}
.dt-top{height:46px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:8px}
.crumb{color:var(--mut);font-size:13px}.crumb b{color:var(--ink)}
.dt-page{flex:1;overflow:auto;position:relative;padding:18px 20px 40px}
/* 登录 */
.login-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#eaf1fa 0%,#f9f9f7 45%,#eef6ee 100%)}
.login-card{width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 50px rgba(18,58,105,.14);padding:34px 38px}
.captcha{display:inline-flex;align-items:center;justify-content:center;width:96px;height:38px;background:#eef3fa;border:1px dashed rgba(28,92,171,.5);
  border-radius:7px;font:700 19px/1 Georgia,serif;letter-spacing:5px;color:var(--blue);cursor:pointer;user-select:none;font-style:italic}
/* 平板端 */
.tb-page{flex:1;overflow:auto;position:relative;padding:18px 20px 20px}
.tb-head{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.tb-dock{flex:none;height:64px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:stretch;justify-content:space-around}
.tb-dock button{border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);width:120px;font-size:12px}
.tb-dock button .di{font-size:21px;line-height:1}
.tb-dock button.on{color:var(--blue);font-weight:600}
.bigcard{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:20px;cursor:pointer;transition:.12s;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.bigcard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(11,11,11,.12)}
.bigcard .bi{font-size:26px}.bigcard .bn{font-size:17px;font-weight:700;margin-top:6px}
.bigcard .bv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
/* 移动端 */
.mb-page{flex:1;overflow:auto;position:relative;padding:12px 14px 14px;-webkit-overflow-scrolling:touch}
.mb-tabs{flex:none;height:74px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:14px}
.mb-tabs button{flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11px}
.mb-tabs button .di{font-size:22px;line-height:1.1}
.mb-tabs button.on{color:var(--blue);font-weight:600}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.prog{height:8px;border-radius:4px;background:#e8e8e4;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpad button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;font-size:20px;font-weight:600;cursor:pointer}
.kpad button:active{background:var(--blue-bg)}
.photo-box{border:1.5px dashed var(--line2);border-radius:10px;height:74px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12.5px;gap:6px;margin-top:10px;cursor:pointer}
/* ============ FR 标签模式 ============ */
body.tag-mode [data-fr],body.tag-mode [data-frx]{position:relative;outline:1.5px dashed rgba(28,92,171,.5);outline-offset:2px;border-radius:4px}
body.tag-mode [data-fr]::after{content:attr(data-fr);position:absolute;top:-9px;right:-4px;z-index:45;
  background:var(--blue);color:#fff;font-size:10px;line-height:1;padding:3px 6px;border-radius:8px;font-weight:600;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
body.tag-mode [data-frx]{outline-color:rgba(250,178,25,.8)}
body.tag-mode [data-frx]::after{content:'待补·' attr(data-frx);position:absolute;top:-9px;right:-4px;z-index:45;
  background:var(--warn);color:#5c3d00;font-size:10px;line-height:1;padding:3px 6px;border-radius:8px;font-weight:700;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#fr-pop{position:fixed;z-index:1200;max-width:360px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 44px rgba(11,11,11,.22);padding:13px 15px;display:none;font-size:13px}
#fr-pop .fp-id{font-weight:700;color:var(--blue)}
#fr-pop .fp-desc{margin-top:7px;color:#3c3c38;max-height:190px;overflow:auto;line-height:1.6}
/* ============ 批注 ============ */
body.note-mode #stage{cursor:crosshair}
body.note-mode #stage::after{content:'💬 批注模式：点击界面任意位置放置批注';position:fixed;top:64px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,28,.86);color:#fff;font-size:12.5px;padding:5px 14px;border-radius:16px;z-index:800;pointer-events:none}
.pin{position:absolute;width:23px;height:23px;border-radius:50% 50% 50% 4px;color:#fff;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transform:translate(-50%,-100%) rotate(0deg);z-index:70;cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.35);border:2px solid #fff}
.pin.t-需调整{background:var(--over)}.pin.t-有疑问{background:var(--warn);color:#5c3d00}
.pin.t-新需求{background:var(--blue)}.pin.t-确认OK{background:var(--ok)}
.pin.done{opacity:.45}
#pin-tip{position:fixed;z-index:1200;max-width:320px;background:#26261f;color:#f4f4ef;border-radius:10px;padding:10px 13px;font-size:12.5px;display:none;box-shadow:0 10px 34px rgba(0,0,0,.35);line-height:1.55}
/* ============ 抽屉 ============ */
.drawer{position:fixed;top:56px;bottom:0;right:-390px;width:380px;background:var(--card);border-left:1px solid var(--line);
  box-shadow:-10px 0 34px rgba(11,11,11,.10);z-index:850;transition:right .22s ease;display:flex;flex-direction:column}
.drawer.open{right:0}
.drawer .dhd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.drawer .dbd{flex:1;overflow:auto;padding:14px 16px}
.pflash{margin-left:auto;font-size:12px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .25s}
.pflash.show{opacity:1}
.pfield{margin-bottom:13px}
.pfield label{display:flex;justify-content:space-between;font-size:12.5px;color:#4c4c47;margin-bottom:4px}
.pfield input{width:100%}
.note-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff}
.note-item .nh{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.note-item .nno{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
/* ============ 弹窗 / 提示 ============ */
#modal-mask{position:fixed;inset:0;background:rgba(20,20,18,.42);z-index:1000;display:none;align-items:center;justify-content:center}
#modal-mask.open{display:flex}
#modal-box{width:520px;max-width:94vw;max-height:86vh;overflow:auto;background:var(--card);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.3)}
#modal-box .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
#modal-box .mb{padding:18px}
#modal-box .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
#toast-wrap{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:1300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#26261f;color:#f4f4ef;padding:9px 18px;border-radius:22px;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:tin .2s ease}
.toast.tk{background:var(--ok)}.toast.tb{background:var(--bad)}.toast.tw{background:#8a5d00}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 票据预览 */
.receipt{border:1.5px solid var(--blue);border-radius:8px;padding:16px 18px;background:#fdfefe;font-size:13px;position:relative}
.receipt::before{content:'收讫';position:absolute;right:22px;top:34px;color:rgba(208,59,59,.55);border:2.5px solid rgba(208,59,59,.55);
  border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;transform:rotate(-18deg)}
.receipt h4{text-align:center;color:var(--blue);letter-spacing:4px;margin-bottom:4px}
.receipt .rline{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(11,11,11,.14)}
/* 票据格式画布 */
.tk-canvas{position:relative;width:100%;height:280px;border:1.5px solid var(--blue);border-radius:8px;background:
  repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(28,92,171,.06) 28px);overflow:hidden}
.tk-item{position:absolute;border:1px dashed rgba(28,92,171,.55);background:rgba(238,243,250,.85);color:var(--blue-d);
  font-size:11.5px;padding:2px 8px;border-radius:5px;white-space:nowrap}
.dropzone{border:2px dashed var(--line2);border-radius:12px;padding:34px;text-align:center;color:var(--mut);cursor:pointer;background:#fff;transition:.15s}
.dropzone:hover,.dropzone.hov{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.loglist{background:#191c22;color:#b9e3b9;border-radius:10px;padding:12px 14px;font:12px/1.7 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto}
.loglist .lw{color:#fad27a}.loglist .le{color:#f5a3a3}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(11,11,11,.18);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="toolbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.5-7-12.5z" fill="#1c5cab"/><path d="M9 15.5a3 3 0 0 0 3 3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    供水营销管理系统 <small>· 需求沟通原型</small>
  </div>
  <div class="seg" id="devseg">
    <button data-dev="desktop" class="on" onclick="A.setDevice('desktop')">🖥 桌面</button>
    <button data-dev="tablet" onclick="A.setDevice('tablet')">▭ 平板</button>
    <button data-dev="mobile" onclick="A.setDevice('mobile')">📱 移动</button>
  </div>
  <div class="sp"></div>
  <button class="tchip" id="btn-tag" onclick="A.toggleTag()">🏷 需求标签</button>
  <button class="tchip" id="btn-note" onclick="A.toggleNote()">💬 批注模式</button>
  <button class="tchip" id="btn-params" onclick="A.togglePanel('params')">⚙ 业务参数</button>
  <button class="tchip" id="btn-panel" onclick="A.togglePanel('notes')">📋 批注面板<span class="cnt" id="note-cnt" style="display:none">0</span></button>
  <button class="tchip" onclick="A.exportNotes()">⬇ 导出批注JSON</button>
</div>

<div id="stage">
  <div id="frame-desktop"></div>
  <div id="frame-tablet" class="devwrap" style="display:none">
    <div class="tab-shell"><div class="tab-screen" id="tb-screen"></div></div>
  </div>
  <div id="frame-mobile" class="devwrap" style="display:none">
    <div class="mb-shell"><div class="mb-notch"></div><div class="mb-screen" id="mb-screen"></div></div>
  </div>
</div>

<div class="drawer" id="drawer-params">
  <div class="dhd">⚙ 业务参数（演示调参）<span class="pflash" id="pflash">✔ 参数已生效</span>
    <button class="btn btn-sm" style="margin-left:8px" onclick="A.togglePanel('params')">✕</button></div>
  <div class="dbd" id="params-body"></div>
</div>

<div class="drawer" id="drawer-notes">
  <div class="dhd">📋 批注面板<span style="margin-left:auto"></span>
    <button class="btn btn-sm" onclick="A.exportNotes()">⬇ 导出</button>

<script>
const APP_DATA={"system":"供水营销管理系统","priorityMap":{"1":"P1 高（核心必备）","2":"P2 中高","5":"P3 一般"},"modules":[{"id":"M1","name":"档案基础数据","srsRef":"4.1","functions":[{"id":"FR-1.1","name":"用户状态","priority":1,"srsRef":"4.1.1","refinedDesc":"维护用水户生命周期状态字典。管理对象为用户状态代码表，字段应含：状态编码（唯一、创建后不可改）、状态名称（如正常、报停、暂停、违章、销户）、是否抄表标志、是否计费标志、是否允许缴费标志、启用/停用标志、排序号、备注。规则：状态被客户档案引用后禁止删除、只能停用；『是否抄表』决定抄表计划是否为该状态用户生成抄表任务；『是否允许缴费』供公众缴费平台配置（4.3.4限制用户状态）引用，拦截不允许状态用户的线上缴费；『是否计费』决定开账时是否生成水费账单。"},{"id":"FR-1.2","name":"用户分类","priority":5,"srsRef":"4.1.2","refinedDesc":"维护用户性质分类字典，用于统计与政策口径管理。字段应含：分类编码（唯一）、分类名称（如居民、非居民、单位、趸售、特困减免户）、上级分类（支持树形）、启用/停用标志、备注。规则：分类被客户档案引用后禁止删除；用户分类可作为水价方案、报表统计、优惠适用范围的筛选维度；与行业分类（FR-1.4）职责区分：用户分类描述『用户性质』，行业分类描述『用水性质』。"},{"id":"FR-1.3","name":"抄表周期","priority":1,"srsRef":"4.1.3","refinedDesc":"维护抄表周期字典，驱动抄表计划的生成节奏。字段应含：周期编码、周期名称（如月抄、双月抄、季抄）、间隔月数、每期例抄日（日历日或工作日偏移）、启用/停用标志、备注。规则：周期挂接在表册上（一个表册一个周期），『抄表周期只能以表册为单位修改』即不允许对单户改周期，改周期须整册调整；被表册引用的周期禁止删除；周期+例抄日决定表册到期日，系统按到期日自动生成本期抄表计划任务。"},{"id":"FR-1.4","name":"行业分类","priority":5,"srsRef":"4.1.4","refinedDesc":"维护用水性质的行业分类字典，支持大类-小类两级结构（SRS操作序列提到『行类大小分类』）。字段应含：大类编码/名称（商业、工业、居民、特种等）、小类编码/名称、所属大类、启用/停用标志、备注。规则：行业分类挂接客户档案，用于用水性质统计报表与特种行业水价（如洗车、洗浴等特种用水执行特种水价）；被档案引用的分类禁止删除；特种行业类别应可被水价方案引用。"},{"id":"FR-1.5","name":"优惠类型","priority":1,"srsRef":"4.1.5","refinedDesc":"维护水费优惠政策字典。字段应含：优惠编码、优惠名称（如低保户减免、军烈属优惠、特困减免）、优惠方式（比例折扣/每期定额金额减免/每期定量水量减免）、优惠值、适用收费类型（水费/污水费）、适用用户分类、生效日期、失效日期、启用/停用标志、审批依据备注。规则：优惠类型在档案管理的水价信息处挂接到具体用户；算费开账时按优惠方式参与账单金额计算（先算原价再按优惠冲减，账单需保留优惠前后金额明细）；被档案引用的优惠禁止删除；过期优惠自动停止参与算费。"}]},{"id":"M2","name":"抄表基础模块","srsRef":"4.2","functions":[{"id":"FR-2.1","name":"抄表员管理","priority":1,"srsRef":"4.2.1","refinedDesc":"维护抄表员基础档案并与表册、掌上机、登录账号关联。字段应含：抄表员编号（唯一，可由系统自动生成）、姓名、所属营业所/抄表区域、联系电话、在职状态（在职/离职/停用）、关联系统登录账号、绑定掌上机设备号、备注。规则：一名抄表员可负责多个表册，一个表册同一时间只归属一名抄表员；有在管表册的抄表员不允许直接删除，须先将表册移交他人；离职/停用抄表员不再出现在表册分配与抄表任务下发范围内。"},{"id":"FR-2.2","name":"表册管理","priority":1,"srsRef":"4.2.2","refinedDesc":"维护表册（按抄表路线组织的用户集合，抄表与批量销账的基本单位）。字段应含：表册编号（唯一）、表册名称、所属区域/营业所、责任抄表员、抄表周期（引用FR-1.3）、例抄日、册内户数（系统统计）、表册状态（启用/停用/待移交）、备注。规则：抄表周期只能以表册为单位修改（3.3约束在此落地）；新立户用户必须归入某表册后才能进入抄表计划；用户可在表册间调拨（换册）并保留调拨记录；表册到期时系统按其周期与例抄日自动生成本期抄表计划；批量销账（FR-4.2）以表册号为查询入口。"},{"id":"FR-2.3","name":"表册顺序调整","priority":1,"srsRef":"4.2.3","refinedDesc":"调整表册内各户号的抄表顺序号，使抄表路线与实地行走路线一致。管理对象为表册-用户关系中的『册内抄表顺序号』字段。规则：顺序号在同一表册内唯一、连续（或允许留空隙由系统重排）；支持单户改号、上移/下移、拖拽排序、区间批量重排四种方式；调整后手工抄表界面（FR-7.1）与掌上机下载任务按新顺序展示；新入册用户默认排在册尾；调整操作留痕（操作人、时间、前后顺序）。"}]},{"id":"M3","name":"收费数据基础","srsRef":"4.3","functions":[{"id":"FR-3.1","name":"收费类型","priority":1,"srsRef":"4.3.1","refinedDesc":"维护费用科目字典。字段应含：收费类型编码（唯一）、收费类型名称（如水费、污水处理费、垃圾费、违约金/滞纳金、工程款、预存款）、是否允许线上渠道缴纳、销账冲抵优先顺序、对应票据类型（引用FR-5.1）、是否参与滞纳金计算、启用/停用标志。规则：账单按收费类型分项记账与开票；公众缴费平台配置（FR-3.4）可按收费类型限制线上可缴项目；销账时按冲抵优先顺序依次核销多项费用；被账单或渠道配置引用的类型禁止删除。"},{"id":"FR-3.2","name":"收费网点","priority":5,"srsRef":"4.3.2","refinedDesc":"维护线下收费网点（营业厅）档案。字段应含：网点编码（唯一）、网点名称、所属区域/分公司、地址、负责人、联系电话、营业时间、支持业务（收费/开票/预存/退费）、启用/停用标志。规则：柜员收费流水必须归属某网点，作为网点日结、长短款核对与收入统计的口径；网点停用后不再受理新流水但历史流水可查；ATM收费机（FR-3.3）挂接在网点之下。"},{"id":"FR-3.3","name":"Atm收费机","priority":5,"srsRef":"4.3.3","refinedDesc":"维护线下ATM自助缴费机设备档案。字段应含：设备编号（唯一）、设备名称、所属收费网点/安装位置、终端标识/IP、支持缴费方式（现金/银行卡/扫码）、是否支持打印票据、设备状态（在线/离线/停用/维修）、投产日期。规则：自助机缴费流水按设备编号归集，参与渠道对账与网点日结；设备停用后终端登录被拒绝；设备状态变化留日志供运维排查。"},{"id":"FR-3.4","name":"公众缴费平台","priority":1,"srsRef":"4.3.4","refinedDesc":"维护微信、支付宝、公众号等线上公众缴费通道（pps平台）配置。字段应含：通道编码、通道名称（微信支付/支付宝/公众号/小程序）、商户号、AppID、支付密钥（加密存储）、回调地址、允许缴纳的收费类型集合（引用FR-3.1）、允许缴费的用户状态集合（引用FR-1.1）、单笔限额、日累计限额、启用/停用标志。规则：用户状态不在允许集合内（如已销户）时线上查询/缴费被拦截；收费类型不在允许集合内的费项不展示或标记不可线上缴；通道停用立即停止受理新支付但已发起订单继续完成回调处理；配置变更留审计日志。"}]},{"id":"M4","name":"柜台收费业务","srsRef":"4.4","functions":[{"id":"FR-4.1","name":"单户销账","priority":1,"srsRef":"4.4.1","refinedDesc":"柜台按单户受理水费缴纳。柜员按户号（精确）或户名/地址（模糊）查询用户欠费账单列表，列表展示每期账单的账期、用水量、水费、污水费、其他费项、滞纳金（按销账当日重算）、合计与用户预存余额。柜员勾选一条或多条账单（须按账期先后连续勾选，不允许跳期销账），录入实收金额与付款方式（现金/扫码/银行卡），系统按收费类型冲抵顺序核销，支持预存余额抵扣，生成收费流水（含网点、柜员、付款方式），销账后账单状态置为已缴并可打印票据。冲正/作废当日流水需授权并生成红冲记录。"},{"id":"FR-4.2","name":"批量销账","priority":2,"srsRef":"4.4.2","refinedDesc":"面向单位代扣、整册托收等场景，按表册号（也应支持单位编号/文件导入）批量查询多户欠费并一次性销账。柜员输入表册号，系统列出册内全部欠费户及各户欠费合计，支持全选/反选/按条件过滤（欠费期数、金额区间），确认批量应收总额后一次收款，系统逐户逐单执行销账，生成一张批量收费汇总流水与逐户明细流水。逐户处理相互独立：单户失败（如该户账单已被其他渠道缴纳）不影响其他户，失败户列入错误清单并给出原因，成功户正常销账。"},{"id":"FR-4.3","name":"预收费","priority":2,"srsRef":"4.4.3","refinedDesc":"管理用户预存账户：预存缴费（充值）与取款（退还余额）。按户号/户名/地址查询用户，展示预存账户当前余额与预存流水（存入/开账自动抵扣/柜台抵扣/取款）。预存充值：录入充值金额与付款方式，系统增加余额并生成预存流水与收据。取款：校验可退余额，超过阈值或销户退款需主管授权，生成退款流水。规则：开账后是否自动用预存余额抵扣新账单由系统参数或单户标志控制；预存余额不足抵扣时账单余额挂欠费；预存流水与收费流水统一纳入网点日结与财务对账。"}]},{"id":"M5","name":"票据基础信息","srsRef":"4.5","functions":[{"id":"FR-5.1","name":"票据类型","priority":1,"srsRef":"4.5.1","refinedDesc":"维护开票类型字典。字段应含：票据类型编码（唯一）、票据类型名称（普通发票、增值税发票、污水费发票、水费收据、预存收据等，对应3.2『打印普通发票、增值税发票、污水费发票及其他各种水费结算凭证』）、票据介质（纸质/电子）、税率、税收分类编码、是否需要纳税人信息、启用/停用标志。规则：收费类型（FR-3.1）与票据类型建立映射，销账后按映射确定默认开票类型；票据类型下可配置多个票据格式（FR-5.2）；被票据格式或开票记录引用的类型禁止删除。"},{"id":"FR-5.2","name":"票据格式","priority":1,"srsRef":"4.5.2","refinedDesc":"按票据类型配置打印格式模板。字段应含：格式编码、格式名称、所属票据类型（引用FR-5.1）、纸张规格（宽×高mm）、打印方式（针式套打/激光/热敏）、打印要素及坐标（户号、户名、地址、账期、水量、各费项金额、金额大写、合计、收费员、收费日期、二维码等要素的X/Y坐标与字体）、打印份数、套打偏移量、启用/停用标志、版本号。规则：一个票据类型可维护多个格式版本，同一时间仅一个启用（新版启用旧版自动停用）；柜台打票（FR-4.1/4.3联动）按票据类型取当前启用格式渲染；格式支持打印预览与测试打印。"}]},{"id":"M6","name":"水表基础数据","srsRef":"4.6","functions":[{"id":"FR-6.1","name":"水表类型","priority":1,"srsRef":"4.6.1","refinedDesc":"维护水表类型字典。字段应含：类型编码（唯一）、类型名称（远传表、水平旋翼、垂直旋翼、流量计等）、是否远传标志、计量方式（机械/电子/超声）、启用/禁用标志、备注。规则：『是否远传』决定该类型水表的抄表数据可否走远传/抄表机导入通道（FR-7.3），非远传表只能手工或表格录入；被水表档案引用的类型禁止删除，只能禁用；禁用类型不可在新装表时选择。"},{"id":"FR-6.2","name":"水表口径","priority":1,"srsRef":"4.6.2","refinedDesc":"维护水表口径规格字典。字段应含：口径编码、口径规格（DN15/DN20/DN25/DN40/DN50/DN100等）、最大读数（表位量程，如99999，用于翻表过零水量计算）、换表读数（累计行度达到该值触发换表建议）、换表周期（使用年限，年，驱动周期换表计划）、启用/停用标志。规则：抄表算量时若本期行至小于上期行至且判定为翻表，按『最大读数-上期行至+本期行至』修正水量；表务周期换表计划按『装表日期+换表周期』或『累计行度≥换表读数』两条件筛选到期表；被水表档案引用的口径禁止删除。"},{"id":"FR-6.3","name":"水表参数","priority":1,"srsRef":"4.6.3","refinedDesc":"按口径维护水表计量与检定参数。字段应含：所属口径（引用FR-6.2）、参数项编码/名称、参数值、计量单位，典型参数项包括：公称流量Q3、最小流量Q1、分界流量Q2、始动流量、计量等级、首检有效期、周检周期（年）、检定依据规程、压力等级。规则：一个口径下可维护多条参数记录（参数项-参数值键值结构）；参数供水表检定/周检计划与表务台账引用；参数修改留版本记录以便追溯历史检定依据。"},{"id":"FR-6.4","name":"水表厂家","priority":5,"srsRef":"4.6.4","refinedDesc":"维护水表生产厂家档案。字段应含：厂家编码（唯一）、厂家名称、统一社会信用代码、联系人、联系电话、地址、供货范围（口径/类型）、资质有效期、启用/禁用标志、备注。规则：水表档案（表身号入库）须挂接厂家，用于质量追溯与到货验收统计；被水表档案引用的厂家禁止删除，只允许禁用；禁用厂家不可在新表入库时选择。"}]},{"id":"M7","name":"抄表计划","srsRef":"4.7","functions":[{"id":"FR-7.1","name":"手工抄表录入","priority":1,"srsRef":"4.7.1","refinedDesc":"柜面/内勤逐户录入抄表读数。按表册顺序（FR-2.3）或户号定位用户，界面展示：上期行至、上期抄表日期、近6期平均水量、换表信息（换表日期、旧表止度、新表起度——影响本期水量拼接）、总分表信息（总表/分表关系——影响总分差水量分摊）、备忘信息（如门禁、狗、表位变更等抄表提示）。录入本期行至后系统自动计算本期水量=本期行至-上期行至，遇换表按『旧表止度-上期行至+本期行至-新表起度』拼接，遇翻表按口径最大读数（FR-6.2）修正。录入即时校验：负行度（本期<上期且非换表/翻表）、水量为0、水量超近6期均量N倍（N可配置）时标记异常并要求选择异常原因（估抄/复核待办）。抄完当前户，界面下方即时显示按水价试算的账单信息（水量、金额）。"},{"id":"FR-7.2","name":"表格录入","priority":5,"srsRef":"4.7.2","refinedDesc":"通过Excel模板批量导入抄表数据。系统提供标准模板下载（列：户号、表身号、本期行至、抄表日期、备注），内勤填报后上传，系统逐行解析校验：户号存在性、户号在本期计划内、表身号与档案一致、本期行至为数字、同批次/同账期重复行、负行度与超均量异常。校验全部通过（或按『部分通过』策略）后写入抄表记录，异常行不入库并生成错误清单（行号+原因）供下载修正后重新上传。导入结果给出统计：总行数、成功、失败、异常待复核。"},{"id":"FR-7.3","name":"抄表数据导入","priority":1,"srsRef":"4.7.3","refinedDesc":"将抄表机（掌上机）采集数据文件或远传表自动采集数据导入系统。抄表机路径：抄表员外勤抄表后回传数据文件，选择表册与文件上传，系统按设备号+表册匹配任务，解析每户读数、抄表时间、现场照片/坐标（如有）。远传路径：按远传表集抄平台的数据接口/文件定时拉取读数。两路数据统一进入校验流水线：户表匹配、负行度、零水量、超均量、估抄标记识别，合格数据写入抄表记录并计算水量，异常数据进入异常待复核队列。导入结果统计成功/失败/异常户数，支持按表册查看导入明细与未回传户（漏抄）清单。"}]},{"id":"M8","name":"外部接口","srsRef":"5.2","functions":[{"id":"FR-8.1","name":"按户号查询缴费单","priority":1,"srsRef":"5.2.1","refinedDesc":"供银行/第三方渠道按户号实时查询用户欠费缴费单的HTTP接口。平台校验bankentityno（银行实体编号，由平台分配，如GH=工商银行）合法性后，按accno（户号，水表唯一编号）查询用户档案与全部未缴账单，汇总返回：户名、地址、欠费笔数billcount、欠费总额billamount、应收金额rcvblamount、已收金额rcvedamount、滞纳金latefee（按查询当日计算）、预存余额prepayamount，并生成本次查询的平台欠费查询流水号pyqbillid——该流水号是后续销账接口（FR-8.2）锁定账单快照的关键，用于解决跨天滞纳金变化与新增欠费导致的销账失败问题。金额单位统一为分（与销账接口口径一致）。"},{"id":"FR-8.2","name":"缴费单销账","priority":1,"srsRef":"5.2.2","refinedDesc":"银行完成收款后调用的销账接口。核心规则：(1) bankno（银行进账流水号）作为缴费、冲正、对账的唯一凭证，不能重复——平台以其做幂等控制，重复请求返回原销账结果而不重复记账；(2) pyqbillid（平台欠费查询流水号）新开发银行端程序必须提供，提供后平台按查询时点的账单金额快照锁定销账，解决『跨天滞纳金变化导致销账不成功』和『用户新增欠费导致销账不成功』两个棘手问题；提供pyqbillid时accno可不传；(3) payamount（用户实际缴费金额，分）须与billamount（欠费查询时返回的应缴金额，分）比对，不一致则拒绝销账要求重新查询。销账成功后平台核销对应账单、生成平台销账流水pychargeid返回银行，流水记录paydate（银行账务日期yyyyMMdd）与opername（银行操作员）备对账。"},{"id":"FR-8.3","name":"对账","priority":1,"srsRef":"5.2.3","refinedDesc":"银行日终生成代收对账文件并上传至约定目录后，调用本接口通知平台取文件对账。入参：bankentityno（银行实体编号）、filedate（对账文件日期yyyyMMdd）、filepath（对账文件存放相对路径，如/upload/20160829）、filetype（文件类型，DSDZ=代收对账文本）、extend（预留扩展）。平台收到通知后：校验渠道合法与文件可读，异步解析对账文件，按bankno将文件内每笔代收记录与平台渠道销账流水（FR-8.2）逐笔勾对，产出对账结果：平账、长款（银行有平台无）、短款（平台有银行无）、金额不符四类，差错记录进入差错处理队列（补账/冲正/人工处理），生成日对账报告供财务复核，对账平衡后确认资金划转入账。"}]}],"expansion":[{"module":"帐务管理","reason":"3.1功能清单提及、3.2总体功能描述『每笔费用可由财务进行处理』，但3.3清单与第4章均未详述；算费开账是抄表到收费链路的中枢，缺失将导致账单来源无定义。"},{"module":"掌上机抄表管理","reason":"3.1提及且3.2抄表管理描述『提供抄表机抄表』，但第4章仅有导入侧（4.7.3），任务下载、外勤采集、回传的闭环未详述。"},{"module":"银行划帐","reason":"3.1提及、3.2收费管理描述『通过银行托收…实时代收、代扣』，但第4章无对应功能，5.2仅覆盖银行实时代收接口，批量托收划扣未定义。"},{"module":"系统报表","reason":"3.1提及但全文无任何报表定义；3.2抄表管理提到『水量异常的抄表数据报表监控』亦无落地功能。"},{"module":"系统管理","reason":"3.1提及未详述；6.3安全性要求（身份鉴别、口令策略、登录失败处理、角色权限、审计）均需系统管理功能承载，否则安全需求无实现载体。"},{"module":"档案管理（业务办理部分）","reason":"3.2详述了立户、销户、过户、改表、缴费方式变更、银行信息变更及档案变更跟踪，但第4章仅覆盖档案『基础数据』字典，立户等核心业务流程未给出场景描述表。"},{"module":"水表管理（表务全生命周期）","reason":"3.2表务管理详述了入库检验、表身号录入、出库、周期更换、拆表换表、故障、检定与周检，但第4章仅覆盖水表『基础数据』字典，表务台账流程未详述。"}]};
'use strict';
/* ==================== 工具 ==================== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function r2(n){return Math.round((+n||0)*100)/100;}

function nowClock(){const d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}

function cnMoney(n){
  n=Math.round(Math.abs(+n||0)*100)/100;
  const fraction=['角','分'],digit=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'],unit=[['元','万','亿'],['','拾','佰','仟']];
  let s='';
  for(let i=0;i<fraction.length;i++){s+=(digit[Math.floor(n*10*Math.pow(10,i))%10]+fraction[i]).replace(/零./,'');}
  s=s||'整';n=Math.floor(n);
  for(let i=0;i<unit[0].length&&n>0;i++){let p='';
    for(let j=0;j<unit[1].length&&n>0;j++){p=digit[n%10]+unit[1][j]+p;n=Math.floor(n/10);}
    s=p.replace(/(零.)*零$/,'').replace(/^$/,'零')+unit[0][i]+s;}
  return s.replace(/(零.)*零元/,'元').replace(/(零.)+/g,'零').replace(/^整$/,'零元整');
}

/* ==================== 计费引擎（业务参数驱动） ==================== */
function calcBill(vol){
  const p=state.params;vol=Math.max(0,+vol||0);
  const q1=Math.min(vol,p.t1q),q2=Math.min(Math.max(vol-p.t1q,0),Math.max(p.t2q-p.t1q,0)),q3=Math.max(vol-p.t2q,0);
  const w1=r2(q1*p.t1p),w2=r2(q2*p.t2p),w3=r2(q3*p.t3p);
  const water=r2(w1+w2+w3),sew=r2(vol*p.sw);
  return {vol,q1,q2,q3,w1,w2,w3,water,sew,total:r2(water+sew)};
}
function billMoney(bill){
  const c=calcBill(bill.vol);
  const late=r2(c.total*state.params.late/1000*bill.days);
  return {water:c.water,sew:c.sew,late,total:r2(c.total+late)};
}
function userArrears(no){return db.bills.filter(b=>b.userNo===no&&!b.paid);}
function arrearsTotal(no){return r2(userArrears(no).reduce((s,b)=>s+billMoney(b).total,0));}
function userByNo(no){return db.users.find(u=>u.no===no);}
function statusReadable(u){const s=db.dicts.ustatus.find(x=>x.name===u.status);return s?!!s.read:true;}
function isAbnormal(vol,avg){return vol<0||(avg>0&&vol>avg*3);}
function bookByCode(c){return db.books.find(b=>b.code===c);}
/* 状态双通道标识 */
function stChip(kind,txt){
  const map={ok:['●','st-ok'],warn:['▲','st-warn'],over:['◆','st-over'],bad:['✕','st-bad'],mut:['○','st-mut'],blue:['◈','st-blue']};
  const m=map[kind]||map.mut;return '<span class="chip '+m[1]+'">'+m[0]+' '+esc(txt)+'</span>';
}
function ustatusChip(name){
  if(name==='正常')return stChip('ok','正常');
  if(name==='报停'||name==='暂停')return stChip('warn',name);
  if(name==='违章用水')return stChip('bad','违章用水');
  if(name==='销户')return stChip('mut','销户');
  return stChip('mut',name);
}
/* ==================== SVG 图表 ==================== */
function svgBars(data,w,h){
  w=w||560;h=h||190;const pad=30,bw=Math.floor((w-pad*2)/data.length/3);
  const max=Math.max.apply(null,data.map(d=>Math.max(d.ys,d.ss)))*1.15;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px">';
  s+='<line x1="'+pad+'" y1="'+(h-26)+'" x2="'+(w-8)+'" y2="'+(h-26)+'" stroke="rgba(11,11,11,.2)"/>';
  data.forEach((d,i)=>{
    const x=pad+i*((w-pad*2)/data.length)+10;
    const h1=(d.ys/max)*(h-52),h2=(d.ss/max)*(h-52);
    s+='<rect x="'+x+'" y="'+(h-26-h1)+'" width="'+bw+'" height="'+h1+'" rx="2" fill="#1c5cab" opacity=".85"/>';
    s+='<rect x="'+(x+bw+4)+'" y="'+(h-26-h2)+'" width="'+bw+'" height="'+h2+'" rx="2" fill="#0ca30c" opacity=".8"/>';
    s+='<text x="'+(x+bw)+'" y="'+(h-10)+'" font-size="11" fill="#6d6d67" text-anchor="middle">'+d.m+'</text>';
    s+='<text x="'+(x+bw)+'" y="'+(h-30-Math.max(h1,h2))+'" font-size="10" fill="#6d6d67" text-anchor="middle">'+d.ys+'/'+d.ss+'</text>';
  });
  s+='<rect x="'+pad+'" y="6" width="10" height="10" fill="#1c5cab" rx="2"/><text x="'+(pad+14)+'" y="15" font-size="11" fill="#4c4c47">应收(万元)</text>';

function svgHBar(rows,w){
  w=w||520;const rh=30,h=rows.length*rh+8;const max=Math.max.apply(null,rows.map(r=>r.v))*1.15||1;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px">';
  rows.forEach((r,i)=>{
    const y=i*rh+6,bw=Math.max(3,(r.v/max)*(w-190));
    s+='<text x="86" y="'+(y+14)+'" font-size="12" fill="#4c4c47" text-anchor="end">'+esc(r.l)+'</text>';
    s+='<rect x="94" y="'+y+'" width="'+bw+'" height="18" rx="3" fill="'+r.c+'" opacity=".85"/>';
    s+='<text x="'+(98+bw)+'" y="'+(y+14)+'" font-size="11.5" fill="#1e1e1c">'+esc(r.t)+'</text>';
  });
  return s+'</svg>';
}
function svgDonut(pct,color,size){
  size=size||96;const r=(size-14)/2,c=2*Math.PI*r;
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(11,11,11,.08)" stroke-width="11"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(c*pct/100)+' '+c+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="'+size/2+'" y="'+(size/2+5)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1e1c">'+Math.round(pct)+'%</text></svg>';
}

function dictForm(key,i){
  const d=DICT_DEFS[key],r=i>=0?db.dicts[key][i]:{};

    if(c[2]==='ro')return;

      body+='<div class="formrow"><label>'+c[1]+'</label><input type="checkbox" id="df-'+c[0]+'" '+((i<0&&(c[0]==='on'))||r[c[0]]?'checked':'')+' style="width:18px;height:18px"></div>';
    }else{
      body+='<div class="formrow"><label>'+c[1]+'</label><input type="'+(c[2]==='num'?'number':'text')+'" id="df-'+c[0]+'" value="'+esc(r[c[0]]==null?'':r[c[0]])+'" '+(c[0]==='code'&&i>=0?'disabled title="编码创建后不可修改"':'')+'></div>';
    }
  });
  openModal(modalShell((i<0?'新增':'编辑')+' · '+d.title,body,
    '<button class="btn" onclick="A.closeModal()">取消</button><button class="btn btn-pri" onclick="A.dictSave(\''+key+'\','+i+')">保 存</button>'));

A.dictSave=(key,i)=>{
  const d=DICT_DEFS[key],rows=db.dicts[key];
  const r=i>=0?Object.assign({},rows[i]):{};
  let bad=false;
  d.cols.forEach(c=>{
    if(c[2]==='ro')return;
    const el=$('#df-'+c[0]);if(!el)return;
    if(c[2]==='bool')r[c[0]]=el.checked;
    else if(c[2]==='num')r[c[0]]=+el.value||0;
    else r[c[0]]=el.value.trim();
  });
  if(!r.code||!r.name){toast('编码与名称为必填项','tb');return;}
  const dup=rows.some((x,xi)=>xi!==i&&(x.code===r.code||x.name===r.name));
  if(dup){toast('编码或名称重复，校验失败','tb');return;}
  if(i<0){if(key==='ustatus')r.refs=0;rows.push(r);}else rows[i]=r;
  closeModal();renderStage();toast((i<0?'新增':'修改')+'成功','tk');
};
A.dictDel=(key,i)=>{

A.mrSubmit=()=>{
  const bk=state.sel.mrBook,ent=db.manual[bk]||{};

  for(const no of items){
    const u=userByNo(no),vol=r2(+ent[no].cur-u.prev);

  }
  items.forEach(no=>{

    db.reviews.push({id:'R'+reviewSeq,userNo:no,prev:u.prev,cur:+ent[no].cur,avg:u.avg,src:'柜台录入',time:nowClock().slice(0,5),status:'待审核',reason:ent[no].reason||''});

A.mbSkip=()=>{
  const pend=mbPending(state.sel.mbBook);

A.mbSubmit=()=>{
  const bk=state.sel.mbBook,pend=mbPending(bk);
  const u=pend.find(x=>x.no===state.sel.mbUser)||pend[0];
  const vol=r2(+state.sel.mbInput-u.prev);
  if(isAbnormal(vol,u.avg)&&!state.sel.mbReason){toast('水量异常，请先选择异常原因','tb');return;}
  reviewSeq++;
  db.reviews.push({id:'R'+reviewSeq,userNo:u.no,prev:u.prev,cur:+state.sel.mbInput,avg:u.avg,src:'掌上机',time:nowClock().slice(0,5),status:'待审核',reason:state.sel.mbReason||''});
  db.mobileDone[u.no]=true;
  const b=bookByCode(bk);b.done=Math.min(b.total,b.done+1);
  db.sync.pending++;db.sync.ok=false;
  state.sel.mbUser=null;state.sel.mbInput='';state.sel.mbReason='';
  renderStage();toast('已提交 '+u.name+'，转入审核','tk');
};

function render(){
  $$('#devseg button').forEach(b=>b.classList.toggle('on',b.dataset.dev===state.device));

  const st=$('#stage');const w=st.clientWidth,h=st.clientHeight;

$('#stage').addEventListener('click',e=>{
  if(state.tagMode){
    const el=e.target.closest&&e.target.closest('[data-fr],[data-frx]');
    if(el){e.preventDefault();e.stopPropagation();showFrPop(el,e.clientX,e.clientY);return;}
    hideFrPop();return;
  }
  if(!state.noteMode)return;
  const pin=e.target.closest&&e.target.closest('.pin');
  if(pin){e.preventDefault();e.stopPropagation();showPinTip(pin,e.clientX,e.clientY);return;}
  const root=$(pageRootSel());
  if(!root||!root.contains(e.target))return;
  e.preventDefault();e.stopPropagation();
  const r=root.getBoundingClientRect();
  const scale=state.device==='desktop'?1:(state.device==='tablet'?state.tbScale:state.mbScale);
  const x=(e.clientX-r.left)/scale+root.scrollLeft;
  const y=(e.clientY-r.top)/scale+root.scrollTop;
  openNoteForm(x,y);
},true);

A.noteDel=(id)=>{const i=state.notes.findIndex(x=>x.id===id);if(i>=0){state.notes.splice(i,1);saveNotes();renderPins();renderNotesPanel();updateNoteCnt();toast('批注已删除');}};
A.noteGoto=(id)=>{
  const n=state.notes.find(x=>x.id===id);if(!n)return;
  const p=n.loc.split('|');
  state.device=p[0];state.page[p[0]]=p[1];
  if(p[2])state.tabs[p[0]+':'+p[1]]=p[2];
  render();
  setTimeout(()=>{const root=$(pageRootSel());const pin=root&&root.querySelector('[data-note="'+id+'"]');
    if(pin){pin.scrollIntoView({block:'center'});pin.style.transition='transform .2s';pin.style.transform='translate(-50%,-100%) scale(1.5)';setTimeout(()=>{pin.style.transform='translate(-50%,-100%)';},450);}},80);
};
function updateNoteCnt(){
  const c=$('#note-cnt');c.textContent=state.notes.length;
  c.style.display=state.notes.length?'':'none';
}
function saveNotes(){
  try{localStorage.setItem(LS_KEY,JSON.stringify({notes:state.notes,seq:state.noteSeq}));}catch(e){}
}
function loadNotes(){
  try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d&&Array.isArray(d.notes)){state.notes=d.notes;state.noteSeq=d.seq||d.notes.length;}
  }catch(e){}
}
A.exportNotes=()=>{
  if(!state.notes.length){toast('暂无批注可导出','tw');return;}
  const data={project:'供水营销管理系统 · 需求沟通原型',exportedAt:TODAY+' '+nowClock(),
    total:state.notes.length,
    notes:state.notes.map(n=>({no:n.n,device:n.loc.split('|')[0],page:locLabel(n.loc),from:n.from,type:n.type,frRef:n.fr||null,
      frName:n.fr&&FR_INDEX[n.fr]?FR_INDEX[n.fr].name:null,text:n.text,status:n.status,time:n.time,pos:{x:Math.round(n.x),y:Math.round(n.y)}}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='批注导出_shuiwu_proto_20260709.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
  toast('已导出 '+state.notes.length+' 条批注 JSON','tk');
};
/* ==================== ⚙ 业务参数面板 ==================== */
const PARAM_DEFS=[
  ['t1p','第一阶梯单价','元/m³',0.01],['t1q','第一阶梯水量上限','m³/月',1],
  ['t2p','第二阶梯单价','元/m³',0.01],['t2q','第二阶梯水量上限','m³/月',1],
  ['t3p','第三阶梯单价','元/m³',0.01],
  ['sw','污水处理费单价','元/m³',0.01],
  ['late','违约金日率','‰/日',0.1],
  ['bonus','预存赠送比例','%',1],
];
function renderParams(){
  $('#params-body').innerHTML=
  '<div class="mut small" style="margin-bottom:14px">修改参数即刻生效：手工抄表账单预览、柜台销账金额（含违约金）、平板收款、移动端水费试算、欠费账龄报表将实时重算。</div>'+
  PARAM_DEFS.map(p=>'<div class="pfield"><label><span>'+p[1]+'</span><span class="mut">'+p[2]+'</span></label>'+
    '<input type="number" step="'+p[3]+'" value="'+state.params[p[0]]+'" oninput="A.param(\''+p[0]+'\',this.value)"></div>').join('')+
  '<div class="card" style="margin-top:16px"><div class="cbd small">'+
  '<div class="b" style="margin-bottom:6px">示例：月用水 26 m³ 试算</div><div id="param-demo">'+paramDemo()+'</div></div></div>'+
  '<button class="btn" style="width:100%;margin-top:14px" onclick="A.paramReset()">恢复默认参数</button>';
}
function paramDemo(){
  const c=calcBill(26),p=state.params;
  return '一阶 '+c.q1+'×'+p.t1p+'＝'+fmt(c.w1)+'；二阶 '+c.q2+'×'+p.t2p+'＝'+fmt(c.w2)+
  (c.q3>0?'；三阶 '+c.q3+'×'+p.t3p+'＝'+fmt(c.w3):'')+
  '；污水 26×'+p.sw+'＝'+fmt(c.sew)+'<br>合计 <b style="color:var(--blue)">¥'+fmt(c.total)+'</b>';
}
let pflashTimer=null;
A.param=(k,v)=>{
  const n=parseFloat(v);
  if(isNaN(n)||n<0)return;
  state.params[k]=n;
  const d=$('#param-demo');if(d)d.innerHTML=paramDemo();
  const f=$('#pflash');f.classList.add('show');
  clearTimeout(pflashTimer);pflashTimer=setTimeout(()=>f.classList.remove('show'),1600);
  renderStage();
};
A.paramReset=()=>{state.params={t1p:2.80,t1q:15,t2p:3.90,t2q:22,t3p:5.60,sw:1.40,late:0.5,bonus:5};renderParams();renderStage();toast('已恢复默认参数','tk');};
/* ==================== 面板开关 ==================== */
A.togglePanel=(which)=>{
  const dp=$('#drawer-params'),dn=$('#drawer-notes');
  if(which==='params'){
    const open=!dp.classList.contains('open');
    dp.classList.toggle('open',open);dn.classList.remove('open');
    $('#btn-params').classList.toggle('on',open);$('#btn-panel').classList.remove('on');
    if(open)renderParams();
  }else{
    const open=!dn.classList.contains('open');
    dn.classList.toggle('open',open);dp.classList.remove('open');
    $('#btn-panel').classList.toggle('on',open);$('#btn-params').classList.remove('on');
    if(open)renderNotesPanel();
  }
};
$('#modal-mask').addEventListener('click',e=>{if(e.target.id==='modal-mask')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();hideFrPop();$('#pin-tip').style.display='none';}});
/* ==================== 启动 ==================== */
loadNotes();
updateNoteCnt();
render();

</script>
