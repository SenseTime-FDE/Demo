  <ellipse cx="1070" cy="470" rx="250" ry="232" fill="none" stroke="#ece0cb" stroke-width="3"/>
  <!-- grain base -->
  <ellipse cx="1070" cy="500" rx="225" ry="195" fill="#f0e2c0"/>
  <!-- greens -->
