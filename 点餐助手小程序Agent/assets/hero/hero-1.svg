  <circle cx="1110" cy="560" r="24" fill="#f4b836"/>
  <!-- chickpeas -->
  <circle cx="980" cy="420" r="15" fill="#e7c986"/><circle cx="1010" cy="400" r="13" fill="#e7c986"/>
  <circle cx="1240" cy="540" r="14" fill="#e7c986"/><circle cx="1215" cy="585" r="12" fill="#e7c986"/>
  <!-- seeds -->
  <g fill="#7a5a2c" opacity="0.7"><circle cx="1080" cy="470" r="4"/><circle cx="1100" cy="500" r="4"/><circle cx="1050" cy="510" r="4"/><circle cx="1130" cy="490" r="4"/></g>
</svg>
