    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#c9e09a"/>
  </g>
  <g transform="translate(1190 470) rotate(35)">
    <ellipse cx="0" cy="0" rx="64" ry="30" fill="#9cc46a"/>
    <ellipse cx="0" cy="0" rx="52" ry="21" fill="#c9e09a"/>
  </g>
  <!-- cherry tomatoes -->
  <circle cx="960" cy="560" r="34" fill="#e0533d"/><circle cx="949" cy="549" r="9" fill="#f3a08f" opacity="0.8"/>
  <circle cx="1035" cy="600" r="30" fill="#e0533d"/><circle cx="1025" cy="591" r="8" fill="#f3a08f" opacity="0.8"/>
  <!-- egg -->
