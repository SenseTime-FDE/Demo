<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf7b3c"/><stop offset="1" stop-color="#a85423"/>
    </linearGradient>
    <radialGradient id="spot1" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect width="1600" height="900" fill="url(#spot1)"/>
  <circle cx="1080" cy="470" r="330" fill="#000" opacity="0.06"/>
  <circle cx="1070" cy="455" r="320" fill="#f6efe2"/>
  <circle cx="1070" cy="455" r="320" fill="none" stroke="#e6d9c2" stroke-width="4"/>
