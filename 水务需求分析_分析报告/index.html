/* ---------------- status rules ---------------- */
var ST = {
  ok:  {k:'ok',  icon:'●', label:'正常',   color:C.ok},
  warn:{k:'warn',icon:'▲', label:'预警',   color:C.warn},
  over:{k:'over',icon:'✖', label:'超限',   color:C.over},
  crit:{k:'crit',icon:'✖', label:'严重',   color:C.crit},
  na:  {k:'na',  icon:'○', label:'无数据', color:C.na},
  hit: {k:'ok',  icon:'●', label:'达标',   color:C.ok},
  miss:{k:'crit',icon:'✖', label:'未达标', color:C.crit}
};
function stDev(dev, thrPct){
  if (dev==null || isNaN(dev)) return ST.na;
  var a = Math.abs(dev)*100, wf = S.params.warnFactor;
  if (a <= thrPct*wf) return ST.ok;
  if (a <= thrPct) return ST.warn;
  if (a <= thrPct*2) return ST.over;
  return ST.crit;
}
function stTarget(v, target, dir){
  if (v==null || isNaN(v)) return ST.na;
  var ok = dir==='lte' ? (v <= target) : (v >= target);
  return ok ? ST.hit : ST.miss;
}
function stBadge(st){
  return '<span class="st st-'+st.k+'" style="color:'+st.color+'">'+st.icon+' '+st.label+'</span>';
}

/* ---------------- derived recompute（改动即全页重算） ---------------- */
function computeDerived(d){
  var p1 = d.metrics.projects[0], p2 = d.metrics.projects[1];
  /* --- P1 规模 --- */
  p1.sizeFP.byPhase.forEach(function(r){
    r.devRate = (r.estimated!=null && r.actual!=null && Number(r.estimated)!==0)
      ? (r.actual - r.estimated)/r.estimated : null;
  });
  var lastPh = p1.sizeFP.byPhase[p1.sizeFP.byPhase.length-1];
  if (lastPh && lastPh.actual!=null) p1.sizeFP.actual = Number(lastPh.actual);
  /* --- P1 工作量 --- */
  var e1rows = p1.effort.filter(function(r){ return r.no!=null; });
  var e1tot = p1.effort.filter(function(r){ return r.no==null; })[0];
  e1rows.forEach(function(r){
    r.devRate = (r.estReq!=null && Number(r.estReq)!==0 && r.actual!=null)
      ? (r.actual - r.estReq)/r.estReq : null;
  });
  if (e1tot){
    e1tot.estPlan = sum(e1rows,'estPlan');
    e1tot.estReq = sum(e1rows,'estReq');
    e1tot.actual = sum(e1rows,'actual');
    e1tot.devRate = e1tot.estReq ? (e1tot.actual - e1tot.estReq)/e1tot.estReq : null;
  }
  /* --- P1 进度 --- */
  p1.schedule.forEach(function(r){
    r.devDays = (r.actDays!=null && r.planDays!=null) ? r.actDays - r.planDays : null;
    r.devRate = (r.planDays && r.devDays!=null) ? r.devDays/r.planDays : null;
  });
  /* --- P1 成本 --- */
  var c1rows = p1.cost.filter(function(r){ return r.milestone!=='总计'; });
  var c1tot = p1.cost.filter(function(r){ return r.milestone==='总计'; })[0];
  c1rows.forEach(function(r){
    r.devRate = (r.estimated && r.actual!=null) ? (r.actual - r.estimated)/r.estimated : null;
  });
  if (c1tot){
    c1tot.estimated = sum(c1rows,'estimated');
    c1tot.actual = sum(c1rows,'actual');
    c1tot.devRate = c1tot.estimated ? (c1tot.actual - c1tot.estimated)/c1tot.estimated : null;
  }
  /* --- P1 KPI --- */
  var k1 = p1.kpis;
  k1.sizeFPActual = p1.sizeFP.actual;
  k1.totalEffortDays = e1tot ? e1tot.actual : sum(e1rows,'actual');
  k1.totalEffortEstReqDays = e1tot ? e1tot.estReq : sum(e1rows,'estReq');
  k1.effortDevRate = k1.totalEffortEstReqDays ? (k1.totalEffortDays - k1.totalEffortEstReqDays)/k1.totalEffortEstReqDays : null;
  k1.productivityFPperDay = k1.totalEffortDays ? k1.sizeFPActual/k1.totalEffortDays : null;
  k1.hourPerFP = k1.sizeFPActual ? k1.totalEffortDays*8/k1.sizeFPActual : null;
  k1.totalDurationPlanDays = sum(p1.schedule,'planDays');
  k1.totalDurationActDays = sum(p1.schedule,'actDays');
  k1.scheduleDevRate = k1.totalDurationPlanDays ? (k1.totalDurationActDays - k1.totalDurationPlanDays)/k1.totalDurationPlanDays : null;
  if (c1tot){ k1.totalCostEst = c1tot.estimated; k1.totalCostAct = c1tot.actual; k1.costDevRate = c1tot.devRate; }
  k1.costPerDayAct = k1.totalDurationActDays ? k1.totalCostAct/k1.totalDurationActDays : null;
  k1.costPerFPAct = k1.sizeFPActual ? k1.totalCostAct/k1.sizeFPActual : null;
  var reqPh = null;
  p1.sizeFP.byPhase.forEach(function(r){ if (r.phase==='需求') reqPh = r; });
  k1.sizeDevRate = reqPh ? reqPh.devRate : null;
  p1.attrs.actualSizeFP = k1.sizeFPActual;
  p1.attrs.totalEffortDays = k1.totalEffortDays;
  p1.attrs.productivityFPperDay = k1.productivityFPperDay;

  /* --- P2 规模 --- */
  p2.sizeFP.dev = (p2.sizeFP.estimated && p2.sizeFP.actual!=null)
    ? (p2.sizeFP.actual - p2.sizeFP.estimated)/p2.sizeFP.estimated : null;
  /* --- P2 工作量（累计口径） --- */
  var e2rows = p2.effort.filter(function(r){ return r.phase!=='总计'; });
  var e2tot = p2.effort.filter(function(r){ return r.phase==='总计'; })[0];
  var cp=0, ca=0, e2ActTotal = sum(e2rows,'actual');
  e2rows.forEach(function(r){
    cp += Number(r.plan)||0; ca += Number(r.actual)||0;
    r.cumDevRate = cp ? (ca-cp)/cp : null;
    r.distribution = e2ActTotal ? (Number(r.actual)||0)/e2ActTotal : null;
  });
  if (e2tot){ e2tot.plan = cp; e2tot.actual = ca; e2tot.distribution = 1; e2tot.cumDevRate = cp ? (ca-cp)/cp : null; }
  /* --- P2 工期（累计口径） --- */
  var s2rows = p2.schedule.filter(function(r){ return r.phase!=='总计'; });
  var s2tot = p2.schedule.filter(function(r){ return r.phase==='总计'; })[0];
  var pc=0, ac=0;
  s2rows.forEach(function(r){
    pc += Number(r.planDays)||0; ac += Number(r.actDays)||0;
    r.planCumDays = pc; r.actCumDays = ac;
    r.cumDevRate = pc ? (ac-pc)/pc : null;
  });
  if (s2tot){ s2tot.planDays=pc; s2tot.actDays=ac; s2tot.planCumDays=pc; s2tot.actCumDays=ac; s2tot.cumDevRate = pc ? (ac-pc)/pc : null; }
  /* --- P2 成本（累计口径） --- */
  var c2rows = p2.cost.filter(function(r){ return r.phase!=='总计'; });
  var c2tot = p2.cost.filter(function(r){ return r.phase==='总计'; })[0];
  var cpp=0, cca=0;
  c2rows.forEach(function(r){
    cpp += Number(r.plan)||0; cca += Number(r.actual)||0;
    r.cumDevRate = cpp ? (cca-cpp)/cpp : null;
  });
  if (c2tot){ c2tot.plan=cpp; c2tot.actual=cca; c2tot.cumDevRate = cpp ? (cca-cpp)/cpp : null; }
  /* --- P2 缺陷 --- */
  var fp2 = Number(p2.sizeFP.actual)||0;
  var dRows = p2.defects.byTest.filter(function(r){ return r.type!=='总计'; });
  var dTot = p2.defects.byTest.filter(function(r){ return r.type==='总计'; })[0];
  dRows.forEach(function(r){
    r.total = (Number(r.fatal)||0)+(Number(r.severe)||0)+(Number(r.normal)||0)+(Number(r.minor)||0);
    r.weighted = DEFECT_W.fatal*(Number(r.fatal)||0) + DEFECT_W.severe*(Number(r.severe)||0)
               + DEFECT_W.normal*(Number(r.normal)||0) + DEFECT_W.minor*(Number(r.minor)||0);
    r.density = fp2 ? r.weighted/fp2 : null;
    if (r.closed==null || r.closed > r.total) r.closed = r.total;
    r.fixRate = r.total ? r.closed/r.total : null;
  });
  if (dTot){
    ['fatal','severe','normal','minor','total','weighted','closed'].forEach(function(k){ dTot[k] = sum(dRows,k); });
    dTot.density = fp2 ? dTot.weighted/fp2 : null;
    dTot.fixRate = dTot.total ? dTot.closed/dTot.total : null;
    dTot.detectRate = null;
  }
  var sit=null, acc=null;
  dRows.forEach(function(r){
    if (r.type.indexOf('集成')>=0) sit=r;
    else if (r.type.indexOf('验收')>=0) acc=r;
  });
  if (sit){
    var denom = sit.weighted + (acc?acc.weighted:0);
    sit.detectRate = denom>0 ? sit.weighted/denom : null;
  }
  if (acc) acc.detectRate = null;
  var rv = p2.defects.reviewDefects;
  if (rv){
    rv.total = (Number(rv.severe)||0)+(Number(rv.normal)||0)+(Number(rv.minor)||0);
    if (rv.closed==null || rv.closed>rv.total) rv.closed = rv.total;
    rv.efficiency = (Number(rv.reviewHours)||0) ? rv.total/Number(rv.reviewHours) : null;
  }
  /* --- P2 KPI --- */
  var k2 = p2.kpis;
  k2.sizeFPEstimated = p2.sizeFP.estimated; k2.sizeFPActual = p2.sizeFP.actual; k2.sizeDevRate = p2.sizeFP.dev;
  if (e2tot){ k2.totalEffortPlanDays = e2tot.plan; k2.totalEffortActDays = e2tot.actual; k2.effortDevRate = e2tot.cumDevRate; }
  k2.productivityFPperDay = k2.totalEffortActDays ? k2.sizeFPActual/k2.totalEffortActDays : null;
  k2.hourPerFP = k2.sizeFPActual ? k2.totalEffortActDays*8/k2.sizeFPActual : null;
  p2.hourPerFP = k2.hourPerFP;
  if (s2tot){ k2.totalDurationPlanDays = s2tot.planDays; k2.totalDurationActDays = s2tot.actDays; k2.scheduleDevRate = s2tot.cumDevRate; }
  if (c2tot){ k2.totalCostEst = c2tot.plan; k2.totalCostAct = c2tot.actual; k2.costDevRate = c2tot.cumDevRate; }
  k2.costPerDayAct = k2.totalDurationActDays ? k2.totalCostAct/k2.totalDurationActDays : null;
  k2.costPerFPAct = k2.sizeFPActual ? k2.totalCostAct/k2.sizeFPActual : null;
  k2.defectDensity = dTot ? dTot.density : null;
  k2.detectRate = sit ? sit.detectRate : null;
  k2.reviewEfficiency = rv ? rv.efficiency : null;
  /* 质量统计 */
  recalcQualityStats(d);
}
function recalcQualityStats(d){
  var fs = d.quality.findings;
  var st = { total: fs.length, bySeverity:{'高':0,'中':0,'低':0}, byCategory:{}, byStatus:{} };
  fs.forEach(function(f){
    if (st.bySeverity[f.severity]==null) st.bySeverity[f.severity]=0;
    st.bySeverity[f.severity]++;
    st.byCategory[f.category] = (st.byCategory[f.category]||0)+1;
    st.byStatus[f.status] = (st.byStatus[f.status]||0)+1;
  });
  d.quality.stats = st;
}

/* ---------------- 核心指标状态汇总（总览&报告共用） ---------------- */
function coreIndicators(){
  var d = S.data, P = S.params;
  var p1 = d.metrics.projects[0], p2 = d.metrics.projects[1];
  var k1 = p1.kpis, k2 = p2.kpis;

    {proj:'P1', dim:'工作量偏差', plan:fmtN(k1.totalEffortEstReqDays,1)+' 人天', act:fmtN(k1.totalEffortDays,1)+' 人天', dev:k1.effortDevRate, thr:P.effortDev, st:stDev(k1.effortDevRate, P.effortDev)},
    {proj:'P1', dim:'工期偏差', plan:fmtInt(k1.totalDurationPlanDays)+' 天', act:fmtInt(k1.totalDurationActDays)+' 天', dev:k1.scheduleDevRate, thr:P.scheduleDev, st:stDev(k1.scheduleDevRate, P.scheduleDev)},
    {proj:'P1', dim:'成本偏差', plan:fmtN(k1.totalCostEst,0)+' 元', act:fmtN(k1.totalCostAct,0)+' 元', dev:k1.costDevRate, thr:P.costDev, st:stDev(k1.costDevRate, P.costDev)},
    {proj:'P1', dim:'功能点耗时率', plan:'≤'+fmtN(P.hourPerFP,2)+' 人时/FP', act:fmtN(k1.hourPerFP,2)+' 人时/FP', dev:null, thr:null, st:stTarget(k1.hourPerFP, P.hourPerFP, 'lte')},
    {proj:'P2', dim:'规模偏差', plan:fmtInt(k2.sizeFPEstimated)+' FP', act:fmtInt(k2.sizeFPActual)+' FP', dev:k2.sizeDevRate, thr:P.sizeDev, st:stDev(k2.sizeDevRate, P.sizeDev)},
    {proj:'P2', dim:'工作量偏差', plan:fmtN(k2.totalEffortPlanDays,1)+' 人天', act:fmtN(k2.totalEffortActDays,1)+' 人天', dev:k2.effortDevRate, thr:P.effortDev, st:stDev(k2.effortDevRate, P.effortDev)},
    {proj:'P2', dim:'工期偏差', plan:fmtInt(k2.totalDurationPlanDays)+' 天', act:fmtInt(k2.totalDurationActDays)+' 天', dev:k2.scheduleDevRate, thr:P.scheduleDev, st:stDev(k2.scheduleDevRate, P.scheduleDev)},
    {proj:'P2', dim:'成本偏差', plan:fmtN(k2.totalCostEst,0)+' 元', act:fmtN(k2.totalCostAct,0)+' 元', dev:k2.costDevRate, thr:P.costDev, st:stDev(k2.costDevRate, P.costDev)},
    {proj:'P2', dim:'功能点耗时率', plan:'≤'+fmtN(P.hourPerFP,2)+' 人时/FP', act:fmtN(k2.hourPerFP,2)+' 人时/FP', dev:null, thr:null, st:stTarget(k2.hourPerFP, P.hourPerFP, 'lte')},
    {proj:'P2', dim:'缺陷探测率', plan:'≥'+fmtN(P.detectRate,0)+'%', act:fmtPctAbs(k2.detectRate,1), dev:null, thr:null, st:stTarget(k2.detectRate, P.detectRate/100, 'gte')},
    {proj:'P2', dim:'评审效率', plan:'≥'+fmtN(P.reviewEff,2)+' 个/人时', act:fmtN(k2.reviewEfficiency,2)+' 个/人时', dev:null, thr:null, st:stTarget(k2.reviewEfficiency, P.reviewEff, 'gte')}
  ];
  return list;
}
/* 明细级扫描：所有阶段/里程碑行的状态（供报告"超限/预警项明细"） */
function scanDetailStatuses(){
  var d = S.data, P = S.params, out = [];
  var p1 = d.metrics.projects[0], p2 = d.metrics.projects[1];
  p1.sizeFP.byPhase.forEach(function(r){
    if (r.devRate==null) return;
    out.push({proj:'P1', dim:'规模', item:r.phase, plan:fmtInt(r.estimated)+' FP', act:fmtInt(r.actual)+' FP', dev:r.devRate, thr:P.sizeDev, st:stDev(r.devRate,P.sizeDev)});
  });
  p1.effort.forEach(function(r){
    if (r.devRate==null) return;
    var nm = r.no==null ? '所有活动总计' : (r.category==='软件工程活动'? r.activity : r.category);
    out.push({proj:'P1', dim:'工作量', item:nm, plan:fmtN(r.estReq,1)+' 人天', act:fmtN(r.actual,1)+' 人天', dev:r.devRate, thr:P.effortDev, st:stDev(r.devRate,P.effortDev)});
  });
  p1.schedule.forEach(function(r){
    if (r.devRate==null) return;
    out.push({proj:'P1', dim:'进度', item:r.phase, plan:fmtInt(r.planDays)+' 天', act:fmtInt(r.actDays)+' 天', dev:r.devRate, thr:P.scheduleDev, st:stDev(r.devRate,P.scheduleDev)});
  });
  p1.cost.forEach(function(r){
    if (r.devRate==null) return;
    out.push({proj:'P1', dim:'成本', item:r.milestone, plan:fmtN(r.estimated,0)+' 元', act:fmtN(r.actual,0)+' 元', dev:r.devRate, thr:P.costDev, st:stDev(r.devRate,P.costDev)});
  });
  p2.effort.forEach(function(r){
    if (r.cumDevRate==null) return;
    out.push({proj:'P2', dim:'工作量(累计)', item:r.phase, plan:fmtN(r.plan,1)+' 人天', act:fmtN(r.actual,1)+' 人天', dev:r.cumDevRate, thr:P.effortDev, st:stDev(r.cumDevRate,P.effortDev)});
  });
  p2.schedule.forEach(function(r){
    if (r.cumDevRate==null) return;
    out.push({proj:'P2', dim:'工期(累计)', item:r.phase, plan:fmtInt(r.planCumDays)+' 天', act:fmtInt(r.actCumDays)+' 天', dev:r.cumDevRate, thr:P.scheduleDev, st:stDev(r.cumDevRate,P.scheduleDev)});
  });
  p2.cost.forEach(function(r){
    if (r.cumDevRate==null) return;
    out.push({proj:'P2', dim:'成本(累计)', item:r.phase, plan:fmtN(r.plan,0)+' 元', act:fmtN(r.actual,0)+' 元', dev:r.cumDevRate, thr:P.costDev, st:stDev(r.cumDevRate,P.costDev)});
  });
  return out;
}

  computeDerived(S.data);

    var pg = document.getElementById('page-'+t.id);

  });

  if (active==='overview') renderOverview();

/* ============================================================
 * SVG 图表渲染器（原生JS，viewBox 响应式）
 * 规范：细柱≤28、柱端4px圆角、并列柱2px留白、折线2px、
 *       网格#e1e0d9发丝线、轴标签#898781、数值文本色、
 *       ≥2系列必有图例、悬停tooltip
 * ============================================================ */
function niceCeil(v){
  if (v<=0) return 1;
  var p = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var m = v/p;
  var steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  var nice = 10;
  for (var i=0;i<steps.length;i++){ if (m <= steps[i]){ nice = steps[i]; break; } }
  return nice*p;
}
function legendDiv(items){
  var d = h('div', {class:'legend'});
  items.forEach(function(i){
    d.appendChild(h('span', {class:'lg-item', html:'<span class="sw" style="background:'+i.color+'"></span>'+esc(i.name)}));
  });
  return d;
}
function roundTopRectPath(x, y, w, hgt, r){
  if (hgt<=0) return '';
  r = Math.min(r, w/2, hgt);
  return 'M'+x+','+(y+hgt)+' L'+x+','+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+
         ' L'+(x+w-r)+','+y+' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+
         ' L'+(x+w)+','+(y+hgt)+' Z';
}
function wrapLabel(s, maxChars){
  s = String(s==null?'':s);
  var lines = [];
  for (var i=0;i<s.length;i+=maxChars){ lines.push(s.slice(i, i+maxChars)); if (lines.length>=2){ if (i+maxChars<s.length) lines[1] = lines[1].slice(0,maxChars-1)+'…'; break; } }
  return lines.length?lines:[''];
}
/* ---------- 分组柱图 ---------- */
function chartGroupedBars(opts){
  var cats = opts.cats, series = opts.series;
  var H = opts.H || 260;
  var W = opts.W || Math.max(420, cats.length * Math.max(72, series.length*34) + 80);
  var m = {l: opts.ml||58, r:14, t: opts.yLabel? 26 : 14, b:36};
  var iw = W-m.l-m.r, ih = H-m.t-m.b;
  var maxV = 0;
  series.forEach(function(s){ s.values.forEach(function(v){ if (v!=null && v>maxV) maxV=v; }); });
  var ymax = niceCeil(maxV*1.12 || 1);
  var yPix = function(v){ return m.t + ih - (v/ymax)*ih; };
  var svg = svgE('svg', {viewBox:'0 0 '+W+' '+H, style:'width:100%;height:auto', role:'img'});
  if (opts.aria) svg.appendChild(svgE('title')).textContent = opts.aria;
  var yFmt = opts.yFmt || function(v){ return fmtInt(v); };
  /* grid + y labels */
  for (var t=0;t<=4;t++){
    var val = ymax*t/4, gy = yPix(val);
    svg.appendChild(svgE('line', {x1:m.l, y1:gy, x2:W-m.r, y2:gy, stroke:C.grid, 'stroke-width':1}));
    var yl = svgE('text', {x:m.l-7, y:gy+3.5, 'text-anchor':'end', 'font-size':10.5, fill:C.axis});
    yl.textContent = yFmt(val);
    svg.appendChild(yl);
  }
  if (opts.yLabel){
    var ylab = svgE('text', {x:m.l-7, y:11, 'text-anchor':'end', 'font-size':9.5, fill:C.axis});
    ylab.textContent = '单位:'+opts.yLabel;
    svg.appendChild(ylab);
  }
  var colW = iw/cats.length;
  var bw = Math.min(28, Math.max(8, (colW*0.62 - (series.length-1)*2)/series.length));
  var groupW = series.length*bw + (series.length-1)*2;
  cats.forEach(function(cat, ci){
    var cx = m.l + colW*ci + colW/2;
    /* x label */
    var lines = wrapLabel(cat, Math.max(3, Math.floor(colW/12)));
    lines.forEach(function(ln, li){
      var xl = svgE('text', {x:cx, y:H-m.b+14+li*12, 'text-anchor':'middle', 'font-size':10.5, fill:C.axis});
      xl.textContent = ln;
      svg.appendChild(xl);
    });
    series.forEach(function(s, si){
      var v = s.values[ci];
      if (v==null) return;
      var x = cx - groupW/2 + si*(bw+2);
      var y = yPix(v), hh = m.t+ih-y;
      var p = svgE('path', {d:roundTopRectPath(x,y,bw,hh,4), fill:s.color, class:'bar'});
      bindTip(p, function(){
        var html = '<b>'+esc(cat)+'</b>';
        series.forEach(function(s2){
          var v2 = s2.values[ci];
          html += '<br>'+esc(s2.name)+'：<b>'+(opts.tipFmt? opts.tipFmt(v2) : fmtN(v2,1))+'</b>';
        });
        if (series.length===2 && series[0].values[ci]){
          var dev = (series[1].values[ci]-series[0].values[ci])/series[0].values[ci];
          html += '<br><span class="tt-dim">偏差率：</span>'+fmtPct(dev);
        }
        if (opts.tipExtra){ var ex = opts.tipExtra(ci); if (ex) html += '<br>'+ex; }
        return html;
      });
      svg.appendChild(p);
    });
  });
  /* baseline */
  svg.appendChild(svgE('line', {x1:m.l, y1:m.t+ih, x2:W-m.r, y2:m.t+ih, stroke:C.axis, 'stroke-width':1}));
  var wrap = h('div');
  if (series.length>=2) wrap.appendChild(legendDiv(series.map(function(s){ return {name:s.name, color:s.color}; })));
  var sw = h('div', {class:'chart-svg-wrap'});
  sw.appendChild(svg);
  wrap.appendChild(sw);
  return wrap;
}
/* ---------- 折线图（可选控制范围背景带） ---------- */
function chartLines(opts){
  var cats = opts.cats, series = opts.series;
  var H = opts.H || 280;
  var W = opts.W || Math.max(480, cats.length*96 + 90);
  var m = {l: opts.ml||58, r:52, t:14, b:36};
  var iw = W-m.l-m.r, ih = H-m.t-m.b;
  var isPct = !!opts.isPct;
  var vmin = Infinity, vmax = -Infinity;
  series.forEach(function(s){ s.values.forEach(function(v){ if (v!=null){ if (v<vmin)vmin=v; if(v>vmax)vmax=v; } }); });
  var ymin, ymax;
  if (isPct){
    var thrMax = 0;
    (opts.thresholds||[]).forEach(function(t){ if (t.v>thrMax) thrMax=t.v; });
    var ext = Math.max(Math.abs(vmin), Math.abs(vmax), thrMax)*1.3 || 0.1;
    ymax = ext; ymin = -ext;
  } else {
    ymax = niceCeil(vmax*1.08||1);
    ymin = opts.zeroBase===false ? Math.floor(vmin*0.92) : 0;
  }
  var yPix = function(v){ return m.t + ih - ((v-ymin)/(ymax-ymin))*ih; };
  var xPix = function(i){ return m.l + (cats.length===1? iw/2 : (iw*i/(cats.length-1))); };
  var svg = svgE('svg', {viewBox:'0 0 '+W+' '+H, style:'width:100%;height:auto', role:'img'});
  /* 控制范围背景带（绿区/黄区/超限区，双通道：右侧文字标注） */
  if (isPct && opts.thresholds && opts.thresholds.length){
    var thrs = opts.thresholds.map(function(t){ return t.v; });
    var tmin = Math.min.apply(null, thrs);
    var wf = opts.warnFactor!=null ? opts.warnFactor : 0.6;
    var zones = [
      {y1:-tmin*wf, y2:tmin*wf, color:C.ok, op:0.07, label:'绿区'},
      {y1:tmin*wf, y2:tmin, color:C.warn, op:0.10, label:'黄区'},
      {y1:-tmin, y2:-tmin*wf, color:C.warn, op:0.10, label:''},
      {y1:tmin, y2:ymax, color:C.over, op:0.07, label:'超限'},
      {y1:ymin, y2:-tmin, color:C.over, op:0.07, label:''}
    ];
    zones.forEach(function(z){
      var yTop = yPix(Math.min(z.y2, ymax)), yBot = yPix(Math.max(z.y1, ymin));
      if (yBot<=yTop) return;
      svg.appendChild(svgE('rect', {x:m.l, y:yTop, width:iw, height:yBot-yTop, fill:z.color, opacity:z.op}));
      if (z.label){
        var zl = svgE('text', {x:m.l+iw+4, y:(yTop+yBot)/2+3, 'font-size':9.5, fill:C.axis});
        zl.textContent = z.label;
        svg.appendChild(zl);
      }
    });
    /* 阈值虚线（每个唯一阈值） */
    var seen = {};
    opts.thresholds.forEach(function(t){
      if (seen[t.v]) { seen[t.v].push(t.label); return; }
      seen[t.v] = [t.label];
    });
    Object.keys(seen).forEach(function(vs){
      var v = Number(vs);
      [v,-v].forEach(function(vv, idx){
        var yy = yPix(vv);
        if (yy<m.t-1 || yy>m.t+ih+1) return;
        svg.appendChild(svgE('line', {x1:m.l, y1:yy, x2:m.l+iw, y2:yy, stroke:C.over, 'stroke-width':1, 'stroke-dasharray':'5 4', opacity:0.8}));
        var tl = svgE('text', {x:m.l+iw+4, y:yy+3, 'font-size':9.5, fill:C.over});
        tl.textContent = (vv>0?'+':'−')+Math.abs(v*100).toFixed(0)+'%';
        svg.appendChild(tl);
      });
    });
  }
  /* grid + y labels */
  var nT = 4;
  for (var t=0;t<=nT;t++){
    var val = ymin + (ymax-ymin)*t/nT, gy = yPix(val);
    svg.appendChild(svgE('line', {x1:m.l, y1:gy, x2:m.l+iw, y2:gy, stroke:C.grid, 'stroke-width':1}));
    var yl = svgE('text', {x:m.l-7, y:gy+3.5, 'text-anchor':'end', 'font-size':10.5, fill:C.axis});
    yl.textContent = isPct? (val*100).toFixed(0)+'%' : (opts.yFmt? opts.yFmt(val) : fmtInt(val));
    svg.appendChild(yl);
  }
  /* zero line */
  if (isPct){
    svg.appendChild(svgE('line', {x1:m.l, y1:yPix(0), x2:m.l+iw, y2:yPix(0), stroke:C.axis, 'stroke-width':1}));
  }
  /* x labels */
  cats.forEach(function(cat, i){
    var lines = wrapLabel(cat, 5);
    lines.forEach(function(ln, li){
      var xl = svgE('text', {x:xPix(i), y:H-m.b+14+li*12, 'text-anchor':'middle', 'font-size':10.5, fill:C.axis});
      xl.textContent = ln;
      svg.appendChild(xl);
    });
  });
  /* lines */
  series.forEach(function(s){
    var dParts = [], started = false;
    s.values.forEach(function(v,i){
      if (v==null){ started=false; return; }
      dParts.push((started?'L':'M')+xPix(i)+','+yPix(v));
      started = true;
    });
    var path = svgE('path', {d:dParts.join(' '), fill:'none', stroke:s.color, 'stroke-width':2,
      'stroke-linejoin':'round', 'stroke-linecap':'round'});
    if (s.dash) path.setAttribute('stroke-dasharray', s.dash);
    svg.appendChild(path);
  });
  /* points + hover targets */
  series.forEach(function(s, si){
    s.values.forEach(function(v,i){
      if (v==null) return;
      svg.appendChild(svgE('circle', {cx:xPix(i), cy:yPix(v), r:3.5, fill:s.color, stroke:C.surface, 'stroke-width':1.5}));
      var hit = svgE('circle', {cx:xPix(i), cy:yPix(v), r:11, fill:'transparent', class:'bar'});
      bindTip(hit, function(){
        if (opts.tip) return opts.tip(si, i);
        var html = '<b>'+esc(cats[i])+'</b><br>'+esc(s.name)+'：<b>'+(isPct? fmtPct(v) : fmtN(v,1))+'</b>';
        return html;
      });
      svg.appendChild(hit);
    });
  });
  var wrap = h('div');
  if (series.length>=2) wrap.appendChild(legendDiv(series.map(function(s){ return {name:s.name, color:s.color}; })));
  var sw = h('div', {class:'chart-svg-wrap'});
  sw.appendChild(svg);
  wrap.appendChild(sw);
  return wrap;
}
/* ---------- 环形图 ---------- */
function chartDonut(opts){
  var items = opts.items;
  var size = opts.size || 220;
  var cx = size/2, cy = size/2, R = size/2-8, r = R*0.62;
  var total = 0;
  items.forEach(function(i){ total += i.value; });
  var svg = svgE('svg', {viewBox:'0 0 '+size+' '+size, style:'width:100%;max-width:'+size+'px;height:auto;margin:0 auto;display:block'});
  var a0 = -Math.PI/2;
  items.forEach(function(it){
    if (!it.value) return;
    var frac = it.value/(total||1);
    var a1 = a0 + frac*2*Math.PI;
    var large = (a1-a0) > Math.PI ? 1 : 0;
    var x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0), x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    var xi1=cx+r*Math.cos(a1), yi1=cy+r*Math.sin(a1), xi0=cx+r*Math.cos(a0), yi0=cy+r*Math.sin(a0);
    var d;
    if (frac >= 0.99999){
      d = 'M'+cx+','+(cy-R)+' A'+R+','+R+' 0 1 1 '+(cx-0.01)+','+(cy-R)+
          ' M'+cx+','+(cy-r)+' A'+r+','+r+' 0 1 0 '+(cx-0.01)+','+(cy-r);
      var full = svgE('path', {d:d, fill:it.color, 'fill-rule':'evenodd', stroke:C.surface, 'stroke-width':2, class:'bar'});
      bindTip(full, function(){ return '<b>'+esc(it.label)+'</b><br>数量：<b>'+it.value+'</b>（100%）'; });
      svg.appendChild(full);
    } else {
      d = 'M'+x0+','+y0+' A'+R+','+R+' 0 '+large+' 1 '+x1+','+y1+
          ' L'+xi1+','+yi1+' A'+r+','+r+' 0 '+large+' 0 '+xi0+','+yi0+' Z';
      var p = svgE('path', {d:d, fill:it.color, stroke:C.surface, 'stroke-width':2, class:'bar'});
      bindTip(p, function(){
        return '<b>'+esc(it.label)+'</b><br>数量：<b>'+it.value+'</b>（'+(frac*100).toFixed(1)+'%）';
      });
      svg.appendChild(p);
    }
    a0 = a1;
  });
  var t1 = svgE('text', {x:cx, y:cy-2, 'text-anchor':'middle', 'font-size':30, 'font-weight':'700', fill:C.ink});
  t1.textContent = String(total);
  svg.appendChild(t1);
  var t2 = svgE('text', {x:cx, y:cy+18, 'text-anchor':'middle', 'font-size':11.5, fill:C.axis});
  t2.textContent = opts.centerLabel || '总数';
  svg.appendChild(t2);
  var wrap = h('div');
  var sw = h('div', {class:'chart-svg-wrap'});
  sw.appendChild(svg);
  wrap.appendChild(sw);
  var lg = h('div', {class:'legend', style:'justify-content:center'});
  items.forEach(function(it){
    lg.appendChild(h('span', {class:'lg-item', html:'<span class="sw" style="background:'+it.color+'"></span>'+esc(it.label)+'&nbsp;<b class="num" style="color:var(--ink)">'+it.value+'</b>'}));
  });
  wrap.appendChild(lg);
  return wrap;
}

var PARAM_DEFS = [
  {key:'effortDev',  label:'工作量偏差控制范围', unit:'±%',      min:1,   max:40,  step:0.5},
  {key:'scheduleDev',label:'工期偏差控制范围',   unit:'±%',      min:1,   max:40,  step:0.5},
  {key:'costDev',    label:'成本偏差控制范围',   unit:'±%',      min:1,   max:40,  step:0.5},
  {key:'sizeDev',    label:'规模偏差控制范围',   unit:'±%',      min:1,   max:40,  step:0.5},
  {key:'detectRate', label:'缺陷探测率目标',     unit:'≥%',      min:50,  max:100, step:1},
  {key:'hourPerFP',  label:'功能点耗时率目标',   unit:'≤人时/FP', min:4,   max:12,  step:0.05},
  {key:'reviewEff',  label:'评审效率目标',       unit:'≥个/人时', min:0.3, max:1.5, step:0.01},
  {key:'warnFactor', label:'预警系数',           unit:'×阈值',    min:0.3, max:0.9, step:0.05}
];
function renderMetricsPage(){
  var pg = document.getElementById('page-metrics');
  pg.innerHTML = '';
  var head = h('div', {class:'p-head', style:'margin-bottom:12px'});
  head.appendChild(h('h3', {style:'font-size:17px;margin:0', text:'任务一 · 项目度量数据监控'}));
  head.appendChild(h('span', {class:'hint', text:'计划/实际数值可直接编辑，阈值可调，偏差率·状态·图表·报告即时重算'}));
  var repBtn = h('button', {class:'btn primary', text:'生成监控报告'});
  repBtn.addEventListener('click', openMonitorReport);
  head.appendChild(h('span', {class:'spacer', style:'flex:1'}));
  head.appendChild(repBtn);
  pg.appendChild(head);
  pg.appendChild(buildParamPanel());
  pg.appendChild(buildMethodPanel());
  var body = h('div', {id:'m-body'});
  pg.appendChild(body);
  renderMetricsBody();
}
/* ---------- 参数面板（滑块+数值双绑定） ---------- */
function buildParamPanel(){
  var panel = h('section', {class:'panel collapsible' + (S.ui.paramsOpen?' open':'')});
  var head = h('div', {class:'p-head'},
    h('span', {class:'caret', text:'▶'}),
    h('h3', {text:'参数面板 · 阈值与目标'}),
    h('span', {class:'hint', text:'拖动滑块或输入数值，全页即时重算并本地保存'}));
  var body = h('div', {class:'p-body'});
  var grid = h('div', {class:'param-grid'});
  PARAM_DEFS.forEach(function(pd){
    var val = S.params[pd.key];
    var cell = h('div', {class:'param'});
    var lab = h('div', {class:'p-label'}, h('span', {text:pd.label}), h('span', {class:'muted', text:pd.unit}));
    var ctrl = h('div', {class:'p-ctrl'});
    var rng = h('input', {type:'range', min:pd.min, max:pd.max, step:pd.step, value:val});
    var num = h('input', {type:'number', min:pd.min, max:pd.max, step:pd.step, value:val});
    function apply(v, fromRange){
      v = Number(v);
      if (isNaN(v)) return;
      v = Math.min(pd.max, Math.max(pd.min, v));
      S.params[pd.key] = v;
      if (fromRange) num.value = v; else rng.value = v;
      renderMetricsBody();
    }
    rng.addEventListener('input', function(){ apply(rng.value, true); });
    rng.addEventListener('change', function(){ saveState(); });
    num.addEventListener('input', function(){ apply(num.value, false); });
    num.addEventListener('change', function(){ num.value = S.params[pd.key]; saveState(); });
    ctrl.appendChild(rng); ctrl.appendChild(num);
    cell.appendChild(lab); cell.appendChild(ctrl);
    grid.appendChild(cell);
  });
  body.appendChild(grid);
  var foot = h('div', {style:'margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap'});
  var resetP = h('button', {class:'btn small', text:'恢复默认阈值'});
  resetP.addEventListener('click', function(){
    var dp = defaultState().params;
    Object.keys(dp).forEach(function(k){ S.params[k] = dp[k]; });
    saveState('阈值已恢复默认');
    renderMetricsPage();
  });
  foot.appendChild(resetP);
  foot.appendChild(h('span', {class:'muted', text:'默认值来自项目2度量表控制范围（±15%）与目标值（探测率≥75%、耗时率≤7.15、评审效率≥0.75），预警系数0.6为演示假设'}));
  body.appendChild(foot);
  head.addEventListener('click', function(){
    S.ui.paramsOpen = !S.ui.paramsOpen;
    panel.classList.toggle('open', S.ui.paramsOpen);
    saveState(null, true);
  });
  panel.appendChild(head); panel.appendChild(body);
  return panel;
}

    h('span', {class:'hint', text:'展开查看各指标的计算公式与红黄绿判定规则'}));
  var body = h('div', {class:'p-body'});
  var cards = [
    {t:'偏差率', f:'<span class="formula">偏差率 = (实际 − 计划) / 计划 × 100%</span><br>P1按阶段/活动/里程碑逐行计算；P1工作量偏差以「需求阶段估计值」为基准（原表口径）。'},
    {t:'累计偏差率（P2）', f:'<span class="formula">累计偏差率 = (累计实际 − 累计计划) / 累计计划</span><br>P2的工作量、工期、成本均按阶段滚动累计后计算，反映偏差收敛/发散趋势。'},

    {t:'缺陷探测率', f:'<span class="formula">探测率 = 集成与系统测试加权缺陷 / (集成加权 + 验收加权)</span><br>衡量缺陷在交付前被拦截的比例，目标≥75%。'},
    {t:'生产率与耗时率', f:'<span class="formula">生产率 = 规模FP / 实际工作量(人天)</span>　<span class="formula">功能点耗时率 = 实际人时 / FP</span><br>1人天=8人时，1人月=20人天。'},

    h('span', {class:'pdot', style:'background:'+(isP2?C.p2:C.p1)}),

    var t = h('div', {class:'tile'});

  tiles.appendChild(tile('工期（实际）', fmtInt(k.totalDurationActDays)+'<span class="unit">天</span>',

  tiles.appendChild(tile('成本（实际）', fmtN(k.totalCostAct/10000,2)+'<span class="unit">万元</span>',
    '估算 '+fmtN(k.totalCostEst/10000,2)+' 万元', stDev(k.costDevRate, P.costDev), fmtPct(k.costDevRate)));

function chartCumDevCard(p2){
  var P = S.params;

  var schRows = p2.schedule.filter(function(r){ return r.phase!=='总计'; });
  var schV = schRows.map(function(r){ return r.cumDevRate; });
  var costRows = p2.cost.filter(function(r){ return r.phase!=='总计'; });
  var costV = costRows.map(function(r){ return r.cumDevRate; });

/* ---------- 可编辑数据表 ---------- */
function editCell(path, opts){
  opts = opts || {};
  var v = getPath(S.data, path);
  var inp = '<input class="cell'+(opts.narrow?' narrow':'')+'" type="text" inputmode="decimal" data-path="'+path+'" value="'+esc(roundForEdit(v))+'" aria-label="可编辑数值">';
  return inp;
}
function bindEditCells(root){
  root.querySelectorAll('input.cell').forEach(function(inp){
    inp.addEventListener('change', function(){
      var raw = inp.value.replace(/[,，\s]/g,'');
      var v = raw==='' ? null : Number(raw);
      if (raw!=='' && isNaN(v)){ toast('请输入数字'); inp.value = roundForEdit(getPath(S.data, inp.dataset.path)); return; }
      setPath(S.data, inp.dataset.path, v);
      computeDerived(S.data);
      saveState();
      renderMetricsBody();
    });
    inp.addEventListener('keydown', function(e){ if (e.key==='Enter') inp.blur(); });
  });
}

/* ---------- modal ---------- */
function openModal(title, bodyHtml, copyText){
  var root = document.getElementById('modal-root');
  root.innerHTML = '';
  var overlay = h('div', {class:'modal-overlay'});
  var modal = h('div', {class:'modal', role:'dialog', 'aria-label':title});
  var mh = h('div', {class:'m-head'});
  mh.appendChild(h('h3', {text:title}));
  var copyBtn = h('button', {class:'btn small', text:'复制全文'});
  copyBtn.addEventListener('click', function(){
    var done = function(){ toast('已复制到剪贴板'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(copyText).then(done, function(){ fallbackCopy(copyText); done(); });
    } else { fallbackCopy(copyText); done(); }
  });
  var printBtn = h('button', {class:'btn small', text:'打印'});
  printBtn.addEventListener('click', function(){
    document.documentElement.classList.add('print-report');
    var off = function(){ document.documentElement.classList.remove('print-report'); window.removeEventListener('afterprint', off); };
    window.addEventListener('afterprint', off);
    window.print();
    setTimeout(off, 2000);
  });
  var closeBtn = h('button', {class:'btn small', text:'关闭'});
  closeBtn.addEventListener('click', function(){ root.innerHTML=''; });
  mh.appendChild(copyBtn); mh.appendChild(printBtn); mh.appendChild(closeBtn);
  var mb = h('div', {class:'m-body', html:bodyHtml});
  modal.appendChild(mh); modal.appendChild(mb);
  overlay.appendChild(modal);
  overlay.addEventListener('click', function(e){ if (e.target===overlay) root.innerHTML=''; });
  root.appendChild(overlay);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}

function priBadge(pri){
  var map = S.data.decomposition.priorityMap || {};
  var label = map[String(pri)] || ('优先级'+pri);
  var cls = pri===1?'b-p1': pri===2?'b-p2':'b-p3';
  return '<span class="badge '+cls+'">'+esc(label)+'</span>';
}
function findFn(fid){
  var res = null;
  S.data.decomposition.modules.forEach(function(m){
    m.functions.forEach(function(f){ if (f.id===fid) res = {mod:m, fn:f}; });
  });
  return res;
}
function relatedFindings(fn){
  var out = [];
  var ref = fn.srsRef || '';
  S.data.quality.findings.forEach(function(q){
    var loc = (q.location||'') + ' ' + (q.quote||'');
    if (ref && loc.indexOf(ref)>=0) { out.push(q); return; }
    if (fn.name && fn.name.length>=2 && loc.indexOf(fn.name)>=0) out.push(q);
  });
  return out;
}

function fieldBlock(f, m, def){
  var wrap = h('div', {class:'fd-field'});
  wrap.appendChild(h('div', {class:'f-label'}, h('span',{text:def.label}), h('span',{class:'muted',text:'双击编辑'})));
  var val = f[def.key];
  var fv = h('div', {class:'f-val', tabindex:'0'});
  function renderVal(){
    fv.innerHTML = '';
    if (def.type==='chips'){
      var chips = h('div', {class:'chips'});
      (val||[]).forEach(function(a){ chips.appendChild(h('span', {class:'chip', text:a})); });
      if (!(val||[]).length) chips.appendChild(h('span', {class:'muted', text:'（空）'}));
      fv.appendChild(chips);
    } else if (def.type==='list' || def.type==='olist'){
      var lst = h(def.type==='olist'?'ol':'ul');
      (val||[]).forEach(function(a){ lst.appendChild(h('li', {text:String(a).replace(/^\d+[.、]\s*/,'')})); });
      if (!(val||[]).length) fv.appendChild(h('span', {class:'muted', text:'（空）'}));
      else fv.appendChild(lst);
    } else {
      fv.textContent = val==null || val==='' ? '（空）' : String(val);
    }
  }
  renderVal();
  fv.addEventListener('dblclick', function(){
    if (fv.classList.contains('editing')) return;
    fv.classList.add('editing');
    fv.setAttribute('contenteditable', 'plaintext-only');
    if (def.type==='text'){
      fv.textContent = val==null? '' : String(val);
    } else {
      fv.textContent = (val||[]).join('\n');
    }
    fv.focus();
    var sel = window.getSelection();
    if (sel && fv.firstChild){ var range = document.createRange(); range.selectNodeContents(fv); range.collapse(false); sel.removeAllRanges(); sel.addRange(range); }
    var onBlur = function(){
      fv.removeEventListener('blur', onBlur);
      fv.classList.remove('editing');
      fv.removeAttribute('contenteditable');
      var txt = fv.innerText.replace(/ /g,' ').replace(/\r/g,'');
      if (def.type==='text'){
        f[def.key] = txt.trim();
      } else {
        f[def.key] = txt.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s!==''; });
      }
      val = f[def.key];
      saveState();
      if (def.key==='name') renderDecompPage(); else renderVal();
    };
    fv.addEventListener('blur', onBlur);
  });
  wrap.appendChild(fv);
  return wrap;
}

var PROC_STYLE = {

  task:{w:142, h:58}, decision:{w:116, h:66}, startend:{w:118, h:40}, doc:{w:134, h:58}

function nodeBox(n){

  var cx = st.laneLabelW + n.col*st.colW + st.colW/2;

  var sz = n.type==='task'? st.task : n.type==='decision'? st.decision : n.type==='doc'? st.doc : st.startend;
  return {x:cx, y:cy, w:sz.w, h:sz.h};

function nodeTypeStyle(t){

  if (t==='doc')      return {stroke:'#4a3aa7', fill:'rgba(74,58,167,0.06)'};

function buildProcessSVG(proc){
  var st = PROC_STYLE;
  var maxCol = 0;
  proc.nodes.forEach(function(n){ if (n.col>maxCol) maxCol = n.col; });
  var W = st.laneLabelW + (maxCol+1)*st.colW + st.padRight;
  var H = st.padTop + proc.lanes.length*st.laneH + st.padBottom;
  var zoom = S.ui.procZoom || 1;
  var svg = svgE('svg', {viewBox:'0 0 '+W+' '+H, width:Math.round(W*zoom), height:Math.round(H*zoom), style:'display:block'});
  /* defs: 箭头 */
  var defs = svgE('defs');
  var marker = svgE('marker', {id:'arrw', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});
  marker.appendChild(svgE('path', {d:'M0,0 L10,5 L0,10 z', fill:'#52514e'}));
  defs.appendChild(marker);
  svg.appendChild(defs);
  /* 泳道条带 */
  proc.lanes.forEach(function(lane, li){
    var y = st.padTop + li*st.laneH;
    svg.appendChild(svgE('rect', {x:0, y:y, width:W, height:st.laneH,
      fill: li%2 ? 'rgba(11,11,11,0.028)' : 'transparent'}));
    svg.appendChild(svgE('line', {x1:0, y1:y, x2:W, y2:y, stroke:C.grid, 'stroke-width':1}));
    /* 泳道标签区 */
    svg.appendChild(svgE('rect', {x:0, y:y, width:st.laneLabelW, height:st.laneH, fill:'rgba(42,120,214,0.05)'}));
    var lines = wrapLabel(lane, 5);
    lines.forEach(function(ln, i){
      var t = svgE('text', {x:st.laneLabelW/2, y:y+st.laneH/2 + (i-(lines.length-1)/2)*15 + 4,
        'text-anchor':'middle', 'font-size':12.5, 'font-weight':'600', fill:C.ink2});
      t.textContent = ln;
      svg.appendChild(t);
    });
  });
  svg.appendChild(svgE('line', {x1:0, y1:st.padTop+proc.lanes.length*st.laneH, x2:W, y2:st.padTop+proc.lanes.length*st.laneH, stroke:C.grid, 'stroke-width':1}));
  svg.appendChild(svgE('line', {x1:st.laneLabelW, y1:st.padTop, x2:st.laneLabelW, y2:st.padTop+proc.lanes.length*st.laneH, stroke:C.grid, 'stroke-width':1}));
  var boxes = {};
  proc.nodes.forEach(function(n){ boxes[n.id] = nodeBox(n); });
  /* 边（先画，节点覆盖其上） */
  proc.edges.forEach(function(e){
    var s = boxes[e.from], t = boxes[e.to];
    if (!s || !t) return;
    var d, labelPos;
    if (t.x > s.x){
      var x1 = s.x + s.w/2, x2 = t.x - t.w/2;
      if (Math.abs(t.y - s.y) < 2){
        d = 'M'+x1+','+s.y+' L'+x2+','+t.y;
        labelPos = {x:(x1+x2)/2, y:s.y-8};
      } else {
        var midX = (x1+x2)/2;
        d = 'M'+x1+','+s.y+' L'+midX+','+s.y+' L'+midX+','+t.y+' L'+x2+','+t.y;
        labelPos = {x:midX, y:(s.y+t.y)/2 - 6};
      }
    } else if (t.x < s.x){
      /* 回退边：从底部绕行 */
      var laneBot = Math.max(s.y + s.h/2, t.y + t.h/2) + 26;
      d = 'M'+s.x+','+(s.y+s.h/2)+' L'+s.x+','+laneBot+' L'+t.x+','+laneBot+' L'+t.x+','+(t.y+t.h/2);
      labelPos = {x:(s.x+t.x)/2, y:laneBot-6};
    } else {
      var down = t.y > s.y;
      var y1 = s.y + (down? s.h/2 : -s.h/2), y2 = t.y + (down? -t.h/2 : t.h/2);
      d = 'M'+s.x+','+y1+' L'+s.x+','+y2;
      labelPos = {x:s.x+8, y:(y1+y2)/2};
    }
    svg.appendChild(svgE('path', {d:d, fill:'none', stroke:'#52514e', 'stroke-width':1.5, 'marker-end':'url(#arrw)'}));
    if (e.label){
      var lt = svgE('text', {x:labelPos.x, y:labelPos.y, 'text-anchor':'middle', 'font-size':10.5,
        fill:C.ink2, 'font-weight':'600', 'paint-order':'stroke', stroke:C.surface, 'stroke-width':4, 'stroke-linejoin':'round'});
      lt.textContent = e.label;
      svg.appendChild(lt);
    }
  });
  /* 节点 */
  proc.nodes.forEach(function(n){
    var b = boxes[n.id];
    var stl = nodeTypeStyle(n.type);
    var g = svgE('g', {class:'pnode'+(S.ui.selNode===n.id?' sel':''), 'data-node':n.id});
    var shape;
    if (n.type==='start' || n.type==='end'){
      shape = svgE('rect', {x:b.x-b.w/2, y:b.y-b.h/2, width:b.w, height:b.h, rx:b.h/2, ry:b.h/2,
        fill:stl.fill, stroke:stl.stroke, 'stroke-width':1.5, class:'shape'});
    } else if (n.type==='decision'){
      var pts = (b.x)+','+(b.y-b.h/2)+' '+(b.x+b.w/2)+','+(b.y)+' '+(b.x)+','+(b.y+b.h/2)+' '+(b.x-b.w/2)+','+(b.y);
      shape = svgE('polygon', {points:pts, fill:stl.fill, stroke:stl.stroke, 'stroke-width':1.5, class:'shape'});
    } else if (n.type==='doc'){
      var x0=b.x-b.w/2, y0=b.y-b.h/2, x1=b.x+b.w/2, y1=b.y+b.h/2, fold=12;
      shape = svgE('path', {d:'M'+x0+','+y0+' L'+(x1-fold)+','+y0+' L'+x1+','+(y0+fold)+' L'+x1+','+y1+' L'+x0+','+y1+' Z',
        fill:stl.fill, stroke:stl.stroke, 'stroke-width':1.5, class:'shape'});
      g.appendChild(shape);
      g.appendChild(svgE('path', {d:'M'+(x1-fold)+','+y0+' L'+(x1-fold)+','+(y0+fold)+' L'+x1+','+(y0+fold),
        fill:'none', stroke:stl.stroke, 'stroke-width':1}));
      shape = null;
    } else {
      shape = svgE('rect', {x:b.x-b.w/2, y:b.y-b.h/2, width:b.w, height:b.h, rx:8, ry:8,
        fill:stl.fill, stroke:stl.stroke, 'stroke-width':1.5, class:'shape'});
    }
    if (shape) g.appendChild(shape);
    /* 文本换行 */
    var maxChars = n.type==='decision'? 7 : Math.floor((b.w-16)/11.5);
    var rawLines = [];
    var s = n.label;
    while (s.length && rawLines.length<3){
      rawLines.push(s.slice(0, maxChars));
      s = s.slice(maxChars);
    }
    if (s.length && rawLines.length===3){
      rawLines[2] = rawLines[2].slice(0, maxChars-1)+'…';
    }
    var hasRef = !!n.frRef;
    var lineH = 13.5;
    var totalH = rawLines.length*lineH + (hasRef?12:0);
    rawLines.forEach(function(ln, i){
      var t = svgE('text', {x:b.x, y:b.y - totalH/2 + i*lineH + 11, 'text-anchor':'middle', 'font-size':11, fill:C.ink});
      t.textContent = ln;
      g.appendChild(t);
    });
    if (hasRef){
      var rt = svgE('text', {x:b.x, y:b.y - totalH/2 + rawLines.length*lineH + 11, 'text-anchor':'middle',
        'font-size':9.5, fill:'#1d5ba8', 'font-weight':'600'});
      rt.textContent = n.frRef;
      g.appendChild(rt);
    }
    bindTip(g, function(){
      var html = '<b>'+esc(n.label)+'</b><br><span class="tt-dim">类型：</span>'+typeName(n.type)+
        '　<span class="tt-dim">泳道：</span>'+esc(proc.lanes[n.lane]||'');
      if (n.frRef){
        var hit = findFn(n.frRef);
        html += '<br><span class="tt-dim">对应需求：</span>'+n.frRef+(hit? ' '+esc(hit.fn.name):'');
      }
      html += '<br><span class="tt-dim">点击查看详情</span>';
      return html;
    });
    g.addEventListener('click', function(){
      S.ui.selNode = n.id;
      svgSelUpdate();
      renderProcSide(proc, n.id);
    });
    svg.appendChild(g);
  });
  function svgSelUpdate(){
    svg.querySelectorAll('.pnode').forEach(function(g){
      g.classList.toggle('sel', g.getAttribute('data-node')===S.ui.selNode);
    });
  }
  return {svg:svg, W:W, H:H};
}

function filteredFindings(){
  var fl = S.ui.qFilter;
  var list = S.data.quality.findings.filter(function(f){
    if (fl.cat && f.category!==fl.cat) return false;
    if (fl.sev && f.severity!==fl.sev) return false;
    if (fl.kw){
      var kw = fl.kw.toLowerCase();
      var hay = [f.id, f.location, f.quote, f.problem, f.suggestion, f.category, f.severity, f.status].join(' ').toLowerCase();
      if (hay.indexOf(kw)<0) return false;
    }
    return true;
  });
  var sk = S.ui.qSort.key, dir = S.ui.qSort.dir;
  list.sort(function(a,b){
    var va, vb;
    if (sk==='severity'){ va = SEV_RANK[a.severity]||0; vb = SEV_RANK[b.severity]||0; }
    else { va = a[sk]||''; vb = b[sk]||''; }
    if (va<vb) return -dir;
    if (va>vb) return dir;
    return 0;
  });
  return list;
}

function makeInlineEditable(elm, getter, setter){
  elm.title = '双击编辑';
  elm.addEventListener('dblclick', function(){
    if (elm.classList.contains('editing')) return;
    elm.classList.add('editing');
    try { elm.setAttribute('contenteditable', 'plaintext-only'); }
    catch(e){ elm.setAttribute('contenteditable', 'true'); }
    if (elm.getAttribute('contenteditable')==='plaintext-only' && !elm.isContentEditable){
      elm.setAttribute('contenteditable', 'true');
    }
    elm.textContent = getter();
    elm.focus();
    var onBlur = function(){
      elm.removeEventListener('blur', onBlur);
      elm.classList.remove('editing');
      elm.removeAttribute('contenteditable');
      var txt = elm.innerText.replace(/ /g,' ').replace(/\r/g,'').trim();
      setter(txt);
      elm.textContent = txt;
    };
    elm.addEventListener('blur', onBlur);
    elm.addEventListener('keydown', function(e){
      if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); elm.blur(); }
    });
  });
}

  st1.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', style:'color:'+C.ok, html:String(cnt.ok)}), h('div', {class:'k', html:'<span style="color:'+C.ok+'">●</span> 正常/达标'})));
  st1.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', style:'color:'+(cnt.warn?C.warn:'var(--ink3)'), html:String(cnt.warn)}), h('div', {class:'k', html:'<span style="color:'+C.warn+'">▲</span> 预警'})));
  st1.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', style:'color:'+((cnt.over+cnt.crit)?C.crit:'var(--ink3)'), html:String(cnt.over+cnt.crit)}), h('div', {class:'k', html:'<span style="color:'+C.crit+'">✖</span> 超限/未达标'})));
  c1.appendChild(st1);
  var abnTxt = abn.length
    ? '需关注：' + abn.map(function(r){ return r.proj+' '+r.dim+'（'+(r.dev!=null? fmtPct(r.dev) : r.act)+' '+r.st.icon+r.st.label+'）'; }).join('；')
    : '按当前阈值，全部核心指标处于绿区。';
  c1.appendChild(h('div', {class:'oc-note', html:
    '两项目工作量/工期/成本偏差均未突破±15%控制范围，总体受控。P2缺陷探测率 <b class="num">'+fmtPctAbs(d.metrics.projects[1].kpis.detectRate,1)+'</b>、评审效率 <b class="num">'+fmtN(d.metrics.projects[1].kpis.reviewEfficiency,2)+'</b> 达标；P1数据存在采集质量疑点（进度零偏差、成本规则化），详见监控报告数据质量提示。<br>'+esc(abnTxt)}));
  var b1 = h('button', {class:'btn primary', text:'进入度量监控 →'});
  b1.addEventListener('click', function(){ switchTab('metrics'); });
  c1.appendChild(h('div', {class:'oc-foot'}, b1));
  cards.appendChild(c1);
  /* 任务二 */
  var dec = d.decomposition;
  var fnCount = 0;
  dec.modules.forEach(function(m){ fnCount += m.functions.length; });
  var c2 = h('div', {class:'ov-card'});
  c2.appendChild(h('div', {class:'oc-tag', text:'任务二 · 功能分解与业务流程'}));
  c2.appendChild(h('h3', {text:'系统功能分解规模'}));
  var st2 = h('div', {class:'oc-stats'});
  st2.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', html:'7+1'}), h('div', {class:'k', text:'一级模块(含接口)'})));
  st2.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', html:String(fnCount)}), h('div', {class:'k', text:'二级功能'})));
  st2.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', html:String((dec.processes||[]).length)}), h('div', {class:'k', text:'泳道流程图'})));
  st2.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', style:'color:'+C.warn, html:String((dec.expansion||[]).length)}), h('div', {class:'k', html:'<span style="color:'+C.warn+'">▲</span> 未详述模块'})));
  c2.appendChild(st2);
  c2.appendChild(h('div', {class:'oc-note', html:
    '按SRS第4章24个场景描述表+5.2三个银行代收接口，细化为<b class="num">'+fnCount+'</b>项功能（含角色/前置条件/主流程/异常分支/输入输出/数据项/验收标准），并梳理端到端、抄表、柜台收费、银行代收4条泳道流程。3.1宣称的帐务管理、银行划帐、系统报表、系统管理、掌上机抄表等<b>'+(dec.expansion||[]).length+'个模块SRS未展开</b>，已给出建议功能清单待业务确认。'}));
  var b2 = h('button', {class:'btn primary', text:'进入功能分解 →'});
  b2.addEventListener('click', function(){ switchTab('decomp'); });
  var b2b = h('button', {class:'btn', text:'查看业务流程'});
  b2b.addEventListener('click', function(){ switchTab('process'); });
  var f2 = h('div', {class:'oc-foot', style:'display:flex;gap:8px'});
  f2.appendChild(b2); f2.appendChild(b2b);
  c2.appendChild(f2);
  cards.appendChild(c2);
  /* 任务三 */
  var q = d.quality;
  var c3 = h('div', {class:'ov-card'});
  c3.appendChild(h('div', {class:'oc-tag', text:'任务三 · SRS质量检查'}));
  c3.appendChild(h('h3', {text:'需求规格说明书质量结论'}));
  var st3 = h('div', {class:'oc-stats'});
  st3.appendChild(h('div', {class:'oc-stat'}, h('div', {class:'v num', html:String(q.stats.total)}), h('div', {class:'k', text:'确认问题'})));
  [['高', '高严重度'], ['中', '中严重度'], ['低', '低严重度']].forEach(function(sv){
    st3.appendChild(h('div', {class:'oc-stat'},
      h('div', {class:'v num', style:'color:'+SEV_COLOR[sv[0]], html:String(q.stats.bySeverity[sv[0]]||0)}),
      h('div', {class:'k', html:'<span style="color:'+SEV_COLOR[sv[0]]+'">●</span> '+sv[1]})));
  });
  c3.appendChild(st3);
  c3.appendChild(h('div', {class:'oc-note', html:
    '三大系统性问题：<b>多系统模板拼接残留</b>（医疗/通信/语义网术语混入）、<b>关键指标自相矛盾</b>（吞吐量三套口径相差40倍、AWS部署与自主可控冲突）、<b>需求覆盖不完整</b>（11个宣称模块仅7个展开）。评审结论：<b>有条件通过</b>——18项高严重度问题须整改复审后方可进入设计阶段。'}));
  var b3 = h('button', {class:'btn primary', text:'进入质量检查 →'});
  b3.addEventListener('click', function(){ switchTab('quality'); });
  c3.appendChild(h('div', {class:'oc-foot'}, b3));
  cards.appendChild(c3);
  pg.appendChild(cards);
  /* 数据来源 + 使用指南 */
  var grid = h('div', {class:'grid2'});
  var src = h('section', {class:'panel'});
  src.appendChild(h('h3', {text:'数据来源说明'}));
  var mm = d.metrics.meta;
  src.appendChild(h('div', {html:
    '<ul class="guide-list">'+
    '<li><b>需求规格说明书：</b>'+esc(d.meta.sources[0])+' —— 7个一级模块24个二级功能的场景描述表、3个银行代收接口（5.2）、非功能需求（6章）</li>'+
    '<li><b>项目1度量数据：</b>'+esc(d.meta.sources[1])+' —— 256FP，2025-02-24~06-30，'+esc(mm.sources.P1.replace(/^data\/[^（]*（?/,'').replace(/）$/,''))+'</li>'+
    '<li><b>项目2度量数据：</b>'+esc(d.meta.sources[2])+' —— 327FP，2024-09-13~2025-04-02，'+esc(mm.sources.P2.replace(/^data\/[^（]*（?/,'').replace(/）$/,''))+'，带控制范围与目标值</li>'+
    '</ul>'+
    '<div class="muted" style="margin-top:6px">计量单位：规模='+esc(mm.units.size)+'；工作量='+esc(mm.units.effort)+'；工期='+esc(mm.units.schedule)+'；成本='+esc(mm.units.cost)+'。报告日期 '+esc(d.meta.date)+'，编制：'+esc(d.meta.author)+'。</div>'}));
  grid.appendChild(src);
  var guide = h('section', {class:'panel'});
  guide.appendChild(h('h3', {text:'使用指南（可编辑 · 可调参）'}));
  guide.appendChild(h('div', {html:
    '<ul class="guide-list">'+
    '<li><b>度量监控页：</b>表格中带<span style="border-bottom:1px dashed '+C.p1+'">蓝色虚线</span>的数值单元格可直接修改，偏差率、状态、KPI、图表与监控报告即时重算；顶部<b>参数面板</b>可调控制范围阈值、目标值与预警系数（滑块与数值框双向绑定）。</li>'+
    '<li><b>【生成监控报告】</b>按钮按当前数据与阈值生成结构化文字报告，支持复制全文与打印。</li>'+
    '<li><b>功能分解页：</b>任意字段<kbd>双击</kbd>进入编辑、失焦保存；可新增/删除功能、导出功能清单CSV；点击「关联质量问题」直接跳转问题行。</li>'+
    '<li><b>业务流程页：</b>4幅泳道图可切换，支持缩放（0.6x~1.6x）与适应宽度；点击节点右侧查看对应FR详情并可跳转。</li>'+
    '<li><b>质量检查页：</b>支持类别/严重度筛选、关键词搜索、点击列头排序；文本双击编辑，类别/严重度/状态为下拉；可新增、删除、导出CSV。</li>'+
    '<li><b>数据持久化：</b>所有修改仅保存在本浏览器 localStorage（键 <kbd>shuiwu_report_v1</kbd>），不回写文件；顶部<b>重置数据</b>可一键恢复报告内嵌的原始数据。</li>'+
    '<li><b>导出/打印：</b>顶部按钮支持打印当前页签、导出全量JSON、导出当前页CSV。</li>'+
    '</ul>'}));
  grid.appendChild(guide);
  pg.appendChild(grid);
}

function initApp(){
  S = loadState();
  document.getElementById('rpt-date').textContent = S.data.meta.date;
  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });
  document.getElementById('btn-json').addEventListener('click', exportJSON);
  document.getElementById('btn-csv').addEventListener('click', exportCSVCurrent);
  document.getElementById('btn-reset').addEventListener('click', resetState);
  renderAll();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();

</script>
