<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>供水营销管理系统 · 需求分析报告</title>
<style>
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --line:rgba(11,11,11,0.10); --line2:rgba(11,11,11,0.06);
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#898781;
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#008300; --c5:#4a3aa7; --c6:#e34948;
  --c1l:#9ec5f4; --c2l:#9adfc6;
  --ok:#0ca30c; --warn:#fab219; --over:#ec835a; --crit:#d03b3b;
  --grid:#e1e0d9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Segoe UI",sans-serif;font-size:14px;line-height:1.55}
button{font-family:inherit}
.num,td.num,input.cell,.stat-v,.tile-v{font-variant-numeric:tabular-nums}
a{color:var(--c1);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .brand{display:flex;flex-direction:column;gap:1px;min-width:220px}
.topbar .sys{font-size:16px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--ink3)}
.topbar .spacer{flex:1}
.topbar .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:#f2f2ee}
.btn.primary{background:var(--c1);border-color:var(--c1);color:#fff}
.btn.primary:hover{background:#2265b8}
.btn.danger{color:var(--crit);border-color:rgba(208,59,59,.4)}
.btn.small{padding:3px 9px;font-size:12px;border-radius:6px}
/* ---------- tabs ---------- */
.tabnav{position:sticky;top:57px;z-index:40;display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;overflow-x:auto}
.tabnav button{border:none;background:none;padding:11px 16px 9px;font-size:14px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabnav button.active{color:var(--c1);border-bottom-color:var(--c1);font-weight:600}
.tabnav button:hover{color:var(--ink)}
/* ---------- layout ---------- */
#main{max-width:1320px;margin:0 auto;padding:18px 20px 60px}
.page{display:none}
.page.active{display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.panel>h3{margin:0 0 10px;font-size:15px}
.panel .p-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .p-head h3{margin:0;font-size:15px}
.p-head .hint{font-size:12px;color:var(--ink3)}
.collapsible .p-head{cursor:pointer;user-select:none}
.collapsible .caret{display:inline-block;transition:transform .15s;color:var(--ink3);font-size:11px}
.collapsible.open .caret{transform:rotate(90deg)}
.collapsible .p-body{display:none;margin-top:12px}
.collapsible.open .p-body{display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.muted{color:var(--ink3);font-size:12px}
.small{font-size:12px}
.sec-title{font-size:16px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title .bar{display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--c1)}
/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .tile-k{font-size:12px;color:var(--ink3)}
.tile .tile-v{font-size:22px;font-weight:700;color:var(--ink);line-height:1.2}
.tile .tile-v .unit{font-size:12px;font-weight:400;color:var(--ink3);margin-left:2px}
.tile .tile-sub{font-size:11.5px;color:var(--ink2)}
.tile .tile-st{font-size:12px;margin-top:2px}
.st{font-weight:600;white-space:nowrap}
.proj-block{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:var(--surface)}
.proj-block>.pb-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pb-head .pname{font-size:15px;font-weight:700}
.pb-head .pdot{display:inline-block;width:10px;height:10px;border-radius:3px}
.pb-head .pperiod{font-size:12px;color:var(--ink3)}
/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:8px}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
table.tbl th{background:#f4f4f1;color:var(--ink2);font-weight:600;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
table.tbl td{padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl td.num,table.tbl th.num{text-align:right}
table.tbl tr.total-row td{background:#f6f6f3;font-weight:600}
table.tbl tr:hover td{background:rgba(42,120,214,0.04)}
input.cell{width:92px;border:none;border-bottom:1px dashed rgba(42,120,214,.55);background:transparent;color:var(--ink);font-size:13px;text-align:right;padding:2px 2px;border-radius:0}
input.cell:focus{outline:none;border-bottom:1.5px solid var(--c1);background:rgba(42,120,214,.06)}
input.cell.narrow{width:56px}
.tbl-note{font-size:11.5px;color:var(--ink3);margin:6px 2px 0}
.conclusion{background:#f6f6f3;border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.conclusion b{color:var(--ink)}
/* ---------- params ---------- */
.param-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 18px}
.param{display:flex;flex-direction:column;gap:3px}
.param .p-label{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.param .p-ctrl{display:flex;align-items:center;gap:8px}
.param input[type=range]{flex:1;accent-color:var(--c1);height:20px}
.param input[type=number]{width:74px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:13px;text-align:right;background:var(--surface);color:var(--ink)}
.param .p-unit{font-size:11px;color:var(--ink3);width:52px}
/* ---------- method cards ---------- */
.method-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.method-card{border:1px solid var(--line2);border-radius:8px;padding:9px 12px;background:#fbfbf9}
.method-card .m-t{font-size:12.5px;font-weight:700;margin-bottom:3px}
.method-card .m-f{font-size:12px;color:var(--ink2);line-height:1.6}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:rgba(42,120,214,.07);border-radius:4px;padding:1px 5px;white-space:nowrap}
/* ---------- charts ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;margin-bottom:16px}
.chart-card h4{margin:0 0 4px;font-size:14px}
.chart-card .c-sub{font-size:12px;color:var(--ink3);margin-bottom:6px}
.chart-flex{display:flex;gap:18px;flex-wrap:wrap}
.chart-flex>div{flex:1 1 380px;min-width:0}
.chart-flex .c-name{font-size:12.5px;font-weight:600;color:var(--ink2);margin:2px 0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:4px 0 4px}
.lg-item{display:inline-flex;align-items:center;gap:5px}
.lg-item .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart-svg-wrap{overflow-x:auto}
.chart-svg-wrap svg{display:block}
svg .bar{cursor:pointer}
svg .bar:hover{filter:brightness(.88)}
svg text{font-family:inherit}
.charts-2col{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
/* ---------- tooltip / toast ---------- */
.tooltip{position:fixed;z-index:300;background:rgba(20,20,18,.95);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.55;pointer-events:none;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tooltip b{color:#fff}
.tooltip .tt-dim{color:rgba(255,255,255,.65)}
.toast{position:fixed;right:20px;bottom:20px;z-index:400;background:rgba(20,20,18,.92);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* ---------- modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;max-width:960px;width:100%;padding:0;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal .m-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;z-index:2}
.modal .m-head h3{margin:0;font-size:16px;flex:1}
.modal .m-body{padding:18px 24px 26px}
.report-doc h2{font-size:18px;margin:0 0 2px;text-align:center}
.report-doc .r-meta{text-align:center;color:var(--ink3);font-size:12px;margin-bottom:14px}
.report-doc h3{font-size:14.5px;margin:18px 0 8px;border-left:4px solid var(--c1);padding-left:8px}
.report-doc table{border-collapse:collapse;width:100%;font-size:12.5px}
.report-doc table th,.report-doc table td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.report-doc table th{background:#f4f4f1}
.report-doc table td.num{text-align:right}
.report-doc ul,.report-doc ol{margin:6px 0;padding-left:22px}
.report-doc li{margin-bottom:4px;font-size:13px}
.report-doc p{font-size:13px}
/* ---------- decomposition ---------- */
.decomp-layout{display:flex;gap:16px;align-items:flex-start}
.fn-tree{width:290px;flex:0 0 290px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:76vh;overflow:auto;position:sticky;top:120px}
.fn-tree .mod{margin-bottom:2px}
.fn-tree .mod-h{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.fn-tree .mod-h:hover{background:#f2f2ee}
.fn-tree .mod-h .caret{font-size:10px;color:var(--ink3);width:10px}
.fn-tree .mod-h .cnt{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:400}
.fn-tree .fns{margin-left:16px;border-left:1px solid var(--line2);padding-left:6px}
.fn-tree .fn-i{display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.fn-tree .fn-i:hover{background:#f2f2ee}
.fn-tree .fn-i.sel{background:rgba(42,120,214,.1);color:var(--c1);font-weight:600}
.fn-tree .fn-id{color:var(--ink3);font-size:11px;flex:0 0 auto}
.fn-tree .fn-i.sel .fn-id{color:var(--c1)}
.badge{display:inline-block;font-size:10.5px;border-radius:5px;padding:1px 6px;line-height:1.5;white-space:nowrap}
.badge.b-warn{background:rgba(250,178,25,.16);color:#8a6200;border:1px solid rgba(250,178,25,.5)}
.badge.b-p1{background:rgba(227,73,72,.12);color:#b02a29;border:1px solid rgba(227,73,72,.35)}
.badge.b-p2{background:rgba(237,161,0,.13);color:#8a6200;border:1px solid rgba(237,161,0,.4)}
.badge.b-p3{background:rgba(42,120,214,.1);color:#1d5ba8;border:1px solid rgba(42,120,214,.3)}
.badge.b-mod{background:rgba(74,58,167,.09);color:#4a3aa7;border:1px solid rgba(74,58,167,.3)}
.fn-detail{flex:1;min-width:0}
.fn-detail .fd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fn-detail .fd-head h3{margin:0;font-size:17px}
.fd-field{margin-bottom:12px}
.fd-field .f-label{font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.fd-field .f-val{background:#fbfbf9;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:13px;white-space:pre-wrap}
.fd-field .f-val.editing{border-color:var(--c1);background:#fff;outline:none;box-shadow:0 0 0 2px rgba(42,120,214,.15)}
.fd-field .f-val ol,.fd-field .f-val ul{margin:0;padding-left:20px}
.fd-field .f-val li{margin-bottom:2px}
.fd-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.fd-2col{grid-template-columns:1fr}.decomp-layout{flex-direction:column}.fn-tree{width:100%;flex:auto;position:static;max-height:300px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(42,120,214,.08);border:1px solid rgba(42,120,214,.25);color:#1d5ba8;border-radius:20px;padding:2px 10px;font-size:12px}
.q-links a{display:inline-block;margin:2px 8px 2px 0;font-size:12.5px}
.stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats-bar .sb{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px;display:flex;flex-direction:column}
.stats-bar .sb .v{font-size:20px;font-weight:700}
.stats-bar .sb .k{font-size:11.5px;color:var(--ink3)}
/* ---------- process ---------- */
.proc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.proc-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--ink2)}
.proc-tabs button.active{background:var(--c1);border-color:var(--c1);color:#fff}
.proc-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.proc-toolbar .zoom-v{font-size:12px;color:var(--ink3);width:42px;text-align:center}
.proc-layout{display:flex;gap:14px;align-items:flex-start}
.proc-canvas{flex:1;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:72vh}
.proc-side{width:300px;flex:0 0 300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:72vh;overflow:auto;position:sticky;top:120px}
.proc-side h4{margin:0 0 6px;font-size:14px}
.proc-side .ps-row{font-size:12.5px;margin-bottom:6px;color:var(--ink2)}
.proc-side .ps-row b{color:var(--ink)}
@media (max-width:900px){.proc-layout{flex-direction:column}.proc-side{width:100%;flex:auto;position:static}}
svg .pnode{cursor:pointer}
svg .pnode .shape{transition:filter .1s}
svg .pnode:hover .shape{filter:brightness(.93)}
svg .pnode.sel .shape{stroke-width:2.5}
/* ---------- quality ---------- */
.q-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.q-toolbar select,.q-toolbar input[type=text]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:13px;background:var(--surface);color:var(--ink)}
.q-toolbar input[type=text]{width:200px}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--ink)}
table.tbl td .cell-edit{white-space:pre-wrap;min-width:120px}
table.tbl td .cell-edit.editing{outline:2px solid rgba(42,120,214,.4);background:#fff;border-radius:4px}
td select.status-sel,td select.inline-sel{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px;background:var(--surface);color:var(--ink)}
tr.flash td{animation:flashrow 2s ease-out}
@keyframes flashrow{0%{background:rgba(237,161,0,.35)}100%{background:transparent}}
.sev-dot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600}
.sev-dot .d{width:9px;height:9px;border-radius:50%;display:inline-block}
.del-btn{border:none;background:none;color:var(--ink3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:5px}
.del-btn:hover{color:var(--crit);background:rgba(208,59,59,.08)}
/* ---------- overview ---------- */
.ov-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-bottom:16px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.ov-card .oc-tag{font-size:11.5px;color:var(--ink3);letter-spacing:.5px}
.ov-card h3{margin:0;font-size:15.5px}
.ov-card .oc-stats{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}
.ov-card .oc-stat .v{font-size:26px;font-weight:800;line-height:1.15}
.ov-card .oc-stat .v .unit{font-size:12px;font-weight:400;color:var(--ink3)}
.ov-card .oc-stat .k{font-size:11.5px;color:var(--ink3)}
.ov-card .oc-note{font-size:12.5px;color:var(--ink2);flex:1}
.ov-card .oc-foot{margin-top:auto}
.guide-list{margin:6px 0 0;padding-left:20px;font-size:13px}
.guide-list li{margin-bottom:6px}
kbd{background:#f0f0ec;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11.5px;font-family:inherit}
/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .topbar .btns,.tabnav,.proc-toolbar,.q-toolbar,.param-grid,.fn-tree,.toast,.tooltip{display:none !important}
  .topbar{position:static;border-bottom:2px solid #000}
  #main{max-width:none;padding:0}
  .panel,.chart-card,.proj-block{break-inside:avoid;border-color:#bbb}
  .page{display:none}
  .page.active{display:block}
  input.cell{border-bottom:none}
  .proc-canvas{max-height:none;overflow:visible}
  .fn-detail{width:100%}
  html.print-report #app{display:none}
  html.print-report .modal-overlay{position:static;background:none;padding:0;overflow:visible}
  html.print-report .modal{box-shadow:none;max-width:none}
  html.print-report .modal .m-head .btn{display:none}
}

</style>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand">
    <span class="sys">供水营销管理系统 · 需求分析报告</span>
    <span class="sub">供水集团科技开发部 · 度量监控 / 功能分解 / 质量检查 工作台 · 报告日期 <span id="rpt-date" class="num"></span></span>
  </div>
  <span class="spacer"></span>
  <div class="btns">
    <button class="btn" id="btn-print" title="打印当前页签">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="vertical-align:-1px"><path d="M4 6V2h8v4M4 12h8v3H4zM2 6h12v6h-2M4 12H2V6"/></svg>
      打印</button>
    <button class="btn" id="btn-json" title="导出当前全量数据为JSON">导出JSON</button>
    <button class="btn" id="btn-csv" title="导出当前页签数据为CSV">导出CSV</button>
    <button class="btn danger" id="btn-reset" title="清除本地修改，恢复内嵌原始数据">重置数据</button>
  </div>
</header>
<nav class="tabnav" id="tabnav" aria-label="页签导航"></nav>
<main id="main">
  <section class="page" id="page-overview"></section>
  <section class="page" id="page-metrics"></section>
  <section class="page" id="page-decomp"></section>
  <section class="page" id="page-process"></section>
  <section class="page" id="page-quality"></section>
</main>
</div>
<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="modal-root"></div>

","P1进度表编码阶段实际完成2025-05-14晚于计划2025-05-13一天，但实际完成天数仍记61天、偏差天数记0；且计划完成天数61与计划日期差不符（2025-03-14至05-13按日差为60天），恰等于实际日期差（03-14至05-14为61天），疑按实际日期回填计划天数、抹平偏差；测试阶段实际开始05-14相应顺延亦记0偏差","P1进度全部阶段偏差率记0，与编码阶段实际存在1天延误矛盾，整体进度数据可信度存疑","P1规模表验收结项阶段无估算值（实际256FP），偏差率空缺；测试阶段估算187FP与最终实际256FP相差69FP（约+27%），前期估算口径与最终功能点口径可能不一致","P1成本表估算与实际的偏差率全部为负且高度一致：策划/设计/测试/验收四个里程碑偏差率完全相同（-0.04266，折算系数0.95734），需求/开发两个里程碑完全相同（-0.04571，折算系数0.95429），且估算成本呈对称分布（策划=验收、需求=开发、设计=测试），实际成本疑似按统一比例由估算折算而非实采","P1工作量表估计值有「策划阶段」「需求阶段」两列，偏差率以需求阶段估计值为基准计算，使用时需注意基准选择","P1属性表记载实际工期2025-02-24~06-30（日历127天），而进度表各阶段实际天数合计125天（相邻阶段边界日重叠计法），两口径差2天","P2无项目属性表，项目名称、项目经理、团队规模等基本信息缺失，仅有文档编号KSSH-1102、受控状态与版本V1.5","P2成本表「结果」栏文字为「各阶段工期偏差满足控制范围，总工期偏差率满足目标范围」，描述对象是工期而非成本，疑为从工期表复制粘贴的笔误","P2计划成本恰等于计划工作量×1200元/人天（如立项计划29.35520882×1200=35226.250584），为纯推导值而非独立估算；实际成本则为独立采集值","P2立项计划阶段的工作量累计偏差率与成本累计偏差率完全相同（0.0560306414471624），因立项阶段实际成本恰=实际工作量×1200，后续阶段两者分离","P2工期表O列之后为2022~2025年节假日辅助数据（用于工作日计算），已按要求忽略；工期为工作日口径，与日历跨度（计划189天/实际202天）不同","P2缺陷表仅集成与系统测试行给出缺陷探测率0.7846，验收测试与总计行探测率空缺；评审缺陷结果文字称评审效率0.76，实际计算值为0.757575757575758","P2工期总计行的「计划总工期/实际总工期」单元格为表头文字无数值，总工期121/130天取自累计列，总计行偏差率取交付验收阶段累计值"]},"decomposition":{"system":"供水营销管理系统","srsSource":"水务需求分析/data/srs_full.txt","priorityMap":{"1":"P1 高（核心必备）","2":"P2 中高","5":"P3 一般"},"modules":[{"id":"M1","name":"档案基础数据","srsRef":"4.1","goal":"维护客户档案所依赖的基础代码字典（用户状态、用户分类、抄表周期、行业分类、优惠类型），为立户、抄表、算费提供统一的数据基准。","functions":[{"id":"FR-1.1","name":"用户状态","srsRef":"4.1.1","priority":1,"srsDesc":"新建修改对应用户状态；3.3补充：可以设置用户状态是否抄表。输入：新增对应用户状态；输出：展示当前系统的用户状态列表。","refinedDesc":"维护用水户生命周期状态字典。管理对象为用户状态代码表，字段应含：状态编码（唯一、创建后不可改）、状态名称（如正常、报停、暂停、违章、销户）、是否抄表标志、是否计费标志、是否允许缴费标志、启用/停用标志、排序号、备注。规则：状态被客户档案引用后禁止删除、只能停用；『是否抄表』决定抄表计划是否为该状态用户生成抄表任务；『是否允许缴费』供公众缴费平台配置（4.3.4限制用户状态）引用，拦截不允许状态用户的线上缴费；『是否计费』决定开账时是否生成水费账单。","actors":["营业管理员","系统管理员"],"preconditions":["已通过浏览器（IP或域名）登录供水营销管理系统","当前账号具有档案基础数据维护权限"],"mainFlow":["1. 管理员进入档案基础数据-用户状态管理页面，系统展示当前用户状态列表","2. 点击『新增』，系统弹出状态编辑表单","3. 录入状态编码、状态名称，勾选是否抄表、是否计费、是否允许缴费","4. 提交保存，系统校验编码与名称的唯一性","5. 校验通过，系统写入状态记录并刷新列表，提示新增成功","6. 选中已有状态可修改名称与各标志位，或执行启用/停用","7. 系统在列表中同步展示各状态被客户档案引用的户数统计"],"altFlows":["4a. 状态编码或名称重复：系统提示重名/重码校验失败，停留在表单待修正","6a. 删除被客户档案引用的状态：系统拒绝删除，提示改用停用","6b. 停用状态后：存量用户保持原状态不变，但新建/变更档案时该状态不可选"],"inputs":["状态编码","状态名称","是否抄表标志","是否计费标志","是否允许缴费标志","启用/停用标志","备注"],"outputs":["用户状态列表（含各状态引用户数）","新增/修改/启停用操作结果提示"],"dataItems":["用户状态表：状态编码、状态名称、是否抄表、是否计费、是否允许缴费、启停用标志、排序号、备注、创建人、创建时间、修改人、修改时间"],"acceptance":["新增编码重复的状态时被系统拒绝并给出明确提示","将某状态『是否抄表』置否后，该状态用户不再出现在新生成的抄表计划中","被至少1户引用的状态执行删除操作被拒绝，执行停用成功且新档案下拉不再出现该状态"],"notes":"SRS操作序列写『点击用户管理，新增』，应为『用户状态管理』，疑为编写笔误；SRS未定义任何字段与状态取值清单，是否计费/是否允许缴费标志为本次细化补充，需与业务确认。"},{"id":"FR-1.2","name":"用户分类","srsRef":"4.1.2","priority":5,"srsDesc":"创建用户分类进行分类统计管理；3.3补充：用于将下属用户的用户性质进行分类统计管理。输入：新增用户分类；输出：展示当前系统的用户分类列表。","refinedDesc":"维护用户性质分类字典，用于统计与政策口径管理。字段应含：分类编码（唯一）、分类名称（如居民、非居民、单位、趸售、特困减免户）、上级分类（支持树形）、启用/停用标志、备注。规则：分类被客户档案引用后禁止删除；用户分类可作为水价方案、报表统计、优惠适用范围的筛选维度；与行业分类（FR-1.4）职责区分：用户分类描述『用户性质』，行业分类描述『用水性质』。","actors":["营业管理员"],"preconditions":["已登录供水营销管理系统","具有档案基础数据维护权限"],"mainFlow":["1. 进入用户分类管理页面，系统展示分类列表（树形/平铺）","2. 点击『新增』，选择上级分类（可为空表示一级分类）","3. 录入分类编码、分类名称并提交","4. 系统校验同级下编码与名称唯一性","5. 校验通过后保存并刷新列表，提示成功","6. 支持对已有分类进行修改、启用/停用操作"],"altFlows":["4a. 同级分类重名：提示校验失败","6a. 删除被档案引用或含下级分类的节点：系统拒绝并提示原因"],"inputs":["分类编码","分类名称","上级分类","启停用标志","备注"],"outputs":["用户分类列表","操作结果提示"],"dataItems":["用户分类表：分类编码、分类名称、上级分类编码、层级、启停用标志、备注、创建/修改审计字段"],"acceptance":["新增两级分类后档案立户界面可级联选择","删除被引用分类被拒绝，停用后新档案不可再选择该分类"],"notes":"SRS未说明用户分类与水价、优惠、报表的关联关系，本细化按营销系统惯例补充，需业务确认。"},{"id":"FR-1.3","name":"抄表周期","srsRef":"4.1.3","priority":1,"srsDesc":"设置抄表需要的抄表周期；3.3补充：用于规定表册的抄表周期，抄表周期只能以表册为单位修改。输入：修改启用抄表周期；输出：展示当前系统的抄表周期列表。","refinedDesc":"维护抄表周期字典，驱动抄表计划的生成节奏。字段应含：周期编码、周期名称（如月抄、双月抄、季抄）、间隔月数、每期例抄日（日历日或工作日偏移）、启用/停用标志、备注。规则：周期挂接在表册上（一个表册一个周期），『抄表周期只能以表册为单位修改』即不允许对单户改周期，改周期须整册调整；被表册引用的周期禁止删除；周期+例抄日决定表册到期日，系统按到期日自动生成本期抄表计划任务。","actors":["营业管理员"],"preconditions":["已登录供水营销管理系统","具有档案基础数据维护权限"],"mainFlow":["1. 进入抄表周期管理页面，系统展示周期列表","2. 点击『新增』按钮增加抄表周期类型","3. 录入周期编码、名称、间隔月数、例抄日","4. 提交后系统校验编码唯一性与间隔月数合法性（正整数）","5. 保存成功并刷新列表","6. 对已有周期可修改例抄日、启用/停用；系统提示影响的表册数量"],"altFlows":["4a. 间隔月数非法（0或负数）：拒绝保存并提示","6a. 删除被表册引用的周期：拒绝，只允许停用","6b. 修改被引用周期的间隔月数：提示将影响N个表册的下期计划生成日期，需二次确认"],"inputs":["周期编码","周期名称","间隔月数","例抄日","启停用标志"],"outputs":["抄表周期列表（含引用表册数）","操作结果提示"],"dataItems":["抄表周期表：周期编码、周期名称、间隔月数、例抄日、启停用标志、备注、审计字段"],"acceptance":["新建『双月抄』周期并挂接表册后，系统每2个月按例抄日生成一次该册抄表计划","对单个用户修改抄表周期的入口不存在（只能通过表册整体调整）","删除被引用周期被系统拒绝"],"notes":"3.3明确『抄表周期只能以表册为单位修改』的约束，但4.1.3正文未重申，该规则需在表册管理（FR-2.2）中实现联动控制；SRS未定义例抄日概念，为细化补充。"},{"id":"FR-1.4","name":"行业分类","srsRef":"4.1.4","priority":5,"srsDesc":"设置用水的行业分类；3.3补充：用于将下属用户的用水性质进行分类统计管理，例如商业、工业、居民、特种等。输入：新增行业分类；输出：展示当前系统的行业分类列表。","refinedDesc":"维护用水性质的行业分类字典，支持大类-小类两级结构（SRS操作序列提到『行类大小分类』）。字段应含：大类编码/名称（商业、工业、居民、特种等）、小类编码/名称、所属大类、启用/停用标志、备注。规则：行业分类挂接客户档案，用于用水性质统计报表与特种行业水价（如洗车、洗浴等特种用水执行特种水价）；被档案引用的分类禁止删除；特种行业类别应可被水价方案引用。","actors":["营业管理员"],"preconditions":["已登录供水营销管理系统","具有档案基础数据维护权限"],"mainFlow":["1. 进入行业分类管理页面，系统展示大类-小类分类树","2. 点击『新增大类』录入大类编码与名称并保存","3. 在大类下点击『新增小类』录入小类编码与名称","4. 系统校验同级编码/名称唯一性后保存","5. 系统刷新分类列表并展示各分类挂接户数","6. 支持修改名称、启用/停用分类"],"altFlows":["4a. 同级重名：校验失败提示","6a. 删除含小类的大类或被档案引用的分类：拒绝并提示"],"inputs":["大类编码","大类名称","小类编码","小类名称","启停用标志"],"outputs":["行业分类列表（大类/小类树，含挂接户数）","操作结果提示"],"dataItems":["行业分类表：分类编码、分类名称、层级（大类/小类）、上级分类编码、启停用标志、备注、审计字段"],"acceptance":["可建立『商业-餐饮』两级分类并在档案立户时级联选择","按行业分类出具用水量统计时口径与档案挂接一致"],"notes":"SRS正文未明确两级结构的字段与水价联动，『行类大小分类』表述含糊，需与业务确认特种行业是否直接驱动水价。"},{"id":"FR-1.5","name":"优惠类型","srsRef":"4.1.5","priority":1,"srsDesc":"设置用水的优惠类型；3.3补充：定义用水优惠类型和明细方式，优惠类型在档案管理模块中的水价信息处设置。输入：新增优惠类型；输出：展示当前系统的优惠类型列表。","refinedDesc":"维护水费优惠政策字典。字段应含：优惠编码、优惠名称（如低保户减免、军烈属优惠、特困减免）、优惠方式（比例折扣/每期定额金额减免/每期定量水量减免）、优惠值、适用收费类型（水费/污水费）、适用用户分类、生效日期、失效日期、启用/停用标志、审批依据备注。规则：优惠类型在档案管理的水价信息处挂接到具体用户；算费开账时按优惠方式参与账单金额计算（先算原价再按优惠冲减，账单需保留优惠前后金额明细）；被档案引用的优惠禁止删除；过期优惠自动停止参与算费。","actors":["营业管理员"],"preconditions":["已登录供水营销管理系统","具有档案基础数据维护权限"],"mainFlow":["1. 进入优惠类型管理页面，系统展示优惠类型列表","2. 点击『新增优惠类型』，录入编码、名称","3. 选择优惠方式（比例/定额金额/定量水量）并录入优惠值","4. 设置适用收费类型、适用用户分类与生效/失效日期","5. 提交后系统校验编码唯一性与优惠值合法性（比例0-100%、金额/水量为正数）","6. 保存成功并刷新列表；档案模块水价信息处即可引用该优惠","7. 支持修改、启用/停用，系统展示各优惠挂接户数"],"altFlows":["5a. 优惠值越界（如比例>100%）：拒绝保存并提示","7a. 删除被用户档案水价信息引用的优惠：拒绝，只允许停用","7b. 停用/到期的优惠：下期开账自动不再冲减，存量账单不回溯"],"inputs":["优惠编码","优惠名称","优惠方式","优惠值","适用收费类型","适用用户分类","生效日期","失效日期","启停用标志"],"outputs":["优惠类型列表（含挂接户数）","操作结果提示"],"dataItems":["优惠类型表：优惠编码、优惠名称、优惠方式、优惠值、适用收费类型、适用用户分类、生效日期、失效日期、启停用标志、备注、审计字段"],"acceptance":["挂接比例折扣优惠的用户下期账单金额=原价×折扣，且账单保留优惠明细","优惠到失效日期后的下一账期不再冲减","删除被引用优惠被系统拒绝"],"notes":"SRS未定义『明细方式』的具体枚举，比例/定额/定量三种方式为细化推导；优惠与阶梯水价叠加时的计算顺序SRS未规定，须补充算费规则文档。"}]},{"id":"M2","name":"抄表基础模块","srsRef":"4.2","goal":"维护抄表员、表册及册内抄表顺序，为抄表计划的生成、派发与抄表路线优化提供组织基础。","functions":[{"id":"FR-2.1","name":"抄表员管理","srsRef":"4.2.1","priority":1,"srsDesc":"对抄表员进行查询、新增、删除、生成的操作。输入：新增加抄表对应的抄表员；输出：展现当面系统的抄表员工列表信息。","refinedDesc":"维护抄表员基础档案并与表册、掌上机、登录账号关联。字段应含：抄表员编号（唯一，可由系统自动生成）、姓名、所属营业所/抄表区域、联系电话、在职状态（在职/离职/停用）、关联系统登录账号、绑定掌上机设备号、备注。规则：一名抄表员可负责多个表册，一个表册同一时间只归属一名抄表员；有在管表册的抄表员不允许直接删除，须先将表册移交他人；离职/停用抄表员不再出现在表册分配与抄表任务下发范围内。","actors":["营业管理员","抄表班长"],"preconditions":["已登录供水营销管理系统","具有抄表基础模块维护权限"],"mainFlow":["1. 进入抄表员管理页面，系统展示抄表员列表（编号、姓名、区域、在管表册数）","2. 支持按姓名/编号/区域查询过滤","3. 点击『新增』，录入姓名、区域、电话，系统自动生成抄表员编号","4. 可选关联登录账号与掌上机设备号","5. 提交后系统校验必填项与账号唯一绑定后保存","6. 保存成功刷新列表；该抄表员即可在表册管理中被指派","7. 支持修改信息与在职状态变更"],"altFlows":["5a. 登录账号已被其他抄表员绑定：提示冲突拒绝保存","7a. 删除有在管表册的抄表员：系统拒绝，提示先移交表册","7b. 抄表员置为离职：其名下表册标记待移交并提醒管理员"],"inputs":["姓名","所属营业所/区域","联系电话","关联登录账号","掌上机设备号","在职状态"],"outputs":["抄表员列表（含在管表册数）","操作结果提示"],"dataItems":["抄表员表：抄表员编号、姓名、所属区域、联系电话、在职状态、登录账号ID、掌上机设备号、备注、审计字段"],"acceptance":["新增抄表员后可在表册管理中被选为责任抄表员","删除在管表册>0的抄表员被系统拒绝","按区域查询结果与档案归属一致"],"notes":"SRS操作项中的『生成』含义未解释（推断为自动生成抄表员编号或由账号同步生成），需与业务确认；输出栏『展现当面系统』系错别字（当前）。"},{"id":"FR-2.2","name":"表册管理","srsRef":"4.2.2","priority":1,"srsDesc":"查询表册信息，表册信息的管理。输入：新增新表册信息；输出：显示当前的表册列表、表册户数。","refinedDesc":"维护表册（按抄表路线组织的用户集合，抄表与批量销账的基本单位）。字段应含：表册编号（唯一）、表册名称、所属区域/营业所、责任抄表员、抄表周期（引用FR-1.3）、例抄日、册内户数（系统统计）、表册状态（启用/停用/待移交）、备注。规则：抄表周期只能以表册为单位修改（3.3约束在此落地）；新立户用户必须归入某表册后才能进入抄表计划；用户可在表册间调拨（换册）并保留调拨记录；表册到期时系统按其周期与例抄日自动生成本期抄表计划；批量销账（FR-4.2）以表册号为查询入口。","actors":["营业管理员","抄表班长"],"preconditions":["已登录供水营销管理系统","抄表周期、抄表员基础数据已维护","具有抄表基础模块维护权限"],"mainFlow":["1. 进入表册管理页面，系统展示表册列表（编号、名称、抄表员、周期、户数）","2. 点击『新增』，录入表册编号、名称、所属区域","3. 指派责任抄表员，选择抄表周期与例抄日","4. 提交后系统校验编号唯一性并保存","5. 保存成功，表册以0户初始状态出现在列表中","6. 通过档案立户或用户换册操作将用户归入该表册，系统实时统计册内户数","7. 支持修改表册周期（提示影响整册所有用户的下期抄表日期）、更换抄表员"],"altFlows":["4a. 表册编号重复：拒绝保存","7a. 删除册内户数>0的表册：系统拒绝，须先将用户全部调出","7b. 修改抄表周期时本期计划已生成：提示自下期生效"],"inputs":["表册编号","表册名称","所属区域/营业所","责任抄表员","抄表周期","例抄日","状态"],"outputs":["表册列表（含表册户数）","表册明细（册内用户清单）","操作结果提示"],"dataItems":["表册表：表册编号、表册名称、所属区域、抄表员编号、抄表周期编码、例抄日、状态、备注、审计字段","表册-用户关系：表册编号、户号、册内抄表顺序号、入册日期、调出日期"],"acceptance":["新增表册并归入用户后，列表户数统计与实际归户数一致","修改表册周期后整册用户下期抄表计划日期同步变化，且不存在对单户改周期的入口","删除非空表册被系统拒绝"],"notes":"SRS功能描述过于简略（仅一句『表册信息的管理』），未定义表册与档案、抄表计划、批量销账的关联，本细化为核心补充内容。"},{"id":"FR-2.3","name":"表册顺序调整","srsRef":"4.2.3","priority":1,"srsDesc":"调整表册内户号的抄表顺序。输入：无；输出：无（SRS原文即如此）。","refinedDesc":"调整表册内各户号的抄表顺序号，使抄表路线与实地行走路线一致。管理对象为表册-用户关系中的『册内抄表顺序号』字段。规则：顺序号在同一表册内唯一、连续（或允许留空隙由系统重排）；支持单户改号、上移/下移、拖拽排序、区间批量重排四种方式；调整后手工抄表界面（FR-7.1）与掌上机下载任务按新顺序展示；新入册用户默认排在册尾；调整操作留痕（操作人、时间、前后顺序）。","actors":["抄表班长","营业管理员"],"preconditions":["已登录供水营销管理系统","目标表册存在且册内有用户","具有抄表顺序管理权限"],"mainFlow":["1. 进入抄表顺序管理页面，输入/选择表册号","2. 系统按当前顺序号列出册内全部用户（顺序号、户号、户名、地址）","3. 选中某户，通过输入新顺序号或上移/下移/拖拽调整位置","4. 系统实时重排其余户的顺序号并高亮变更行","5. 点击保存，系统校验顺序号在册内无重复","6. 保存成功，提示调整完成并记录操作日志","7. 下次生成抄表计划及掌上机任务下载即按新顺序执行"],"altFlows":["5a. 顺序号重复或非正整数：拒绝保存并定位冲突行","3a. 本期抄表任务已下发掌上机：提示新顺序自下期生效或需重新下发任务"],"inputs":["表册号","户号","新抄表顺序号（或移动操作）"],"outputs":["调整后的册内用户顺序列表","操作结果提示与变更日志"],"dataItems":["表册-用户关系：表册编号、户号、册内抄表顺序号","顺序调整日志：操作人、操作时间、户号、原顺序号、新顺序号"],"acceptance":["调整顺序保存后，手工抄表界面按新顺序逐户展示","同册顺序号冲突时保存被拒绝并明确定位","顺序调整存在可查询的操作日志"],"notes":"SRS该节输入、输出均填『无』，属文档缺陷——实际输入应为册内户号与目标顺序号，输出应为调整后的顺序列表；与掌上机已下发任务的同步策略SRS未提及。"}]},{"id":"M3","name":"收费数据基础","srsRef":"4.3","goal":"定义收费类型与柜台外各类收费渠道（收费网点、ATM自助缴费机、微信/支付宝等公众缴费平台）的基础配置，支撑多渠道收费与分渠道对账。","functions":[{"id":"FR-3.1","name":"收费类型","srsRef":"4.3.1","priority":1,"srsDesc":"管理客户的收费类型。输入：增加收费类型；输出：展示系统当前的收费类型列表。","refinedDesc":"维护费用科目字典。字段应含：收费类型编码（唯一）、收费类型名称（如水费、污水处理费、垃圾费、违约金/滞纳金、工程款、预存款）、是否允许线上渠道缴纳、销账冲抵优先顺序、对应票据类型（引用FR-5.1）、是否参与滞纳金计算、启用/停用标志。规则：账单按收费类型分项记账与开票；公众缴费平台配置（FR-3.4）可按收费类型限制线上可缴项目；销账时按冲抵优先顺序依次核销多项费用；被账单或渠道配置引用的类型禁止删除。","actors":["营业管理员","财务人员"],"preconditions":["已登录供水营销管理系统","具有收费数据基础维护权限"],"mainFlow":["1. 进入收费类型管理页面，系统展示收费类型列表","2. 点击『新增』，录入类型编码与名称","3. 设置是否允许线上缴纳、冲抵优先顺序、对应票据类型","4. 提交后系统校验编码唯一性与优先顺序不冲突","5. 保存成功并刷新列表","6. 支持修改与启用/停用，系统提示引用该类型的渠道配置数"],"altFlows":["4a. 编码重复或冲抵顺序与既有类型冲突：拒绝并提示","6a. 删除被账单/渠道配置引用的类型：拒绝，只允许停用"],"inputs":["收费类型编码","收费类型名称","是否允许线上缴纳","冲抵优先顺序","对应票据类型","是否参与滞纳金计算","启停用标志"],"outputs":["收费类型列表","操作结果提示"],"dataItems":["收费类型表：类型编码、类型名称、是否允许线上缴、冲抵优先顺序、票据类型编码、是否计滞纳金、启停用标志、审计字段"],"acceptance":["销账时多项费用按配置的冲抵顺序依次核销","线上禁缴的收费类型在公众缴费平台查询结果中不可缴","删除被引用类型被系统拒绝"],"notes":"SRS仅一句描述，冲抵顺序、票据联动、滞纳金参与规则均为细化补充，需业务确认；水费/污水费拆分记账口径未定义。"},{"id":"FR-3.2","name":"收费网点","srsRef":"4.3.2","priority":5,"srsDesc":"管理区域下的收费网点。输入：收费网点信息；输出：展示区域对应收费网点。","refinedDesc":"维护线下收费网点（营业厅）档案。字段应含：网点编码（唯一）、网点名称、所属区域/分公司、地址、负责人、联系电话、营业时间、支持业务（收费/开票/预存/退费）、启用/停用标志。规则：柜员收费流水必须归属某网点，作为网点日结、长短款核对与收入统计的口径；网点停用后不再受理新流水但历史流水可查；ATM收费机（FR-3.3）挂接在网点之下。","actors":["营业管理员"],"preconditions":["已登录供水营销管理系统","区域/组织机构数据已维护","具有收费数据基础维护权限"],"mainFlow":["1. 进入收费网点管理页面，系统按区域展示网点列表","2. 点击『新增』，选择所属区域","3. 录入网点编码、名称、地址、负责人、电话","4. 提交后系统校验编码唯一性并保存","5. 保存成功，刷新区域-网点列表","6. 支持修改网点信息与启用/停用"],"altFlows":["4a. 网点编码重复：拒绝保存","6a. 停用仍有当日未日结流水的网点：提示须先完成日结"],"inputs":["网点编码","网点名称","所属区域","地址","负责人","联系电话","启停用标志"],"outputs":["区域对应收费网点列表","操作结果提示"],"dataItems":["收费网点表：网点编码、网点名称、所属区域、地址、负责人、电话、营业时间、支持业务、启停用标志、审计字段"],"acceptance":["柜台收费流水均带网点归属且网点日结汇总与流水明细一致","停用网点不再出现在柜员登录可选网点中"],"notes":"SRS未说明网点与柜员、日结的关系，为细化补充。"},{"id":"FR-3.3","name":"Atm收费机","srsRef":"4.3.3","priority":5,"srsDesc":"增加修改线下自助缴费机。输入：增加缴费自助机信息；输出：展示当前系统的自助机信息。","refinedDesc":"维护线下ATM自助缴费机设备档案。字段应含：设备编号（唯一）、设备名称、所属收费网点/安装位置、终端标识/IP、支持缴费方式（现金/银行卡/扫码）、是否支持打印票据、设备状态（在线/离线/停用/维修）、投产日期。规则：自助机缴费流水按设备编号归集，参与渠道对账与网点日结；设备停用后终端登录被拒绝；设备状态变化留日志供运维排查。","actors":["营业管理员","运维人员"],"preconditions":["已登录供水营销管理系统","收费网点已维护","具有收费数据基础维护权限"],"mainFlow":["1. 进入ATM收费机管理页面，系统展示自助机列表及状态","2. 点击『新增』，录入设备编号、名称","3. 选择所属网点/位置，录入终端标识、支持的缴费方式","4. 提交后系统校验设备编号与终端标识唯一性","5. 保存成功刷新列表，设备可接入系统受理缴费","6. 支持修改设备信息、变更状态（停用/维修）"],"altFlows":["4a. 设备编号或终端标识重复：拒绝保存","6a. 停用有未上传流水的设备：提示先完成流水同步"],"inputs":["设备编号","设备名称","所属网点/位置","终端标识/IP","支持缴费方式","设备状态"],"outputs":["自助缴费机列表（含状态）","操作结果提示"],"dataItems":["ATM收费机表：设备编号、设备名称、网点编码、安装位置、终端标识、支持缴费方式、是否打印票据、设备状态、投产日期、审计字段"],"acceptance":["新增设备后该终端可正常登录受理缴费","按设备编号可汇总查询其全部缴费流水","停用设备终端登录被拒绝"],"notes":"SRS未涉及自助机与系统的通讯协议、现金钞箱管理与差错处理，属需求缺口。"},{"id":"FR-3.4","name":"公众缴费平台","srsRef":"4.3.4","priority":1,"srsDesc":"管理公众缴费如微信支付宝等缴费配置，如限制收费类型、用户状态。输入：增加修改缴费通道；输出：展示系统公众缴费通道。","refinedDesc":"维护微信、支付宝、公众号等线上公众缴费通道（pps平台）配置。字段应含：通道编码、通道名称（微信支付/支付宝/公众号/小程序）、商户号、AppID、支付密钥（加密存储）、回调地址、允许缴纳的收费类型集合（引用FR-3.1）、允许缴费的用户状态集合（引用FR-1.1）、单笔限额、日累计限额、启用/停用标志。规则：用户状态不在允许集合内（如已销户）时线上查询/缴费被拦截；收费类型不在允许集合内的费项不展示或标记不可线上缴；通道停用立即停止受理新支付但已发起订单继续完成回调处理；配置变更留审计日志。","actors":["营业管理员","系统管理员"],"preconditions":["已登录供水营销管理系统","收费类型、用户状态字典已维护","已从支付渠道方取得商户号/密钥","具有渠道配置权限"],"mainFlow":["1. 进入pps公众缴费平台配置页面，系统展示已配置通道列表","2. 点击『新增』或选中通道『修改』","3. 录入通道名称、商户号、AppID、密钥、回调地址","4. 勾选允许的收费类型集合与允许的用户状态集合，设置限额","5. 提交后系统校验商户参数完整性并加密保存密钥","6. 保存成功，通道生效，线上缴费请求按配置过滤","7. 系统展示各通道当日交易笔数/金额概览"],"altFlows":["5a. 商户参数不完整或密钥格式错误：拒绝保存","6a. 已销户状态用户在线上查询缴费：平台按配置拦截并返回不可缴提示","6b. 通道停用期间收到支付回调：仍完成销账处理并记录，防止掉单"],"inputs":["通道编码","通道名称","商户号","AppID","支付密钥","回调地址","允许收费类型集合","允许用户状态集合","单笔/日累计限额","启停用标志"],"outputs":["公众缴费通道列表（含状态与当日交易概览）","操作结果提示"],"dataItems":["缴费通道表：通道编码、通道名称、商户号、AppID、密钥（密文）、回调地址、限额、启停用标志、审计字段","通道-收费类型限制表：通道编码、收费类型编码","通道-用户状态限制表：通道编码、用户状态编码"],"acceptance":["被限制状态的用户在微信端查询时收到不可缴费提示","被限制的收费类型不出现在线上待缴列表","密钥在数据库中不以明文存储，配置修改有审计记录"],"notes":"SRS未要求密钥加密存储与掉单补偿机制，属安全与可靠性需求缺口，本细化已补充；『pps』缩写SRS未解释。"}]},{"id":"M4","name":"柜台收费业务","srsRef":"4.4","goal":"营业厅柜台受理单户销账、批量销账与预收费业务，完成欠费查询、收款、销账、票据打印的柜面闭环。","functions":[{"id":"FR-4.1","name":"单户销账","srsRef":"4.4.1","priority":1,"srsDesc":"查询账单信息，对选中的账单进行销账。输入：户号、户名；输出：展示用户欠费信息列表。","refinedDesc":"柜台按单户受理水费缴纳。柜员按户号（精确）或户名/地址（模糊）查询用户欠费账单列表，列表展示每期账单的账期、用水量、水费、污水费、其他费项、滞纳金（按销账当日重算）、合计与用户预存余额。柜员勾选一条或多条账单（须按账期先后连续勾选，不允许跳期销账），录入实收金额与付款方式（现金/扫码/银行卡），系统按收费类型冲抵顺序核销，支持预存余额抵扣，生成收费流水（含网点、柜员、付款方式），销账后账单状态置为已缴并可打印票据。冲正/作废当日流水需授权并生成红冲记录。","actors":["收费柜员","客户"],"preconditions":["柜员已登录并选择所属收费网点","用户档案存在且有开账账单","具有柜台收费权限"],"mainFlow":["1. 柜员进入单户销账页面，输入户号或户名查询","2. 系统展示用户基本信息、预存余额与欠费账单列表（含当日滞纳金）","3. 柜员按账期顺序勾选待缴账单，系统实时合计应收金额","4. 录入实收金额、选择付款方式，可选使用预存余额抵扣","5. 确认收款，系统校验实收金额与应收一致后执行销账","6. 系统更新账单状态为已缴、扣减预存（如使用）、生成收费流水","7. 系统提示销账成功，进入票据打印（联动FR-5.2）","8. 屏幕返回该户最新欠费状态供柜员向客户确认"],"altFlows":["1a. 户号不存在或查询无结果：提示核对户号/户名","3a. 跳期勾选（欠早期费用未选却选后期）：系统阻止并提示按账期顺序缴纳","5a. 实收金额与应收不一致：拒绝销账（部分销账是否允许由参数配置）","6a. 销账过程系统异常：整笔事务回滚，账单状态不变，提示重试","7a. 当日错收：授权后冲正，生成红字流水并恢复账单欠费状态"],"inputs":["户号","户名","地址（模糊查询）","勾选账单集合","实收金额","付款方式","是否使用预存抵扣"],"outputs":["用户欠费账单列表","销账结果与收费流水号","票据打印数据"],"dataItems":["账单：账单号、户号、账期、水量、水费、污水费、滞纳金、应收合计、已收金额、账单状态","收费流水：流水号、户号、账单号集合、实收金额、付款方式、网点编码、柜员、收费时间、状态（正常/冲正）"],"acceptance":["勾选多期账单销账后各账单状态均为已缴且流水金额=各期应收之和","滞纳金按销账当日计算，与账单生成日不同则金额随之更新","跳期销账被系统阻止","冲正后账单恢复欠费状态且存在对应红字流水"],"notes":"SRS仅描述到『展示用户欠费信息列表』，销账动作本身的规则（冲抵顺序、跳期控制、冲正）完全未写，本细化为主要补充；滞纳金计算规则（起算日、费率）全文档未定义，是重要需求缺口。"},{"id":"FR-4.2","name":"批量销账","srsRef":"4.4.2","priority":2,"srsDesc":"查询账单信息，对选中的多条账单进行批量销账。输入：表册号；输出：展示欠费列表信息。","refinedDesc":"面向单位代扣、整册托收等场景，按表册号（也应支持单位编号/文件导入）批量查询多户欠费并一次性销账。柜员输入表册号，系统列出册内全部欠费户及各户欠费合计，支持全选/反选/按条件过滤（欠费期数、金额区间），确认批量应收总额后一次收款，系统逐户逐单执行销账，生成一张批量收费汇总流水与逐户明细流水。逐户处理相互独立：单户失败（如该户账单已被其他渠道缴纳）不影响其他户，失败户列入错误清单并给出原因，成功户正常销账。","actors":["收费柜员","单位客户/托收经办"],"preconditions":["柜员已登录并选择网点","目标表册存在且册内有欠费用户","具有批量销账权限"],"mainFlow":["1. 柜员进入批量销账页面，输入表册号查询","2. 系统展示册内欠费户列表（户号、户名、欠费期数、欠费合计）及全册合计","3. 柜员全选或按条件筛选后勾选目标用户","4. 系统汇总本次批量应收总额，柜员确认收款方式并收款","5. 系统逐户执行销账，实时显示处理进度","6. 处理完成，系统展示结果汇总：成功N户/失败M户及失败原因清单","7. 生成批量汇总流水与逐户明细流水，可打印批量收费汇总单","8. 失败户可导出清单供人工单户处理"],"altFlows":["1a. 表册号不存在：提示核对","5a. 某户账单在处理瞬间已被线上渠道缴纳：该户跳过并计入失败清单，原因为『账单状态已变化』","5b. 批量过程中断（网络/系统故障）：已成功户保留，未处理户可按批次号续做，不重复销账","4a. 实收总额与应收总额不一致：拒绝执行"],"inputs":["表册号","筛选条件（欠费期数/金额区间）","勾选用户集合","实收总金额","付款方式"],"outputs":["册内欠费列表","批量处理结果汇总（成功/失败户数）","批量汇总流水与逐户明细流水","失败原因清单"],"dataItems":["批量销账批次：批次号、表册号、总户数、成功户数、失败户数、应收总额、实收总额、状态","逐户明细流水：批次号、户号、账单号集合、销账金额、结果、失败原因"],"acceptance":["批量销账后成功户账单全部置为已缴，明细流水之和=汇总流水金额","单户失败不影响其他户，失败原因可查询导出","同一批次重复提交不产生重复销账（幂等）"],"notes":"SRS仅以表册号为输入，未覆盖单位代扣名单导入场景；批量部分成功的事务边界与续做机制SRS未定义，本细化补充，需与财务确认口径。"},{"id":"FR-4.3","name":"预收费","srsRef":"4.4.3","priority":2,"srsDesc":"功能等同与单户销账，用户预存缴费，取款操作。输入：户号、户名、地址；输出：查询出当前预收户的缴费信息。","refinedDesc":"管理用户预存账户：预存缴费（充值）与取款（退还余额）。按户号/户名/地址查询用户，展示预存账户当前余额与预存流水（存入/开账自动抵扣/柜台抵扣/取款）。预存充值：录入充值金额与付款方式，系统增加余额并生成预存流水与收据。取款：校验可退余额，超过阈值或销户退款需主管授权，生成退款流水。规则：开账后是否自动用预存余额抵扣新账单由系统参数或单户标志控制；预存余额不足抵扣时账单余额挂欠费；预存流水与收费流水统一纳入网点日结与财务对账。","actors":["收费柜员","客户","柜台主管（授权取款）"],"preconditions":["柜员已登录并选择网点","用户档案存在","具有预收费操作权限"],"mainFlow":["1. 柜员进入预收费管理页面，输入户号/户名/地址查询","2. 系统展示该预收户的账户余额、历史预存流水与当前欠费信息","3. 选择业务类型：预存充值或取款","4. 充值：录入金额与付款方式，确认后系统增加余额、生成预存流水","5. 系统提示成功并打印预存收据","6. 若该户有欠费且开启自动抵扣，系统提示可立即用余额销账（联动FR-4.1）","7. 取款：录入退款金额，系统校验不超过可退余额，主管授权后扣减余额并生成退款流水"],"altFlows":["4a. 充值金额≤0或超单笔限额：拒绝","7a. 退款金额>账户余额：拒绝并提示可退上限","7b. 主管授权失败：取款终止","6a. 自动抵扣时余额不足整期账单：按配置部分抵扣或不抵扣挂欠费"],"inputs":["户号","户名","地址","业务类型（充值/取款）","金额","付款方式","授权人"],"outputs":["预收户账户余额与缴费信息","预存/退款流水","预存收据打印数据"],"dataItems":["预存账户：户号、当前余额、累计存入、累计抵扣、状态","预存流水：流水号、户号、类型（存入/抵扣/取款）、金额、付款方式、网点、柜员、时间、授权人"],"acceptance":["充值后余额=原余额+充值金额，且流水可查","取款超余额被拒绝，取款需授权记录","开账自动抵扣后账单已缴金额与预存扣减金额一致"],"notes":"SRS『功能等同与单户销账』表述含糊（错别字：与→于），预存与销账实为两类账务动作；自动抵扣策略、退款审批阈值SRS均未定义，需业务确认。"}]},{"id":"M5","name":"票据基础信息","srsRef":"4.5","goal":"维护票据类型与票据打印格式，规范收费后各类发票、收据的开具与套打输出。","functions":[{"id":"FR-5.1","name":"票据类型","srsRef":"4.5.1","priority":1,"srsDesc":"设置发票的开票类型。输入：增加票据类型；输出：展示当前系统的票据类型信息。","refinedDesc":"维护开票类型字典。字段应含：票据类型编码（唯一）、票据类型名称（普通发票、增值税发票、污水费发票、水费收据、预存收据等，对应3.2『打印普通发票、增值税发票、污水费发票及其他各种水费结算凭证』）、票据介质（纸质/电子）、税率、税收分类编码、是否需要纳税人信息、启用/停用标志。规则：收费类型（FR-3.1）与票据类型建立映射，销账后按映射确定默认开票类型；票据类型下可配置多个票据格式（FR-5.2）；被票据格式或开票记录引用的类型禁止删除。","actors":["营业管理员","财务人员"],"preconditions":["已登录供水营销管理系统","具有票据基础信息维护权限"],"mainFlow":["1. 进入票据类型管理页面，系统展示票据类型列表","2. 点击『新增』，录入类型编码、名称","3. 选择票据介质、录入税率与税收分类编码","4. 提交后系统校验编码唯一性并保存","5. 保存成功刷新列表","6. 支持修改与启用/停用，展示各类型下已配置格式数"],"altFlows":["4a. 编码重复：拒绝保存","6a. 删除被格式或开票记录引用的类型：拒绝，只允许停用"],"inputs":["票据类型编码","票据类型名称","票据介质","税率","税收分类编码","启停用标志"],"outputs":["票据类型列表","操作结果提示"],"dataItems":["票据类型表：类型编码、类型名称、介质、税率、税收分类编码、是否需纳税人信息、启停用标志、审计字段"],"acceptance":["新增票据类型后可在票据格式配置中被引用","销账开票时可按收费类型映射带出默认票据类型","删除被引用类型被拒绝"],"notes":"SRS未涉及增值税发票与税控/电子发票平台的对接方式、票号管理（领用、核销、作废），属需求缺口。"},{"id":"FR-5.2","name":"票据格式","srsRef":"4.5.2","priority":1,"srsDesc":"根据发票类型设置发票的格式配置。输入：增加票据格式；输出：展示发票的票据格式信息。","refinedDesc":"按票据类型配置打印格式模板。字段应含：格式编码、格式名称、所属票据类型（引用FR-5.1）、纸张规格（宽×高mm）、打印方式（针式套打/激光/热敏）、打印要素及坐标（户号、户名、地址、账期、水量、各费项金额、金额大写、合计、收费员、收费日期、二维码等要素的X/Y坐标与字体）、打印份数、套打偏移量、启用/停用标志、版本号。规则：一个票据类型可维护多个格式版本，同一时间仅一个启用（新版启用旧版自动停用）；柜台打票（FR-4.1/4.3联动）按票据类型取当前启用格式渲染；格式支持打印预览与测试打印。","actors":["营业管理员","系统管理员"],"preconditions":["已登录供水营销管理系统","对应票据类型已存在","具有票据基础信息维护权限"],"mainFlow":["1. 进入票据格式管理页面，选择票据类型，系统展示其下格式列表","2. 点击『新增』，录入格式名称、纸张规格、打印方式","3. 逐项配置打印要素的坐标、字体与是否打印","4. 执行打印预览/测试打印，校对套打效果","5. 提交保存，系统记录格式版本","6. 点击『启用』，系统自动停用该票据类型下原启用格式","7. 柜台开票即按新格式输出"],"altFlows":["4a. 测试打印偏移：调整套打偏移量后重新预览","6a. 启用格式时该类型无任何要素配置：拒绝启用并提示","7a. 删除当前启用中的格式：拒绝，须先启用其他格式"],"inputs":["票据类型","格式名称","纸张规格","打印方式","打印要素坐标/字体集合","打印份数","套打偏移量"],"outputs":["票据格式列表（含启用状态与版本）","打印预览效果","操作结果提示"],"dataItems":["票据格式表：格式编码、格式名称、票据类型编码、纸张规格、打印方式、份数、偏移量、启用标志、版本号、审计字段","格式要素明细：格式编码、要素名称、X坐标、Y坐标、字体、字号、是否打印"],"acceptance":["同一票据类型同一时间有且仅有一个启用格式","柜台实际打票版式与预览一致","启用新格式后旧格式自动停用且历史开票记录仍可按原格式补打"],"notes":"SRS操作序列写『打开票据类型，新增修改票据格式』，入口描述与4.5.1混同；要素级坐标配置为细化补充，SRS未定义格式配置的粒度。"}]},{"id":"M6","name":"水表基础数据","srsRef":"4.6","goal":"维护水表类型、口径、参数、厂家四类基础资料，为水表档案建立、翻表水量计算与周期换表计划提供依据。","functions":[{"id":"FR-6.1","name":"水表类型","srsRef":"4.6.1","priority":1,"srsDesc":"可查询、编辑水表的类型；3.3补充：类型包括远传表、水平旋翼、垂直旋翼、流量计，可以选择是否启用禁用。输入：新增水表类型；输出：展示当前系统的水表类型种类。","refinedDesc":"维护水表类型字典。字段应含：类型编码（唯一）、类型名称（远传表、水平旋翼、垂直旋翼、流量计等）、是否远传标志、计量方式（机械/电子/超声）、启用/禁用标志、备注。规则：『是否远传』决定该类型水表的抄表数据可否走远传/抄表机导入通道（FR-7.3），非远传表只能手工或表格录入；被水表档案引用的类型禁止删除，只能禁用；禁用类型不可在新装表时选择。","actors":["营业管理员","表务管理员"],"preconditions":["已登录供水营销管理系统","具有水表基础数据维护权限"],"mainFlow":["1. 进入水表类型管理页面，系统展示类型列表","2. 点击『新增』，录入类型编码、名称","3. 勾选是否远传标志、选择计量方式","4. 提交后系统校验编码/名称唯一性并保存","5. 保存成功刷新列表","6. 支持编辑与启用/禁用操作"],"altFlows":["4a. 编码或名称重复：拒绝保存","6a. 删除被水表档案引用的类型：拒绝，只允许禁用"],"inputs":["类型编码","类型名称","是否远传","计量方式","启用/禁用标志"],"outputs":["水表类型列表","操作结果提示"],"dataItems":["水表类型表：类型编码、类型名称、是否远传、计量方式、启停用标志、备注、审计字段"],"acceptance":["远传类型水表可出现在远传数据导入范围内，非远传类型不出现","禁用类型在新装表界面不可选","删除被引用类型被拒绝"],"notes":"SRS未定义水表类型与抄表通道的联动规则，『是否远传』标志为细化补充。"},{"id":"FR-6.2","name":"水表口径","srsRef":"4.6.2","priority":1,"srsDesc":"可查询、编辑各个水表口径下的最大读数、换表读数、换表周期等信息。输入：新增水表口径信息；输出：系统当前拥有的水表口径及信息。","refinedDesc":"维护水表口径规格字典。字段应含：口径编码、口径规格（DN15/DN20/DN25/DN40/DN50/DN100等）、最大读数（表位量程，如99999，用于翻表过零水量计算）、换表读数（累计行度达到该值触发换表建议）、换表周期（使用年限，年，驱动周期换表计划）、启用/停用标志。规则：抄表算量时若本期行至小于上期行至且判定为翻表，按『最大读数-上期行至+本期行至』修正水量；表务周期换表计划按『装表日期+换表周期』或『累计行度≥换表读数』两条件筛选到期表；被水表档案引用的口径禁止删除。","actors":["营业管理员","表务管理员"],"preconditions":["已登录供水营销管理系统","具有水表基础数据维护权限"],"mainFlow":["1. 进入水表口径管理页面，系统展示口径列表","2. 点击『新增』，录入口径规格","3. 录入最大读数、换表读数、换表周期","4. 提交后系统校验口径唯一性与数值合法性（换表读数≤最大读数）","5. 保存成功刷新列表","6. 支持编辑与启用/停用"],"altFlows":["4a. 换表读数大于最大读数：拒绝保存并提示","6a. 删除被水表档案引用的口径：拒绝","6b. 修改最大读数：提示影响翻表水量计算，需二次确认"],"inputs":["口径规格","最大读数","换表读数","换表周期（年）","启停用标志"],"outputs":["水表口径列表及各口径参数","操作结果提示"],"dataItems":["水表口径表：口径编码、口径规格、最大读数、换表读数、换表周期、启停用标志、审计字段"],"acceptance":["翻表用户的本期水量按该口径最大读数正确修正","换表读数>最大读数时保存被拒绝","到达换表周期的水表出现在周期换表计划中"],"notes":"SRS操作序列误写『打开水表类型，新增修改水表类型』，应为水表口径，系复制粘贴错误。"},{"id":"FR-6.3","name":"水表参数","srsRef":"4.6.3","priority":1,"srsDesc":"查询编辑水表各口径的参数信息。输入：修改水表口径对应参数；输出：展示水表口径的下各个参数信息。","refinedDesc":"按口径维护水表计量与检定参数。字段应含：所属口径（引用FR-6.2）、参数项编码/名称、参数值、计量单位，典型参数项包括：公称流量Q3、最小流量Q1、分界流量Q2、始动流量、计量等级、首检有效期、周检周期（年）、检定依据规程、压力等级。规则：一个口径下可维护多条参数记录（参数项-参数值键值结构）；参数供水表检定/周检计划与表务台账引用；参数修改留版本记录以便追溯历史检定依据。","actors":["表务管理员","营业管理员"],"preconditions":["已登录供水营销管理系统","对应水表口径已维护","具有水表基础数据维护权限"],"mainFlow":["1. 进入水表参数管理页面，选择口径，系统展示该口径下参数列表","2. 点击『新增』，选择参数项并录入参数值与单位","3. 提交后系统校验同口径下参数项不重复、数值合法","4. 保存成功刷新参数列表","5. 支持修改参数值，系统保留修改前值的版本记录","6. 支持按口径批量复制参数到相近口径"],"altFlows":["3a. 同口径重复参数项：拒绝保存","5a. 参数被检定计划引用期间修改：提示自下一检定周期生效"],"inputs":["口径","参数项","参数值","计量单位"],"outputs":["口径下参数信息列表","参数修改版本记录","操作结果提示"],"dataItems":["水表参数表：口径编码、参数项编码、参数项名称、参数值、单位、版本号、审计字段"],"acceptance":["同一口径下同一参数项唯一","参数修改后可查询修改前的历史版本"],"notes":"SRS未列出任何具体参数项，且与4.6.2（口径）职责边界模糊——口径节已含最大读数/换表读数/换表周期，本节按『计量检定类参数』细化划分，两节字段归属需与业务澄清。"},{"id":"FR-6.4","name":"水表厂家","srsRef":"4.6.4","priority":5,"srsDesc":"查看水表生产厂家信息。可新增、编辑、删除、启用、禁用。输入：增加水表厂家；输出（原文误植）：号码池内显示关联的隐号网关；补充说明：展示系统所有的水表水表厂家。","refinedDesc":"维护水表生产厂家档案。字段应含：厂家编码（唯一）、厂家名称、统一社会信用代码、联系人、联系电话、地址、供货范围（口径/类型）、资质有效期、启用/禁用标志、备注。规则：水表档案（表身号入库）须挂接厂家，用于质量追溯与到货验收统计；被水表档案引用的厂家禁止删除，只允许禁用；禁用厂家不可在新表入库时选择。","actors":["表务管理员","营业管理员"],"preconditions":["已登录供水营销管理系统","具有水表基础数据维护权限"],"mainFlow":["1. 进入水表厂家管理页面，系统展示厂家列表","2. 点击『新增』，录入厂家编码、名称、信用代码","3. 录入联系人、电话、地址与供货范围","4. 提交后系统校验编码与信用代码唯一性并保存","5. 保存成功刷新列表","6. 支持编辑、删除（未被引用时）、启用、禁用操作"],"altFlows":["4a. 厂家编码或信用代码重复：拒绝保存","6a. 删除被水表档案引用的厂家：拒绝，只允许禁用"],"inputs":["厂家编码","厂家名称","统一社会信用代码","联系人","联系电话","地址","供货范围","启用/禁用标志"],"outputs":["水表厂家列表","操作结果提示"],"dataItems":["水表厂家表：厂家编码、厂家名称、信用代码、联系人、电话、地址、供货范围、资质有效期、启停用标志、备注、审计字段"],"acceptance":["新增厂家后可在水表入库时被选择","删除被引用厂家被拒绝，禁用后新入库不可选","按厂家可统计其在装水表数量"],"notes":"SRS重大文档缺陷：输出栏写『号码池内显示关联的隐号网关』，系通信行业项目文档复制残留；真实输出内容被误置于补充说明栏（『展示系统所有的水表水表厂家』，且『水表』二字重复），两栏内容颠倒，需修订SRS。"}]},{"id":"M7","name":"抄表计划","srsRef":"4.7","goal":"提供手工录入、Excel表格导入、抄表机/远传数据导入三种抄表数据采集方式，完成本期读数采集、水量计算与异常识别，形成待开账数据。","functions":[{"id":"FR-7.1","name":"手工抄表录入","srsRef":"4.7.1","priority":1,"srsDesc":"手工抄表输入，户号、本期行至抄表。3.3补充：手工抄表时可以看到换表信息、总分表信息、备忘信息，这三项可能影响抄表、行至及实收水量等；抄完表时下面会显示账单信息。输入：户号、本期行至；输出：展示当前抄表户的抄表信息。","refinedDesc":"柜面/内勤逐户录入抄表读数。按表册顺序（FR-2.3）或户号定位用户，界面展示：上期行至、上期抄表日期、近6期平均水量、换表信息（换表日期、旧表止度、新表起度——影响本期水量拼接）、总分表信息（总表/分表关系——影响总分差水量分摊）、备忘信息（如门禁、狗、表位变更等抄表提示）。录入本期行至后系统自动计算本期水量=本期行至-上期行至，遇换表按『旧表止度-上期行至+本期行至-新表起度』拼接，遇翻表按口径最大读数（FR-6.2）修正。录入即时校验：负行度（本期<上期且非换表/翻表）、水量为0、水量超近6期均量N倍（N可配置）时标记异常并要求选择异常原因（估抄/复核待办）。抄完当前户，界面下方即时显示按水价试算的账单信息（水量、金额）。","actors":["抄表员","营业内勤"],"preconditions":["已登录供水营销管理系统","本期抄表计划已生成且该户在计划内","户表档案与上期行至数据完整"],"mainFlow":["1. 进入手工抄表页面，选择表册，系统按抄表顺序列出待抄用户","2. 定位到某户，系统展示上期行至、换表信息、总分表信息、备忘信息","3. 录入本期行至","4. 系统自动计算本期水量（含换表拼接/翻表修正）","5. 系统执行异常校验（负行度/零水量/超均量），正常则标记已抄","6. 界面下方显示该户本期账单试算信息（水量、各费项金额）","7. 自动跳转下一顺序户，重复2-6步","8. 全册抄完，系统汇总本期抄见率与异常户数"],"altFlows":["5a. 负行度且无换表记录：标记异常，要求选择原因（误抄/翻表/倒装），转异常复核","5b. 水量超均量N倍：弹出异常确认，可现场复核或标记待复抄","3a. 该户本期已有抄表记录：提示是否覆盖，覆盖需权限并留痕","2a. 用户状态为不抄表状态：该户不出现在待抄列表"],"inputs":["表册号","户号","本期行至","抄表日期","异常原因（如有）"],"outputs":["当前抄表户的抄表信息（本期水量、异常标记）","账单试算信息","全册抄表进度与异常汇总"],"dataItems":["抄表记录：户号、表册号、账期、上期行至、本期行至、本期水量、抄表方式（手工）、抄表日期、抄表员、异常标记、异常原因","关联展示：换表记录（换表日期、旧表止度、新表起度）、总分表关系、用户备忘"],"acceptance":["换表户本期水量=旧表段+新表段之和，计算正确","本期行至小于上期行至且非换表时系统强制异常标记，不能静默入库","抄表完成后界面即时显示账单试算信息","超均量N倍阈值可配置且触发提示"],"notes":"3.3明确换表/总分表/备忘三项影响抄表结果，但4.7.1正文未展开三项的具体影响规则，水量拼接与总分差分摊算法为细化补充，需算费规则确认。"},{"id":"FR-7.2","name":"表格录入","srsRef":"4.7.2","priority":5,"srsDesc":"表格导入抄表数据（Excel表格导入抄表信息）。输入：无；输出：无（SRS原文即如此）。","refinedDesc":"通过Excel模板批量导入抄表数据。系统提供标准模板下载（列：户号、表身号、本期行至、抄表日期、备注），内勤填报后上传，系统逐行解析校验：户号存在性、户号在本期计划内、表身号与档案一致、本期行至为数字、同批次/同账期重复行、负行度与超均量异常。校验全部通过（或按『部分通过』策略）后写入抄表记录，异常行不入库并生成错误清单（行号+原因）供下载修正后重新上传。导入结果给出统计：总行数、成功、失败、异常待复核。","actors":["营业内勤"],"preconditions":["已登录供水营销管理系统","本期抄表计划已生成","已按模板格式准备Excel文件"],"mainFlow":["1. 进入表格录入页面，下载标准Excel模板","2. 内勤离线填报户号、本期行至等列","3. 上传Excel文件，系统解析并逐行校验","4. 系统展示校验预览：可导入行、错误行（含原因）、异常行","5. 确认导入，系统将合格行写入抄表记录并计算水量","6. 系统输出导入结果统计（总数/成功/失败/异常）","7. 错误清单可下载，修正后重新上传补导"],"altFlows":["3a. 文件格式不符/列缺失：整体拒绝并提示模板版本","3b. 某行户号不存在或不在本期计划：该行入错误清单","3c. 同一户号本批次出现多行：仅保留首行或整批拒绝（策略可配置）","5a. 某行户号本期已有抄表记录：默认跳过，可选覆盖（需权限）"],"inputs":["Excel文件（户号、表身号、本期行至、抄表日期、备注）"],"outputs":["校验预览结果","导入结果统计（总行/成功/失败/异常）","错误清单文件"],"dataItems":["导入批次：批次号、文件名、上传人、上传时间、总行数、成功数、失败数","抄表记录：同FR-7.1，抄表方式=表格导入","错误明细：批次号、行号、户号、错误原因"],"acceptance":["含错误行的文件导入后合格行成功入库、错误行有明确行号与原因","同批次重复户号按配置策略处理且不产生重复抄表记录","导入的读数同样执行负行度/超均量异常校验"],"notes":"SRS该节输入、输出均填『无』且未定义模板字段，属文档缺陷；模板列与校验规则为本细化补充。"},{"id":"FR-7.3","name":"抄表数据导入","srsRef":"4.7.3","priority":1,"srsDesc":"抄表机器抄表数据导入系统。操作序列原文：打开远传数据导入进行表格数据导入。输入：无；输出：无（SRS原文即如此）。","refinedDesc":"将抄表机（掌上机）采集数据文件或远传表自动采集数据导入系统。抄表机路径：抄表员外勤抄表后回传数据文件，选择表册与文件上传，系统按设备号+表册匹配任务，解析每户读数、抄表时间、现场照片/坐标（如有）。远传路径：按远传表集抄平台的数据接口/文件定时拉取读数。两路数据统一进入校验流水线：户表匹配、负行度、零水量、超均量、估抄标记识别，合格数据写入抄表记录并计算水量，异常数据进入异常待复核队列。导入结果统计成功/失败/异常户数，支持按表册查看导入明细与未回传户（漏抄）清单。","actors":["抄表员","营业内勤","远传集抄平台（系统）"],"preconditions":["已登录供水营销管理系统","本期抄表任务已下发至抄表机或远传采集正常","水表类型为远传的用户已在远传采集范围（FR-6.1）"],"mainFlow":["1. 进入抄表数据导入页面，选择导入来源（抄表机文件/远传数据）","2. 抄表机路径：选择表册并上传数据文件；远传路径：选择采集日期范围拉取","3. 系统解析数据并与本期抄表任务逐户匹配","4. 系统执行统一异常校验（负行度/零水量/超均量/估抄标记）","5. 合格记录写入抄表记录并自动计算本期水量","6. 异常记录进入待复核队列，通知抄表班长处理","7. 系统输出导入统计：应抄户数、成功、失败、异常、未回传（漏抄）","8. 漏抄户清单可转手工抄表录入（FR-7.1）补录"],"altFlows":["3a. 文件与所选表册不匹配（设备号/任务号不符）：拒绝导入","3b. 某户不在本期任务内：该记录入失败清单","4a. 远传表通讯故障读数缺失：计入未回传清单并提示改走人工补抄","5a. 同户重复导入：默认以最新采集时间为准并留覆盖痕迹"],"inputs":["导入来源（抄表机/远传）","表册号","抄表机数据文件或远传采集日期范围"],"outputs":["导入结果统计（应抄/成功/失败/异常/未回传）","异常待复核队列","漏抄户清单"],"dataItems":["导入批次：批次号、来源、表册号、设备号、导入人、导入时间、各状态户数","抄表记录：同FR-7.1，抄表方式=抄表机导入/远传采集","异常队列：户号、异常类型、读数、处理状态、处理人"],"acceptance":["抄表机文件导入后成功记录数+失败+异常+未回传=应抄户数，账目闭合","异常记录不直接进入开账，须经复核处理","同户重复导入不产生重复抄表记录"],"notes":"SRS操作序列写『打开远传数据导入进行表格数据导入』，将远传导入与表格导入混为一谈，通道定义混乱；输入/输出栏均为『无』；掌上机任务下载-回传的闭环功能在3.1『掌上机抄表管理』模块提及但全文未详述（见expansion），本节仅覆盖导入侧。"}]},{"id":"M8","name":"外部接口","srsRef":"5.2","goal":"面向银行等第三方渠道提供按户号查询缴费单、缴费单销账、对账通知三个标准HTTP接口，实现银行代收业务的查询-销账-对账闭环。","functions":[{"id":"FR-8.1","name":"按户号查询缴费单","srsRef":"5.2.1","priority":1,"srsDesc":"用户在银行查询缴费时，可以使用该接口进行账单查询。请求地址：http(s)://.../server/dpwater.bankpay.qbilling。","refinedDesc":"供银行/第三方渠道按户号实时查询用户欠费缴费单的HTTP接口。平台校验bankentityno（银行实体编号，由平台分配，如GH=工商银行）合法性后，按accno（户号，水表唯一编号）查询用户档案与全部未缴账单，汇总返回：户名、地址、欠费笔数billcount、欠费总额billamount、应收金额rcvblamount、已收金额rcvedamount、滞纳金latefee（按查询当日计算）、预存余额prepayamount，并生成本次查询的平台欠费查询流水号pyqbillid——该流水号是后续销账接口（FR-8.2）锁定账单快照的关键，用于解决跨天滞纳金变化与新增欠费导致的销账失败问题。金额单位统一为分（与销账接口口径一致）。","actors":["银行/第三方渠道系统","营销平台接口服务"],"preconditions":["银行已获平台分配的bankentityno并完成接入联调","接口通道网络可达且启用SSL传输加密","用户档案与账单数据在线可查"],"mainFlow":["1. 客户在银行渠道输入户号发起水费查询","2. 银行系统POST调用dpwater.bankpay.qbilling，传入accno与bankentityno","3. 平台校验bankentityno为有效合作渠道","4. 平台按accno查询用户档案与全部欠费账单，按查询当日重算滞纳金","5. 平台生成唯一欠费查询流水号pyqbillid并保存本次账单金额快照","6. 平台返回code=1及data数组（户名、地址、billcount、billamount、rcvblamount、rcvedamount、latefee、prepayamount、pyqbillid、extend）","7. 银行向客户展示欠费信息，等待客户确认缴费"],"altFlows":["3a. bankentityno非法或已停用：返回错误code与msg，不泄露用户信息","4a. 户号不存在：返回错误code，msg提示户号有误","4b. 户号存在但无欠费：返回成功，billcount=0、billamount=0","4c. 用户状态不允许缴费（如已销户）：按渠道配置返回不可缴提示"],"inputs":["accno（string，20，必填，户号）","bankentityno（string，10，必填，银行实体编号）"],"outputs":["code（结果码，1=成功）","msg（结果说明）","data数组：bankentityno、accno、name、address、billcount、billamount、rcvblamount、rcvedamount、latefee、prepayamount、pyqbillid、extend"],"dataItems":["入参：accno string(20)必填、bankentityno string(10)必填","出参data：bankentityno、accno、name（户名）、address（地址）、billcount（欠费笔数）、billamount（欠费总额，分）、rcvblamount（应收金额，分）、rcvedamount（已收金额，分）、latefee（滞纳金，分）、prepayamount（预存余额，分）、pyqbillid（平台欠费查询流水号，40）、extend（JSON扩展串）","平台侧：欠费查询快照表（pyqbillid、accno、查询时点账单集合与金额、生成时间、有效期）"],"acceptance":["有欠费、无欠费、户号不存在、银行编号非法四种场景分别返回约定的code/msg","同一户号每次查询生成的pyqbillid唯一且可追溯到当次金额快照","接口响应时间满足非功能要求（在线实时查询低于3秒）"],"notes":"SRS未给出接口优先级，按代收核心链路补记为1；出参金额单位未标注（销账接口标注『金额分』，推断一致）；错误码表、pyqbillid有效期、查询频率限制均未定义，需接口联调规范补充；5.2导言提到『销账冲红』功能但未提供对应接口定义。"},{"id":"FR-8.2","name":"缴费单销账","srsRef":"5.2.2","priority":1,"srsDesc":"银行收款后调用该接口完成平台侧销账。请求地址：http(s)://.../server/dpwater.bankpay.charge。（SRS该节标题下另有『单个A号码新增』字样，系残留。）","refinedDesc":"银行完成收款后调用的销账接口。核心规则：(1) bankno（银行进账流水号）作为缴费、冲正、对账的唯一凭证，不能重复——平台以其做幂等控制，重复请求返回原销账结果而不重复记账；(2) pyqbillid（平台欠费查询流水号）新开发银行端程序必须提供，提供后平台按查询时点的账单金额快照锁定销账，解决『跨天滞纳金变化导致销账不成功』和『用户新增欠费导致销账不成功』两个棘手问题；提供pyqbillid时accno可不传；(3) payamount（用户实际缴费金额，分）须与billamount（欠费查询时返回的应缴金额，分）比对，不一致则拒绝销账要求重新查询。销账成功后平台核销对应账单、生成平台销账流水pychargeid返回银行，流水记录paydate（银行账务日期yyyyMMdd）与opername（银行操作员）备对账。","actors":["银行/第三方渠道系统","营销平台接口服务","营销系统账务核心"],"preconditions":["银行已通过FR-8.1查询获得账单信息与pyqbillid","客户已在银行端完成付款","bankno已由银行生成且全局唯一"],"mainFlow":["1. 银行收款成功后POST调用dpwater.bankpay.charge","2. 平台校验bankentityno合法、必填参数完整、paydate格式为yyyyMMdd","3. 平台按bankno查重：若已存在则直接返回原销账结果（幂等）","4. 平台按pyqbillid取账单快照，校验payamount与billamount一致","5. 校验通过，平台锁定并核销对应账单，更新账单状态为已缴","6. 平台生成销账流水pychargeid，记录bankno、paydate、payamount、opername","7. 平台返回code=1及data（accno、name、address、pychargeid、bankno、paydate、payamount）","8. 银行打印回单，交易完成"],"altFlows":["4a. 未传pyqbillid（老版银行端）：平台按accno实时查欠费匹配销账，若跨天滞纳金已变化或有新增欠费导致金额不符，返回销账失败要求重新查询","4b. pyqbillid对应账单已被其他渠道缴纳：返回失败，提示账单状态已变化","4c. payamount与billamount不一致：返回失败及差额说明","2a. bankno重复且原交易金额不同：返回错误，提示流水冲突需人工核查","5a. 销账中系统异常：事务回滚，返回失败，银行端按超时冲正机制处理"],"inputs":["bankentityno（string，10，必填）","accno（string，20，条件必填：提供pyqbillid时可不填）","pyqbillid（string，40，选填，新开发银行端必须提供）","bankno（string，40，必填，银行进账流水号，不能重复）","paydate（string，8，必填，yyyyMMdd）","payamount（金额分，必填，实际缴费金额）","opername（string，40，选填，银行操作员）","billamount（金额分，必填，查询时返回的应缴欠费金额）","extend（json串，选填）"],"outputs":["code、msg","data数组：bankentityno、accno、name、address、pychargeid（平台销账流水号）、bankno、paydate、payamount、extend"],"dataItems":["入参：bankentityno string(10)必填、accno string(20)条件必填、pyqbillid string(40)选填、bankno string(40)必填唯一、paydate string(8)必填、payamount 金额分必填、opername string(40)选填、billamount 金额分必填、extend json选填","出参data：bankentityno、accno、name、address、pychargeid、bankno、paydate、payamount、extend","平台侧：渠道销账流水表（pychargeid、bankno、bankentityno、accno、pyqbillid、payamount、paydate、opername、销账时间、状态）"],"acceptance":["同一bankno重复调用不产生重复销账且返回一致结果（幂等）","带pyqbillid的销账在跨天滞纳金变化场景下仍按查询快照成功销账","payamount与billamount不一致时销账被拒绝","销账成功后柜台/线上查询该户欠费同步减少"],"notes":"SRS该节标题下『单个A号码新增』为通信行业文档复制残留；5.2导言提到『销账冲红』但未定义冲正接口的地址与参数，属接口需求缺失；快照有效期（当日有效/跨天失效）未明确，需联调约定。"},{"id":"FR-8.3","name":"对账","srsRef":"5.2.3","priority":1,"srsDesc":"银行日终对账文件通知接口。请求地址：http(s)://.../server/dpwater.bankpay.checknotify。（SRS该节首行『呼入管理信息查询接口』系残留。）","refinedDesc":"银行日终生成代收对账文件并上传至约定目录后，调用本接口通知平台取文件对账。入参：bankentityno（银行实体编号）、filedate（对账文件日期yyyyMMdd）、filepath（对账文件存放相对路径，如/upload/20160829）、filetype（文件类型，DSDZ=代收对账文本）、extend（预留扩展）。平台收到通知后：校验渠道合法与文件可读，异步解析对账文件，按bankno将文件内每笔代收记录与平台渠道销账流水（FR-8.2）逐笔勾对，产出对账结果：平账、长款（银行有平台无）、短款（平台有银行无）、金额不符四类，差错记录进入差错处理队列（补账/冲正/人工处理），生成日对账报告供财务复核，对账平衡后确认资金划转入账。","actors":["银行/第三方渠道系统","营销平台接口服务","财务人员"],"preconditions":["当日代收交易已全部完成（日切后）","银行已按约定格式生成对账文件并上传至filepath","平台对文件目录有读取权限"],"mainFlow":["1. 银行日终生成DSDZ代收对账文本文件并上传至约定相对路径","2. 银行POST调用dpwater.bankpay.checknotify，传入bankentityno、filedate、filepath、filetype","3. 平台校验渠道合法性与参数完整性，返回code=1受理成功","4. 平台异步读取并解析对账文件，逐行取出bankno、金额、日期","5. 平台按bankno与当日渠道销账流水逐笔勾对","6. 产出对账结果：平账笔数/金额、长款、短款、金额不符明细","7. 差错记录进入差错处理队列，通知财务与渠道运营处理（补账/冲正）","8. 生成日对账报告，财务确认后完成资金入账勾稽"],"altFlows":["3a. filepath文件不存在或不可读：返回失败，银行重新上传后再次通知","4a. 文件格式解析失败：对账中止，记录错误并通知双方核查文件格式","5a. 存在长款（银行收款平台无流水）：生成待补账差错，人工核实后补销账","5b. 存在短款（平台有销账银行文件无）：冻结该笔并发起与银行的差错核查","2a. 同一filedate重复通知：以最新文件为准重新对账，保留历史对账版本"],"inputs":["bankentityno（string，10，必填）","filedate（string，8，必填，yyyyMMdd）","filepath（string，128，必填，对账文件相对路径）","filetype（string，8，必填，DSDZ=代收对账文本）","extend（json串，选填，预留扩展）"],"outputs":["code、msg（通知受理结果）","data数组：bankentityno、filedate、filepath、filetype、extend","平台侧产物：日对账报告、差错明细队列"],"dataItems":["入参：bankentityno string(10)必填、filedate string(8)必填、filepath string(128)必填、filetype string(8)必填（DSDZ）、extend json选填","出参data：bankentityno、filedate、filepath、filetype、extend","平台侧：对账批次表（批次号、渠道、filedate、文件路径、总笔数、总金额、平账/长款/短款/不符笔数、状态）、对账差错明细表（批次号、bankno、差错类型、金额、处理状态、处理人）"],"acceptance":["对账文件总笔数=平账+长款+短款+金额不符笔数之和，账目闭合","文件不可读时返回失败且银行重传后可重新发起对账","差错记录均有处理状态跟踪直至闭环","同一filedate重复通知不产生重复入账"],"notes":"SRS该节首行『呼 ":"n2","label":""},{"from":"n2","to":"n3","label":""},{"from":"n3","to":"n4","label":""},{"from":"n4","to":"n5","label":""},{"from":"n5","to":"n6","label":""},{"from":"n6","to":"n7","label":"一致"},{"from":"n6","to":"n2","label":"不一致，须重新查询"},{"from":"n7","to":"n8","label":""},{"from":"n8","to":"n9","label":""},{"from":"n9","to":"n10","label":""},{"from":"n10","to":"n11","label":""}]}]},"quality":{"findings":[{"id":"Q-001","location":"3.1 供水营销管理系统简介 / 3.3 系统功能清单（对照3.2与第4章）","quote":"营销平台提供：档案管理、水表管理、抄表管理、营业收费、票据管理、帐务管理、掌上机抄表管理、银行划帐、系统报表、系统管理、外部接口。","category":"前后矛盾","severity":"高","problem":"3.1宣称11个模块，3.2只描述了4个（档案/抄表/收费/表务），3.3功能清单与第4章仅覆盖7个一级模块24个二级功能（档案基础数据、抄表基础模块、收费数据基础、柜台收费业务、票据基础信息、水表基础数据、抄表计划）。帐务管理、掌上机抄表管理、银行划帐、系统报表、系统管理5个模块在3.3和第4章均无任何需求展开——接近半个系统无法据此设计、开发和测试；其中银行划帐（托收/代扣）也不同于5.2的银行代收接口，无任何补位。需求范围前后不一致，开发、报价、验收范围无法确定。","suggestion":"统一三处口径并明确范围声明，如：「本期需求范围为7个一级模块24个二级功能及3个银行代收接口；帐务管理、银行划帐、系统报表、系统管理、掌上机抄表为后续阶段范围」，并同步修订3.1/3.2/3.3与第4章使之一致；若5个模块属本期范围，则须在3.3和第4章为帐务管理（日结/月结、财务对账、销账冲红）、掌上机抄表管理（任务下发、数据回传、异常上报）、银行划帐（托收文件生成/回盘处理）、系统报表（报表清单及口径）、系统管理（用户/角色/日志/参数）各补充二级功能分解和场景描述表。","status":"待确认"},{"id":"Q-002","location":"3.2 系统总体功能-档案管理（对照4.1 档案基础数据）","quote":"管理客户立户档案，根据报装信息建立新客户档案，同时管理客户基本信息变更，如销户、过户、该表、缴费方式变更、银行信息变更等","category":"信息缺失","severity":"高","problem":"3.2档案管理描述了立户、销户、过户、缴费方式变更、银行信息变更及档案变更跟踪等核心业务，但第4章对应的4.1档案基础数据仅有用户状态/用户分类/抄表周期/行业分类/优惠类型5个码表功能，立户/销户/过户等业务功能全部缺失详述，也无变更审批流程、欠费用户能否销户等业务规则。","suggestion":"在第4章新增「档案管理」功能组，为立户（报装信息来源与必录字段）、销户（欠费校验规则）、过户、换表、缴费方式变更、档案变更历史查询分别编写场景描述表，并附业务流程图说明审批环节与状态流转。","status":"待确认"},{"id":"Q-003","location":"3.2 系统总体功能-抄表管理（对照4.7 抄表计划）","quote":"自动生成客户档期水费，同时提供水量异常减免、污水缓缴等功能","category":"信息缺失","severity":"高","problem":"3.2抄表管理承诺的水费自动生成、水量异常报表监控、水量异常减免、污水缓缴，在第4章4.7抄表计划（仅手工录入/表格录入/数据导入3项）中均无对应功能；同样，3.2收费管理提到的银行托收、代扣、增值税发票打印在第4章也无落点。算费规则（阶梯水价、污水费、违约金）作为营销系统核心完全未描述。","suggestion":"补充「水费计算」场景表（计费公式、阶梯水价与优惠类型如何参与计算、污水费/垃圾费附加规则）、「水量异常审核与减免」场景表（异常判定阈值、减免审批权限）、「污水缓缴」场景表；或在3.2中删除本期不实现的承诺性描述。","status":"待确认"},{"id":"Q-004","location":"3.2 系统总体功能-表务管理（对照4.6 水表基础数据）","quote":"管理水表日常操作如入库检验、表身号输录入库、出库、周期更换等信息记录","category":"信息缺失","severity":"高","problem":"3.2表务管理承诺水表全生命周期管理（入库检验、出库、周期更换、拆表、换表、故障、检定、周检及全程状态跟踪），但第4章唯一相关的4.6水表基础数据只有类型/口径/参数/厂家4个静态码表功能，全部生命周期业务功能均无详述。开发无法实现「从入库到处理及周期更换的全程状态信息及跟踪」，测试也无依据。","suggestion":"在第4章新增「4.x 表务管理」小节，按场景表逐一描述：水表入库（含检验结果录入）、出库领用、装表/拆表/换表（含新旧表止度衔接规则）、水表检定与周检计划、水表状态机（在库-在装-待检-报废等状态及流转条件）。","status":"待确认"},{"id":"Q-005","location":"4.2.3 表册顺序调整、4.7.2 表格录入、4.7.3 抄表数据导入-输入/输出","quote":"无","category":"信息缺失","severity":"高","problem":"这三个功能的输入、输出栏均填「无」，与功能本身明显不符：表格录入的输入必然是Excel抄表文件，抄表数据导入的输入是抄表机数据文件，顺序调整的输入是户号与目标顺序号；导入类功能也必然有成功/失败结果输出。连文件格式（Excel模板列定义、抄表机数据文件格式）、字段校验规则、重复导入与异常数据（读数倒走、跳变超阈值）的处理、导入结果反馈都没有定义，按现文开发无法确定文件格式、字段和校验规则，测试无预期结果可比对，完全无从下手。","suggestion":"按实际补全：4.7.2输入=「按模板格式的Excel抄表文件（户号、本期行至、抄表日期等列）」、4.7.3注明抄表机数据文件格式，两者均补充校验规则（户号存在性、本期行至≥上期、水量超阈值预警）、异常行处理方式（整批回滚或跳过并输出错误清单），输出=「导入成功N条/失败M条及失败原因清单」；4.2.3输入=「表册号、户号、目标顺序号」、输出=「调整后的表册抄表顺序列表」。","status":"待确认"},{"id":"Q-006","location":"4.4.1 单户销账-输出","quote":"展示用户欠费信息列表","category":"信息缺失","severity":"高","problem":"功能描述是「对选中的账单进行销账」，但输出只写了查询阶段的欠费列表，销账动作本身的结果（账单状态变为已缴、生成收费流水、打印票据、找零）完全未描述；部分缴费是否允许、滞纳金如何一并收取、重复销账如何拦截等业务规则和异常流缺失。全文24个场景表均无验收标准，补充说明几乎全为「无」，测试用例无法设计。","suggestion":"重写输出为「销账成功后账单状态更新为已缴、生成收费流水号并支持打印票据；失败时提示原因」，补充业务规则（是否允许部分缴费、滞纳金处理、必须按账期顺序销账等）和异常分支；为每个场景表增加「验收标准」行，给出可度量的预期结果。","status":"待确认"},{"id":"Q-007","location":"4.4.3 预收费-功能描述","quote":"功能等同与单户销账，用户预存缴费，取款操作","category":"歧义","severity":"高","problem":"「功能等同与单户销账」（应为「等同于」）是模糊等价：预收费是预存款业务，与销账（核销欠费）业务规则本质不同，「等同」的范围（仅查询界面等同？还是收款流程等同？）无法确定；预存余额如何抵扣水费、「取款操作」的条件、审批和票据处理均未描述，核心业务规则完全缺失且涉及资金安全。","suggestion":"删除「功能等同与单户销账」，独立描述预收费规则：预存金额录入方式、预存余额抵扣水费的时点与顺序（如出账时自动抵扣）、取款（退预存）的前提条件与审批流程、预收与退款的票据处理；如仅界面交互类似单户销账，明确写「查询界面交互同4.4.1」。","status":"待确认"},{"id":"Q-008","location":"4.6.2 水表口径-功能描述（全文缺数据需求/数据字典）","quote":"可查询、编辑各个水表口径下的最大读数、换表读数、换表周期等信息","category":"信息缺失","severity":"高","problem":"全文没有数据需求或数据字典章节：用户档案、表册、账单、水表等核心实体的字段构成、类型、长度、必填性、取值范围均未定义，多处仅以「等信息」带过（如本条的「最大读数、换表读数、换表周期等」）。户号编码规则、金额精度、数据保存年限也未说明。数据库设计与界面字段只能靠开发自行猜测，验收时无对照依据。","suggestion":"增加「数据需求」章节：给出核心实体（客户档案、表册、水表、抄表记录、账单、缴费流水、票据）的数据字典表（字段名、类型、长度、必填、取值/编码规则），并明确户号编码规则、金额单位与精度、历史数据保存年限。","status":"待确认"},{"id":"Q-009","location":"4.6.4 水表厂家-输出","quote":"号码池内显示关联的隐号网关","category":"模板残留","severity":"高","problem":"「号码池」「隐号网关」是通信/隐私号码类项目的术语，与水表厂家管理毫无关系，系模板残留；真正的输出内容「展示系统所有的水表水表厂家」被错放在补充说明栏且有「水表水表」重复错字。输出定义错误将直接导致开发实现和测试预期错误。","suggestion":"输出改为「展示系统当前的水表厂家列表（含启用/禁用状态）」；删除「号码池内显示关联的隐号网关」；补充说明栏恢复为「无」或填写真实约束，并修正「水表水表」为「水表」。","status":"待确认"},{"id":"Q-010","location":"5.2 对接第三方系统接口","quote":"包括用户信息查询、、用户销账、销账冲红、对账等功能","category":"信息缺失","severity":"高","problem":"总述声明接口包含「销账冲红」，但5.2.1~5.2.3只定义了查询、销账、对账三个接口，冲红（冲正/退款）接口完全没有定义；银行代收场景中冲正是必备能力，缺失将导致联调时无法处理错缴退款。另外「查询、、用户销账」存在连续顿号笔误，「等功能」的「等」也使接口范围不封闭。","suggestion":"补充「销账冲红」接口定义：请求地址、入参（bankentityno、原缴费流水号bankno、冲正金额、冲正日期等）、出参、幂等性与重复冲正的处理规则；删除多余顿号；将「等功能」改为封闭清单「共4个接口」。","status":"待确认"},{"id":"Q-011","location":"5.2.2 缴费单销账-入参","quote":"银行进账流水号，作为缴费、冲正、对账的凭证，不能重复","category":"信息缺失","severity":"高","problem":"接口仅约定bankno不能重复，但未定义银行重复提交同一bankno时的返回语义（幂等地返回原销账结果，还是返回特定错误码）；三个接口的出参均只给出code=\"1\"、msg=\"ok\"的成功示例，无错误码表（户号不存在、金额不符、重复销账、系统繁忙等）；也未约定超时后银行端的重试/冲正策略与接口鉴权签名机制。银行端程序无法进行异常分支开发和联调。","suggestion":"在5.1或5.2增加接口公共约定小节：完整错误码表（code取值及含义）、幂等约定（相同bankno重复请求返回首次销账结果及原pychargeid）、超时时间与超时后的处理（先查询后重发或发起冲正）、签名算法与密钥分配、报文加密要求。","status":"待确认"},{"id":"Q-012","location":"5.2.3 对账","quote":"呼入管理信息查询接口","category":"模板残留","severity":"高","problem":"「呼入管理」为呼叫中心系统术语残留，与银行代收对账毫无关系；该行处于5.2.3标题下的接口说明位置，与请求地址bankpay.checknotify、入参「DSDZ-代收对账文本」所描述的对账文件通知功能自相矛盾，会误导对接开发。","suggestion":"删除「呼入管理信息查询接口」，改为「银行代收对账文件通知接口：银行生成日对账文件后，调用本接口通知平台文件日期、存放路径及类型」。","status":"待确认"},{"id":"Q-013","location":"5.2.3 对账-入参","quote":"DSDZ-代收对账文本","category":"信息缺失","severity":"高","problem":"对账小节仅定义了「对账文件到达通知」接口，对账文件本身的记录格式（字段顺序、分隔符、金额单位、汇总行）完全未定义，文件通过什么通道存取（FTP/SFTP/共享目录）也未说明，对账不平（长款、短款、单边账）的处理流程和差错账调整机制缺失。双方无法据此开发对账程序。","suggestion":"补充对账文件格式规范：明细记录字段定义（bankno、accno、payamount、paydate等，含分隔符与编码）、文件末行汇总记录（总笔数、总金额）、文件命名规则、传输通道及鉴权方式，并补充对账差错处理流程（不平时的通知、人工调账与冲正联动）。","status":"待确认"},{"id":"Q-014","location":"6.2 响应时间（响应时间与吞吐量全部指标）","quote":"用户打开界面和提交事务的平均响应时间应低于 1.5 秒 …… 在网络正常传输情况下小于3秒；支持每秒处理的页面请求数：大于20000次 …… 每秒钟500个以上的并发请求","category":"前后矛盾","severity":"高","problem":"同一节内指标互相矛盾、量级失真且无测量口径：页面平均响应先要求低于1.5秒，后又写「在网络正常传输情况下小于3秒」；吞吐量给出三个互相矛盾的口径——(1)「每秒处理的页面请求数大于20000次」、(2)「60000个并发用户（每用户每10秒1个请求）」换算即6000请求/秒、(3)「每秒钟500个以上的并发请求」，最大与最小相差40倍，20000与6000也相差3.3倍；「60000个并发用户」远超一个供水集团营销系统的实际用户量级，疑似大型平台模板指标照搬。按500/秒与按20000/秒采购服务器，硬件投入相差一个数量级；各指标均未说明测试环境、数据量、统计口径（平均值/P95），性能测试无法设计压测方案、无法裁定通过与否。","suggestion":"由业务方按实际用户规模（在册用户数、缴费高峰时段）核定一组自洽指标并删除其余口径，例如：「页面打开与事务提交平均响应时间≤1.5s、P95≤3s；在线查询≤3s；高峰期支持并发在线用户X个、系统吞吐量≥Y请求/秒（按每用户每10秒1次请求换算）、成功率≥99%；测量条件：生产同配置压测环境、100万条记录基础数据、指定带宽」；删除20000次/秒、60000并发用户等无业务依据的指标或给出依据，X、Y只保留一组自洽数字。","status":"待确认"},{"id":"Q-015","location":"6.3.1 应用安全性要求、6.3.2.3 数据安全、6.3.2.4 数据采集安全保障","quote":"双向转诊系统具有访问控制功能 …… 医疗信息系统的数据包括患者信息、诊断信息、医疗影像、鉴别信息、重要业务数据、系统管理数据等等","category":"模板残留","severity":"高","problem":"安全性章节整体从医疗行业项目模板复制：6.3.1把访问控制、备份、漏洞修复等安全要求的责任主体写成「双向转诊系统」，6.3.2.3把保护对象写成「患者信息、诊断信息、医疗影像」，6.3.2.4的b)款、c)款（两次）及6.3.2.4.1数据存储a)款共4处要求保护「医疗信息资源」。保护对象与责任主体全面错位，导致供水营销系统真正需要保护的数据资产（用户档案、户号、抄表数据、账单与缴费流水、银行卡代收信息等个人金融相关信息）在全文中没有任何一处被定义保护级别和安全措施，数据安全需求形同虚设，等保测评和安全设计无法对应到本系统，安全测试范围失效。","suggestion":"将「双向转诊系统」改为「供水营销管理系统」；6.3.2.3数据清单改写为「供水营销系统的数据包括用户档案信息、水表及抄表数据、账单与缴费流水、银行代收信息、鉴别信息、重要业务数据、系统管理数据等」；4处「医疗信息资源」统一改为「营销业务信息资源」，并对上述数据分类给出存储、传输、删除、备份的分级保护要求，逐条复核安全条款对本系统的适用性。","status":"待确认"},{"id":"Q-016","location":"6.3.1 应用安全性要求（全文缺用户角色与权限定义）","quote":"具有访问控制功能，包括用户登录访问控制、角色权限控制、目录级安全控制、文件属性安全控制等","category":"信息缺失","severity":"高","problem":"6.3.1要求角色权限控制，但全文未定义任何用户角色（如营业厅收费员、抄表员、表务管理员、稽核员、系统管理员）及角色-功能权限矩阵；第4章所有操作序列一律写「登录供水营销管理系统账户」，未区分操作者。销账、冲红、预收费取款等资金敏感操作缺少岗位分离约束，权限模型无法设计，权限测试无依据。","suggestion":"增加「用户角色与权限」小节：列出角色清单及职责，给出角色×二级功能的权限矩阵（查询/新增/修改/删除/审核），并对销账冲红、预收费取款等资金操作明确复核（经办-审核分离）要求；第4章各场景表的操作序列注明执行角色。","status":"待确认"},{"id":"Q-017","location":"6.3.2.4.1 数据存储-c)","quote":"采用对称加密密钥实现对用户的签名验证和存储请求加密、采用MD5算法实现对消息体的加密","category":"技术性错误","severity":"高","problem":"存在两处技术错误：MD5是摘要（哈希）算法而非加密算法，且已被证实存在碰撞攻击，不满足安全要求；数字签名验证依赖非对称密钥体系，用「对称加密密钥」做签名验证在密码学上不成立。照此实现会在涉及缴费资金的系统中留下安全缺陷，也无法通过等保测评。","suggestion":"改为：「采用HTTPS/TLS 1.2及以上实现端到端传输加密；消息完整性校验采用SHA-256及以上摘要算法；签名验证采用非对称算法（RSA2048或SM2）」；删除「MD5加密」「对称密钥签名验证」的表述。","status":"待确认"},{"id":"Q-018","location":"8 系统部署要求（对照6.3.2.4.1数据存储f款）","quote":"系统部署在AWS云上，在云端需要有两套环境，分别是生产环境（正式服务环境）和UAT环境（上线前验证环境）。","category":"前后矛盾","severity":"高","problem":"第8章要求部署在AWS（境外厂商公有云），而6.3.2.4.1 f)要求「存储产品应支持自主可控、安全可靠的要求,并通过中国信息安全测评中心EAL评测」，两者难以同时满足：AWS存储产品不属于自主可控范畴，也未按此路径通过中国信息安全测评中心测评。供水集团属公用事业，营销系统含大量居民个人信息和银行代收数据，选用境外云还涉及等保定级与数据合规问题。该矛盾属架构选型级，必须在开发前裁决。","suggestion":"二选一并全文对齐：(a)改为「系统部署在集团私有云或国内合规公有云（政务云/国有云）上」，保留自主可控与测评要求；或(b)如确需AWS（中国区），则修订6.3.2.4.1 f)款，改为「存储服务应满足等保三级及数据本地化存储要求」，并补充等保定级与个人信息保护合规说明。","status":"待确认"},{"id":"Q-019","location":"1. 引言（仅含1.1编写目的）","quote":"本文档为供水营销管理系统系统需求规格说明书，主要是为了使用户和软件开发者对微ME的需求有一个共同的理解","category":"信息缺失","severity":"中","problem":"引言仅有1.1编写目的一个小节，缺少标准SRS应有的「范围」（系统边界、本期建设内容与不做内容）、「定义/术语」、「参考资料」（合同、上位规划、引用标准清单）、「预期读者与阅读建议」。系统边界不清导致与3.1的11个模块、第4章仅7组功能之间的差距无从解释（无法判断是漏写还是本期不做）。","suggestion":"按GB/T 9385补齐引言结构：1.2范围（列明本期实施的模块清单及明确排除项）、1.3定义（术语与缩略语表）、1.4参考资料（合同/标准/上位文档编号）、1.5文档约定与读者对象。","status":"待确认"},{"id":"Q-020","location":"1.1 编写目的","quote":"主要是为了使用户和软件开发者对微ME的需求有一个共同的理解","category":"模板残留","severity":"中","problem":"「微ME」是其他项目名称的残留，与本系统无关；同句还有「供水营销管理系统系统需求规格说明书」的「系统」重复。编写目的是全文第一段，此处出现别的项目名，会让评审方对整份文档的复用来源和严肃性产生质疑。","suggestion":"改为「本文档为供水营销管理系统需求规格说明书，主要是为了使用户和软件开发者对供水营销管理系统的需求有一个共同的理解」；阅读对象建议补充「建设方业务人员、测试人员」。","status":"待确认"},{"id":"Q-021","location":"2.1 标准规范依据","quote":"国际标准：RDF（Resource Description Framework）、OWL、XML","category":"模板残留","severity":"中","problem":"标准依据表仅列了三项国际标准：RDF（资源描述框架）、OWL（Web本体语言）、XML（可扩展标记语言），全部是语义网/知识图谱领域标准（原文表格中跨行排版），与供水营销收费系统的业务和技术栈无对应关系，疑似其他项目模板残留；而本文档实际引用的标准（如第6/7章的GB/T 20988-2007）和真正适用的依据（等保、灾备、发票、水务行业标准）反而未列入，导致合规测试无据可依。","suggestion":"删除RDF/OWL/XML三项；替换为本项目真正适用的标准并标注标准号：GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》、GB/T 20988-2007《信息系统灾难恢复规范》、CJ/T 188《户用计量仪表数据传输技术条件》、增值税发票开具相关规定（财政部电子票据）、人行银行代收业务规范及水务行业营业收费规范等。","status":"待确认"},{"id":"Q-022","location":"3.2 系统总体功能","quote":"同时管理客户基本信息变更，如销户、过户、该表、缴费方式变更、银行信息变更等","category":"错别字笔误","severity":"中","problem":"「该表」应为「换表」，此处列举的是档案管理的变更业务类型清单，错字会直接进入功能设计和测试用例，导致「换表变更」业务项缺失或名称错误。同节抄表管理段还有「对水量异常的的抄表数据」（「的」重复）、「自动生成客户档期水费」（应为「当期水费」）两处笔误。","suggestion":"「该表」改为「换表」；「水量异常的的」删去一个「的」；「档期水费」改为「当期水费」。","status":"待确认"},{"id":"Q-023","location":"3.3 系统功能清单-手工抄表录入（全文缺术语表）","quote":"手工抄表时可以看到换表信息、总分表信息、备忘信息。这三项可能影响抄表、行至及实收水量等","category":"信息缺失","severity":"中","problem":"全文大量使用行业术语但无任何定义：「行至」（抄表止度）、「表册」、「销账」、「销账冲红」、「总分表」、「预收费」等首次出现即直接使用。「总分表信息如何影响实收水量」这类核心计算逻辑依赖术语理解，非水务背景的开发/测试人员会产生不同解读，直接导致水量计算实现偏差。","suggestion":"在引言增加术语定义表，至少定义：行至（水表本期抄见读数/止度）、表册（按抄表路线组织的用户分组单元）、销账（收费核销欠费账单）、销账冲红（对已销账交易的红字冲正）、总分表（总表与分表的对应关系及总表水量=总表行至差-各分表水量之和的分摊规则）、预收费。","status":"待确认"},{"id":"Q-024","location":"4. 系统功能描述（通篇）","quote":"场景功能描述：","category":"信息缺失","severity":"中","problem":"所有功能只用「场景功能描述」表+参考界面截图表达，全文没有一张业务流程图、用例图或状态图；抄表→算费→销账→开票→对账的端到端主业务流、总分表算量流程、预收费冲抵欠费流程等跨功能协作关系完全没有描述，开发只能孤立地实现单个界面，集成逻辑无依据。","suggestion":"在第3章或第4章各功能组前补充：系统用例图（角色-用例关系）、核心业务流程图（抄表到收费开票的端到端泳道图、银行代收对账流程图）、账单状态图（未缴-部分缴-已缴-冲红），并在场景表中引用对应流程节点。","status":"待确认"},{"id":"Q-025","location":"4.1.1~4.7.3 全部24个场景描述表（需求编号与优先级定义）","quote":"优先级","category":"信息缺失","severity":"中","problem":"全部24个需求条目仅靠章节号+中文名称标识，无唯一需求编号（如FR-DA-001），需求跟踪矩阵、变更管理、测试用例映射都无法建立；同时全部场景表均填写了优先级，取值只出现1、2、5三档，但全文没有任何地方定义优先级的取值范围、各档含义及其对实现/验收的约束（1是最高还是最低？5是否代表可裁剪？缺3/4档说明），开发无法据此排期，测试无法确定用例优先级和验收必要项。","suggestion":"为每条功能需求分配唯一编号（建议格式FR-模块缩写-三位序号）并在功能清单中建立编号索引；在3.3或文档约定小节增加优先级定义表，例如：「1=必须实现Must，本期验收必要条件；2=应实现Should，本期计划内可协商顺延；3~5=可实现Could，允许后续版本交付」，并复核各功能现有1/2/5取值。","status":"待确认"},{"id":"Q-026","location":"4.2.1 抄表员管理-功能描述","quote":"对抄表员进行查询、新增、删除、生成的操作。","category":"歧义","severity":"中","problem":"「生成」与查询、新增、删除并列，但对抄表员做「生成」操作含义不明：是由系统账号批量生成抄表员档案，还是生成抄表任务/工作量报表？不同理解对应完全不同的功能，且操作序列中只提到「录入修改」，未出现生成，开发和测试无法落地。","suggestion":"改为「对抄表员进行查询、新增、修改、删除操作」；若确有「生成」功能，需单独写明其触发条件、数据来源和生成结果（如「从员工档案批量生成抄表员账号」）。","status":"待确认"},{"id":"Q-027","location":"4.6.2 水表口径-操作序列","quote":"2、打开水表类型，新增修改水表类型","category":"前后矛盾","severity":"中","problem":"本节名称与功能描述均为「水表口径」（维护最大读数、换表读数、换表周期），但操作序列写的是「打开水表类型，新增修改水表类型」，系从4.6.1复制粘贴未改，操作对象与功能自相矛盾，测试用例无法编写。","suggestion":"改为「2、打开水表口径，新增修改水表口径及其最大读数、换表读数、换表周期等信息」，并排查4.6.3、4.6.4等相邻小节的同类复制痕迹。","status":"待确认"},{"id":"Q-028","location":"4.7.1 手工抄表录入-功能描述（对照3.3功能清单）","quote":"手工抄表输入，户号、本期行至抄表。","category":"前后矛盾","severity":"中","problem":"3.3功能清单对该功能的描述明显更丰富：「手工抄表时可以看到换表信息、总分表信息、备忘信息。这三项可能影响抄表、行至及实收水量等。抄完表时下面会显示账单信息。」而第4章详述反而退化成一句话，换表信息、总分表信息、备忘信息、账单展示四项内容全部消失。清单与详述互相矛盾，开发无法确定这四项是否属于本期范围，估算和测试用例都会漏项。","suggestion":"将4.7.1功能描述改写为与清单一致：「手工录入抄表数据（户号、本期行至）；录入界面同时展示换表信息、总分表信息、备忘信息，三项影响水量计算；抄表完成后展示本期账单信息」；输出栏相应补充「本期水量、账单信息」。","status":"待确认"},{"id":"Q-029","location":"5.2.2 缴费单销账","quote":"单个A号码新增","category":"模板残留","severity":"中","problem":"「A号码」为通信系统（主叫号码）术语，「单个A号码新增」整行是异系统模板残留，紧贴在「缴费单销账」标题之下充当接口说明，会使银行对接开发人员对接口用途产生误解。","suggestion":"删除「单个A号码新增」，改为接口用途说明，如「银行收款成功后调用本接口，对指定户号/欠费流水的缴费单进行销账」。","status":"待确认"},{"id":"Q-030","location":"6.5 伸缩性","quote":"日后若信息量较大，则系统可相应增加服务器实现扩展。","category":"模糊不可验证","severity":"中","problem":"「信息量较大」没有量化阈值，「相应增加服务器实现扩展」没有扩展目标和验证方法，无法设计伸缩性测试用例，也无法在验收时判断该需求是否满足。","suggestion":"量化触发条件与扩展目标，如：「当单表数据量超过X万条或日均交易超过Y笔、应用服务器CPU峰值利用率连续3日超70%时，可通过增加应用节点水平扩展；扩展1倍节点后系统吞吐量提升不低于80%，扩展过程不中断服务」。","status":"待确认"},{"id":"Q-031","location":"6.6 可用性（兼6.1系统性能）","quote":"可用性指系统提供服务必须一直处于可用状态，对于用户的操作请求总是能够在有限的时间内返回结果","category":"模糊不可验证","severity":"中","problem":"「有限的时间」无量化上限，「一直处于可用状态」「总是」无法通过有限测试验证；本节通篇没有年度可用率指标（如≥99.9%）和故障切换时间要求，也无RTO/RPO（尽管总体非功能引用了GB/T 20988灾备规范，却未定级），后半段还是缓存/主备的实现讨论而非需求，可用性需求整体不可测。同时6.1罗列的质量属性中没有可维护性，全文亦无可维护性量化要求（如MTTR、问题响应时限），运维SLA无法约定。","suggestion":"改写为可测指标：「系统年可用率≥99.9%（全年累计非计划停机≤8.8小时）；任何请求30秒内返回结果或明确错误提示；主节点故障时备节点接管时间≤5分钟，切换期间已提交的缴费数据不丢失；RTO≤4小时/RPO≤24小时（与日备份策略一致）；计划内维护窗口另行约定」，实现方案性文字移入设计文档；新增可维护性小节：一般缺陷修复≤3个工作日、紧急缺陷MTTR≤4小时、提供运维手册与日志规范。","status":"待确认"},{"id":"Q-032","location":"6.7 易用性","quote":"要与同一界面上的其他按钮易于区分，能望文知意最好；按钮名称应该易懂，用词准确，屏弃摸棱两可的字眼","category":"模糊不可验证","severity":"中","problem":"「能望文知意最好」「易懂」「用词准确」均为主观描述且「最好」属非强制期望词，无法编写测试用例判定通过与否；细则中「选项数较少」「界面空间较小」「选择几率的高底」同样无判断标准；条款间还有歧义（l条「选项数相同时用选项框」语义不通）。且「屏弃」应为「摒弃」、「摸棱两可」应为「模棱两可」、「高底」应为「高低」——在要求「用词准确」的条款中连续出现错别字，自相讽刺，影响文档专业性。","suggestion":"改为可检查条款：「按钮名称使用《业务术语表》标准词汇，同一界面按钮名称不重复；组织不少于5名典型营业人员做可用性测试，不查阅帮助完成核心任务的成功率≥90%」；为「较少/较小」给出数值界限（如选项≤4个用选项框，>4个用下拉框）；修正「屏弃」「摸棱」「高底」错别字并复核l条语义。","status":"待确认"},{"id":"Q-033","location":"6.9 设计约束-d)","quote":"系统间调用最好是只读，系统间的修改用事件或者消息来实现比较靠谱。","category":"模糊不可验证","severity":"中","problem":"「最好」「比较靠谱」是口语化、非强制表述，作为设计约束无法判定遵守与否——评审和验收时无法认定「未用事件实现修改」算不算违反约束；且本条与i)「系统之间交互，使用的是只读API……写部分采用事件驱动」内容重复，两条口径还不完全一致（「最好只读」与「使用的是只读API」一为建议一为断言）。","suggestion":"合并d)与i)并改为强制条款：「系统间交互必须通过只读API进行；跨系统数据修改必须经事件/消息机制异步实现，禁止直接写入其他系统数据库」；全文删除「最好」「比较靠谱」等口语化措辞（同节a)的「CURD」应更正为「CRUD」）。","status":"待确认"},{"id":"Q-034","location":"7.1 性能及安全要求","quote":"建立、维护云计算平台的应急响应计划并有效实施，以确保在紧急情况下重要信息资源的可用性和操作的可持续性。","category":"模板残留","severity":"中","problem":"第7章7.1整节共6段内容（灾备规范GB/T 20988-2007、应急响应计划、事件处理计划、断点续传、RAID双机备份、30天日备份）与第6章开头的总体非功能需求逐字重复，未提供任何新信息；标题称「性能及安全要求」但内容只有灾备/备份条款、无任何性能要求，题文不符。重复条款日后修改极易只改一处造成前后不一致。","suggestion":"删除7.1重复内容，改为「性能及安全要求详见第6章」；若第7章再无其他内容，建议整章删除并调整章节编号。","status":"待确认"},{"id":"Q-035","location":"3.1 供水营销管理系统简介（全文用字）","quote":"票据管理、帐务管理、掌上机抄表管理、银行划帐","category":"术语不一致","severity":"低","problem":"「帐/账」混用：3.1用「帐务管理」「银行划帐」，而3.3、4.4等处用「销账」「账单」。按现行用字规范，财务义项应统一用「账」。混用会导致系统菜单、报表表头、检索关键字不一致（搜「账务」检索不到「帐务」）。","suggestion":"全文统一为「账」：「帐务管理」改为「账务管理」，「银行划帐」改为「银行划账」，并在文档校对项中增加「帐→账」全局替换检查。","status":"待确认"},{"id":"Q-036","location":"4.1.4 行业分类-操作序列","quote":"点击新增所需的行类大小分类","category":"错别字笔误","severity":"低","problem":"「行类」应为「行业」，「大小分类」表述含混（应指行业大类/小类两级），操作步骤描述不通顺，测试人员无法据此确认是否需支持两级分类结构。","suggestion":"改为「点击新增所需的行业大类、小类」，并在功能描述中明确行业分类是否为大类/小类两级结构。","status":"待确认"},{"id":"Q-037","location":"4.2.1 抄表员管理-输出","quote":"展现当面系统的抄表员工列表信息","category":"错别字笔误","severity":"低","problem":"「当面」应为「当前」；「抄表员工」与本节及全文使用的「抄表员」称谓不一致，输出定义是测试断言依据，措辞应准确统一。","suggestion":"改为「展现当前系统的抄表员列表信息」。","status":"待确认"},{"id":"Q-038","location":"4.3.3 Atm收费机","quote":"Atm收费机","category":"术语不一致","severity":"低","problem":"ATM为固定缩略语应全大写，「Atm」大小写不规范，且该写法在目录4.3.3、3.3功能清单、4.3.3正文标题及表格中多处出现，属全局性术语不规范。","suggestion":"全文统一改为「ATM收费机」（或统一改用「自助缴费机」并与正文「线下自助缴费机」一致）。","status":"待确认"},{"id":"Q-039","location":"4.3.4 公众缴费平台（对照3.3清单及目录）","quote":"2、打开pps公众缴费平台配置，修改对应的缴费配置。","category":"术语不一致","severity":"低","problem":"同一功能出现三个名称：3.3清单叫「公众缴费平台配置」，目录和4.3.4标题叫「公众缴费平台」，操作序列又写「pps公众缴费平台配置」，其中缩写「pps」全文无定义。功能命名不一致会导致需求跟踪矩阵、菜单命名、测试用例引用三方对不齐。","suggestion":"三处统一命名为「公众缴费平台配置」（目录、3.3清单、4.3.4标题、操作序列）；「pps」或删除、或在术语表中给出定义（如PPS：Public Payment Service，公众缴费平台）。","status":"待确认"},{"id":"Q-040","location":"4.7.3 抄表数据导入-操作序列","quote":"2、打开远传数据导入进行表格数据导入","category":"术语不一致","severity":"低","problem":"一个功能三个口径：功能名叫「抄表数据导入」，功能描述写「抄表机器抄表数据导入系统」，操作序列打开的菜单却叫「远传数据导入」、执行的动作又是「表格数据导入」——而表格导入属于4.7.2「表格录入」的职责。数据来源（抄表机/远传表/Excel表格）到底是哪种、与4.7.2边界如何划分，无法确定。","suggestion":"改为「2、打开抄表数据导入，导入抄表机采集的抄表数据」；如系统同时支持抄表机与远传表两种来源，在功能描述中明确列出并与4.7.2「表格录入（Excel导入）」划清边界。","status":"待确认"},{"id":"Q-041","location":"5.2.2 缴费单销账-入参pyqbillid","quote":"可以解决跨天滞纳金变化销账不成功、用户增加新欠费时销账不成功都棘手问题","category":"错别字笔误","severity":"低","problem":"「都棘手问题」应为「等棘手问题」，接口字段描述是银行方开发的直接输入，病句影响外部单位阅读理解。","suggestion":"改为「……用户增加新欠费时销账不成功等棘手问题」。","status":"待确认"}],"stats":{"total":41,"bySeverity":{"高":18,"中":16,"低":7},"byCategory":{"前后矛盾":5,"信息缺失":14,"歧义":2,"模板残留":7,"技术性错误":1,"错别字笔误":4,"模糊不可验证":4,"术语不一致":4}},"summary":"该SRS最严重的系统性问题是多系统模板拼接残留：编写目的出现「微ME」项目名，标准依据列的是语义网RDF/OWL/XML，安全性章节整体照搬医疗行业模板（「双向转诊系统」「患者信息/医疗影像」），接口章节夹带通信与呼叫中心术语（「单个A号码新增」「号码池/隐号网关」「呼入管理」），暴露出文档由多份异源模板拼接且未经通读校对。其次是关键指标自相矛盾：6.2性能指标三套吞吐量口径相差40倍、响应时间1.5秒与3秒并存，第8章AWS部署与6.3自主可控测评要求直接冲突，均属开发前必须裁决的架构级问题。第三是需求覆盖严重不完整：3.1宣称的11个模块仅7个在第4章展开，帐务管理、银行划帐、系统报表、系统管理、掌上机抄表近半个系统无任何需求描述，算费规则、角色权限矩阵、数据字典、业务流程图、接口错误码与冲红接口全部缺失。终审共确认41项问题（高18、中16、低7），其中信息缺失14项、模板残留7项居前两位。返工建议：先由业务方裁决范围口径与部署选型两项架构级矛盾，再集中清理全部模板残留与指标矛盾，补齐范围声明、术语表、需求编号、数据字典与角色权限等结构性缺失。评审结论：有条件通过——须完成全部18项高严重度问题整改并复审确认后，方可进入设计阶段；中低严重度问题应在下一版文档中一并修订。","checkMethod":"本次检查采用四视角独立检查后合并仲裁的方法：先由四个独立视角对SRS全文逐节检查——(1)歧义与模糊性视角（不可验证措辞、多义表述）、(2)一致性视角（章节间口径矛盾、清单与详述不符、指标冲突）、(3)完整性视角（模块/功能/接口/数据/角色/验收标准的覆盖缺口）、(4)正确性与残留视角（异系统模板残留、技术性错误、错别字）；随后将四路发现合并去重（同一处问题被不同视角重复表述的合并，问题说明取并集精华）；最后逐条回到SRS原文定位原句仲裁核验，剔除误报、修正定位与引文，按严重度（高→中→低）与章节序排序并统一编号（Q-001起），每条标注状态「待确认」供评审会逐项裁决。"}};

var LS_KEY = 'shuiwu_report_v1';
var C = {
  ok:'#0ca30c', warn:'#fab219', over:'#ec835a', crit:'#d03b3b', na:'#898781',
  cat:['#2a78d6','#1baf7a','#eda100','#008300','#4a3aa7','#e34948'],
  p1:'#2a78d6', p1l:'#9ec5f4', p2:'#1baf7a', p2l:'#9adfc6',
  grid:'#e1e0d9', axis:'#898781', ink:'#0b0b0b', ink2:'#52514e', surface:'#fcfcfb'
};
var DEFECT_W = { fatal:8, severe:4, normal:1, minor:0.5 }; // 由原表加权值反推

/* ---------------- utils ---------------- */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function sum(arr, key){ var t=0; arr.forEach(function(r){ var v = key? r[key] : r; if (v!=null && !isNaN(v)) t += Number(v); }); return t; }
function fmtN(x, d){
  if (x==null || isNaN(x)) return '—';
  if (d==null) d = 1;
  return Number(x).toLocaleString('zh-CN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtInt(x){ if (x==null||isNaN(x)) return '—'; return Number(x).toLocaleString('zh-CN',{maximumFractionDigits:0}); }
function fmtPct(x, d){
  if (x==null || isNaN(x)) return '—';
  if (d==null) d = 1;
  var v = x*100;
  return (v>0?'+':'') + v.toFixed(d) + '%';
}
function fmtPctAbs(x, d){ if (x==null||isNaN(x)) return '—'; return (x*100).toFixed(d==null?1:d) + '%'; }
function fmtWan(v){ if (v==null||isNaN(v)) return '—'; return (v/10000).toFixed(1) + '万'; }
function roundForEdit(v){
  if (v==null || isNaN(v)) return '';
  var n = Number(v);
  if (Number.isInteger(n)) return String(n);
  return String(Math.round(n*100)/100);
}
function getPath(obj, path){
  var parts = path.split('.'), cur = obj;
  for (var i=0;i<parts.length;i++){ if (cur==null) return undefined; cur = cur[parts[i]]; }
  return cur;
}
function setPath(obj, path, val){
  var parts = path.split('.'), cur = obj;
  for (var i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = val;
}
function h(tag, attrs){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k==='class') e.className = attrs[k];
    else if (k==='html') e.innerHTML = attrs[k];
    else if (k==='text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  for (var i=2;i<arguments.length;i++){
    var c = arguments[i];
    if (c==null) continue;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}
var SVG_NS = 'http://www.w3.org/2000/svg';
function svgE(tag, attrs){
  var e = document.createElementNS(SVG_NS, tag);
  if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  return e;
}
function download(filename, content, mime){
  var blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csvEsc(v){
  if (v==null) return '';
  var s = String(v);
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function toCSV(rows){ return '﻿' + rows.map(function(r){ return r.map(csvEsc).join(','); }).join('\r\n'); }

/* ---------------- toast & tooltip ---------------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 1800);
}
var tipEl = null;
function showTip(html, evt){
  if (!tipEl) tipEl = document.getElementById('tooltip');
  tipEl.innerHTML = html;
  tipEl.hidden = false;
  moveTip(evt);
}
function moveTip(evt){
  if (!tipEl || tipEl.hidden) return;
  var x = evt.clientX + 14, y = evt.clientY + 14;
  var r = tipEl.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 10;
  if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - 10;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}
function hideTip(){ if (!tipEl) tipEl = document.getElementById('tooltip'); tipEl.hidden = true; }
function bindTip(el, htmlFn){
  el.addEventListener('mouseenter', function(e){ showTip(htmlFn(), e); });
  el.addEventListener('mousemove', moveTip);
  el.addEventListener('mouseleave', hideTip);
}
