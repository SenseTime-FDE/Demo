<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能需求管理平台</title>
<style>
:root{
  --navy:#0f2a4a; --navy2:#173e6d; --teal:#0e7f78; --gold:#c9a227;
  --bg:#f2f4f8; --card:#ffffff; --line:#dfe4ec; --txt:#22314a; --sub:#65748c;
  --hi:#c62828; --mid:#e08a00; --lo:#5a7d2a; --ai:#7b5cd6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
.app{display:flex;min-height:calc(100vh - 52px)}
/* ---------- topbar ---------- */
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:20}
.topbar .brand{font-weight:bold;color:var(--navy);font-size:15px}
.topbar .env{font-size:11px;background:#fdf3e7;color:#8a5a00;border:1px solid #f0d9b5;border-radius:9px;padding:1px 8px}
.topbar .sp{flex:1}
.roleswitch{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
.roleswitch select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--navy);background:#fff}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
/* ---------- sidebar ---------- */
aside{width:230px;background:var(--navy);color:#dbe4f0;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:52px;height:calc(100vh - 52px)}
.logo{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo b{font-size:16px;color:#fff;display:block}
.logo span{font-size:11px;color:#8fa5c4}
nav{padding:10px 0;flex:1;overflow:auto}
.navsec{font-size:11px;color:#7d92b3;padding:10px 18px 4px;letter-spacing:1px}
.navitem{display:block;padding:8px 18px;cursor:pointer;color:#cfdaeb;border-left:3px solid transparent;font-size:13.5px}
.navitem:hover{background:rgba(255,255,255,.07)}
.navitem.on{background:rgba(255,255,255,.12);border-left-color:var(--gold);color:#fff}
.navitem small{display:block;font-size:11px;color:#8fa5c4}
.navitem .bdg{float:right;background:var(--hi);color:#fff;font-size:10.5px;border-radius:8px;padding:0 6px}
.sidefoot{padding:10px 18px;font-size:10.5px;color:#7d92b3;border-top:1px solid rgba(255,255,255,.12);line-height:1.6}
/* ---------- main ---------- */
main{flex:1;padding:22px 28px 60px;max-width:1180px}
h1.page{font-size:21px;color:var(--navy);margin-bottom:4px}
.crumb{color:var(--sub);font-size:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;font-size:13px;color:var(--sub)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;color:#fff;white-space:nowrap}
.p-hi{background:var(--hi)}.p-mid{background:var(--mid)}.p-lo{background:var(--lo)}
.p-type{background:#eef1f7;color:var(--navy);border:1px solid var(--line)}
.p-ai{background:#f1ecfd;color:var(--ai);border:1px solid #d9cdf5}
.p-gap{background:#fdecec;color:var(--hi);border:1px solid #f3c1c1}
.p-add{background:#e8f4ee;color:#1e6b46;border:1px solid #bfe0cd}
.p-wait{background:#fdf3e7;color:#8a5a00;border:1px solid #f0d9b5}
.p-ok{background:#e8f4ee;color:#1e6b46;border:1px solid #bfe0cd}
.scorewrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.scorebig{width:108px;height:108px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.scorebig b{font-size:32px}.scorebig span{font-size:11px;opacity:.85}
.dims{flex:1;min-width:260px}
.dim{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.dim label{width:70px;font-size:12.5px;color:var(--sub);text-align:right}
.bar{flex:1;height:12px;background:#e9edf4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.dim b{width:34px;font-size:12.5px}
.verdict{border-radius:8px;padding:11px 14px;font-size:13px;margin-top:14px;line-height:1.7}
.v-warn{background:#fdf3e7;border:1px solid #f0d9b5;color:#8a5a00}
.v-info{background:#eef4fe;border:1px solid #cfdef5;color:#1c4d8f}
table.iss{width:100%;border-collapse:collapse;font-size:12.8px}
table.iss th{background:#eef1f7;color:var(--navy);text-align:left;padding:8px 10px;border:1px solid var(--line);white-space:nowrap}
table.iss td{border:1px solid var(--line);padding:9px 10px;vertical-align:top;line-height:1.65}
table.iss tr:nth-child(even) td{background:#fafbfd}
.quote{background:#f6f7fa;border-left:3px solid #b9c4d6;padding:4px 8px;margin-top:5px;font-size:12px;color:#4a5a75;border-radius:0 4px 4px 0}
.fix{color:#1e6b46;margin-top:5px}
.ask{color:#8a5a00;margin-top:4px}
details.tr{margin:3px 0 3px 14px;border-left:1px dashed #ccd5e2;padding-left:10px}
details.tr>summary{cursor:pointer;padding:4px 6px;border-radius:6px;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.tr>summary::before{content:"▸";color:var(--sub);font-size:11px;transition:.15s}
details[open].tr>summary::before{transform:rotate(90deg)}
details.tr>summary:hover{background:#f0f3f8}
.leaf{margin:3px 0 3px 14px;border-left:1px dashed #ccd5e2;padding:4px 6px 4px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leaf::before{content:"·";color:var(--sub)}
.fp{font-size:11px;color:var(--sub);background:#eef1f7;border-radius:8px;padding:0 7px}
.nodenote{font-size:11.5px;color:var(--sub)}
.dcard{background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:8px 0 10px 24px;font-size:13px}
.dcard h4{font-size:13.5px;color:var(--navy);margin-bottom:8px}
.dcard dt{font-weight:bold;color:var(--navy2);margin-top:8px;font-size:12.5px}
.dcard dd{margin:3px 0 0 0;line-height:1.7;color:#33415e}
.dcard ol,.dcard ul{margin:4px 0 0 20px;line-height:1.75}
.gwt{background:#eef7f1;border:1px solid #cfe5d8;border-radius:6px;padding:8px 10px;margin-top:5px;font-size:12.5px;line-height:1.7}
.trace{font-size:11.5px;color:var(--sub);margin-top:8px}
.aibanner{background:linear-gradient(90deg,#f3eefe,#eef4fe);border:1px solid #ddd3f5;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#5b4a9e;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.robanner{background:#f4f6fa;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:12.5px;color:var(--sub);margin-bottom:14px}
.lanes{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.lanehead{background:var(--navy2);color:#fff;padding:8px 6px;text-align:center;font-size:13px}
.lanecell{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:54px;display:flex;align-items:center;justify-content:center;padding:7px 6px;position:relative}
.lanecell:nth-child(3n+1){border-left:none}
.fnode{background:#fff;border:1.5px solid var(--navy2);border-radius:8px;padding:7px 10px;font-size:12.3px;text-align:center;max-width:200px;line-height:1.5;box-shadow:0 1px 3px rgba(15,42,74,.12)}
.fnode.start{border-radius:20px;border-color:var(--teal);background:#eef7f5}
.fnode.gap{border-style:dashed;border-color:var(--hi);color:var(--hi);background:#fff8f8}
.fnode.aiadd{border-style:dashed;border-color:var(--ai);color:var(--ai);background:#faf8ff}
.fnode.dec{border-color:var(--gold);background:#fdf9ec}
.stepno{position:absolute;top:4px;left:8px;font-size:10px;color:#9aa8bf}
.arrowrow{grid-column:1/-1;text-align:center;color:var(--navy2);font-size:14px;line-height:1;padding:1px 0;background:#fbfcfe}
.flowlegend{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.8}
.proto{border:1px solid #c9d2e0;border-radius:10px;overflow:hidden;background:#fff;margin-top:10px}
.pbar{background:#e8ecf3;padding:7px 12px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #c9d2e0}
.pbar i{width:10px;height:10px;border-radius:50%;background:#c3cddd;display:inline-block}
.pbar span{font-size:11.5px;color:var(--sub);margin-left:8px}
.pnav{background:var(--navy);color:#fff;display:flex;gap:2px;padding:0 12px;align-items:center;flex-wrap:wrap}
.pnav b{padding:10px 8px;margin-right:10px;font-size:14px}
.pnav a{padding:10px 12px;font-size:13px;color:#cfdaeb;cursor:pointer}
.pnav a.on,.pnav a:hover{background:rgba(255,255,255,.15);color:#fff}
.pbody{padding:16px;background:#f6f8fb;min-height:300px}
.wire{background:repeating-linear-gradient(45deg,#e8ecf3,#e8ecf3 6px,#e2e7f0 6px,#e2e7f0 12px);border:1px dashed #b7c2d4;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#7d8aa3;font-size:12.5px}
.pgrid{display:grid;gap:12px}
.pcardx{background:#fff;border:1px solid #d7deea;border-radius:8px;padding:12px}
.pcardx h5{font-size:13px;color:var(--navy);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.plist li{list-style:none;padding:6px 2px;border-bottom:1px dashed #e3e8f0;font-size:12.5px;display:flex;justify-content:space-between;color:#33415e}
.plist li span{color:#9aa8bf;font-size:11.5px}
.pbtn{display:inline-block;background:var(--navy2);color:#fff;border-radius:5px;padding:6px 14px;font-size:12.5px;cursor:pointer;border:none}
.pbtn.ghost{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
.pbtn.warn{background:var(--hi)}
.pbtn.teal{background:var(--teal)}
.pbtn.gold{background:var(--gold)}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pinput{border:1px solid #c9d2e0;border-radius:5px;padding:6px 9px;font-size:12.5px;background:#fff;color:#33415e}
.ptable{width:100%;border-collapse:collapse;font-size:12.3px;margin-top:6px}
.ptable th{background:#eef1f7;padding:6px 8px;border:1px solid #dde3ed;text-align:left;font-weight:600;color:var(--navy)}
.ptable td{padding:6px 8px;border:1px solid #e6ebf3;color:#33415e}
.ptabs{display:flex;gap:0;border-bottom:2px solid #dde3ed;margin-bottom:10px}
.ptabs a{padding:8px 14px;font-size:12.8px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}
.ptabs a.on{color:var(--navy2);border-bottom-color:var(--navy2);font-weight:600}
.statuspill{padding:1px 8px;border-radius:9px;font-size:11px}
.st-on{background:#e8f4ee;color:#1e6b46}.st-off{background:#fdecec;color:var(--hi)}.st-wait{background:#fdf3e7;color:#8a5a00}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:80%;text-align:center}
.toast.show{opacity:1}
.ovcard{cursor:pointer;transition:.15s;position:relative}
.ovcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(15,42,74,.12)}
.ovscore{font-size:30px;font-weight:bold}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{font-size:24px;color:var(--navy);display:block}
.kpi span{font-size:12px;color:var(--sub)}
.pipeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.pstep{background:#eef1f7;border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:12.5px;color:var(--navy)}
.pstep b{display:block;font-size:12.5px}
.pstep small{color:var(--sub);font-size:11px}
.parrow{color:var(--sub)}
.mini{font-size:12px;color:var(--sub);line-height:1.8}
.footnote{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.8}
/* upload */
.drop{border:2px dashed #b7c2d4;border-radius:12px;background:#fbfcfe;padding:34px 20px;text-align:center;color:var(--sub);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--navy2);background:#f0f5fc;color:var(--navy2)}
.drop b{display:block;font-size:15px;color:var(--navy);margin-bottom:6px}
/* clar */
.clarcard{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:10px;background:#fff}
.clarcard .q{font-size:13.5px;color:var(--navy);line-height:1.6}
.clarcard .meta{font-size:11.5px;color:var(--sub);margin:5px 0}
.clarcard textarea{width:100%;border:1px solid #c9d2e0;border-radius:6px;padding:8px;font-size:12.5px;font-family:inherit;margin-top:6px;min-height:54px}
.answer{background:#eef7f1;border:1px solid #cfe5d8;border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:7px;line-height:1.6}
/* switch */
.sw{position:relative;width:36px;height:20px;display:inline-block;vertical-align:middle}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#c9d2e0;border-radius:10px;cursor:pointer;transition:.2s}
.sw i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i::after{left:18px}
.rolechip{font-size:11px;border-radius:8px;padding:1px 8px;background:#eef1f7;color:var(--navy);border:1px solid var(--line);margin-left:4px}
@media(max-width:900px){aside{display:none}.grid3,.grid2,.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">🏛 智能需求管理平台</span><span class="env">演示环境 · 数据为真实文档实跑结果</span>
  <span class="sp"></span>
  <div class="roleswitch">当前身份：
    <select id="rolesel" onchange="setRole(this.value)">

<div class="app">

</aside>
<main id="main"></main>
</div>

<script>
/*__DATA__*/

/* ================= 角色与状态 ================= */
const ROLES = {

let ROLE = "analyst";

    status: ANSWERS[id]?"已答复":"待答复", answer: ANSWERS[id]||"", replied: ANSWERS[id]?"07-09 14:20 杨丽":""});

/* 评审与确认任务 */
const REVIEWS = [

 {doc:"A",item:"原型与流程图业务确认",type:"biz",status:"已确认",note:"杨丽 07-09 15:02 确认"},

/* 审计日志 */
const AUDIT = [

 {t:"07-09 14:20",u:"杨丽（业务）",a:"答复澄清问题",o:"A-04 / A-05",r:"成功"},
 {t:"07-09 11:47",u:"王工（分析师）",a:"发送澄清单",o:"3 份文档 · 23 个澄清问题",r:"成功"},
 {t:"07-09 11:32",u:"王工（分析师）",a:"生成页面原型",o:"官网 / 水务 / 供热",r:"成功 · AI草稿"},
 {t:"07-09 11:15",u:"王工（分析师）",a:"生成业务流程图",o:"官网 / 水务 / 供热",r:"成功 · AI草稿"},
 {t:"07-09 10:58",u:"王工（分析师）",a:"执行功能分解（强制继续）",o:"供热 · 质量分46 低于阈值70",r:"已留痕 ⚠️",hl:1},
 {t:"07-09 10:55",u:"王工（分析师）",a:"执行功能分解（强制继续）",o:"水务 · 质量分52 低于阈值70",r:"已留痕 ⚠️",hl:1},
 {t:"07-09 10:52",u:"王工（分析师）",a:"执行功能分解（强制继续）",o:"官网 · 质量分58 低于阈值70",r:"已留痕 ⚠️",hl:1},

 {t:"07-09 10:02",u:"杨丽（业务）",a:"上传需求文档",o:"官网用户需求说明书V1.0.doc",r:"解析成功"},
 {t:"07-09 10:01",u:"王工（分析师）",a:"上传需求文档",o:"水务/供热 2 份文档",r:"解析成功"}

/* 系统管理数据 */
const USERS = [
 {n:"王工",dept:"科技开发部",role:"需求分析师",st:"启用"},
 {n:"杨丽",dept:"业务部门（综合部）",role:"业务提交人",st:"启用"},
 {n:"李处",dept:"科技部",role:"项目负责人/评审人",st:"启用"},
 {n:"admin",dept:"科技部",role:"系统管理员",st:"启用"}

 {id:"R-10",type:"不一致",rule:"功能模块总表与正文章节覆盖度比对，宣称模块无详细描述时告警",sev:"高",on:1}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function scoreColor(s){return s>=70?"var(--teal)":s>=55?"var(--mid)":"var(--hi)";}
function sevPill(s){return `<span class="pill p-${s=='高'?'hi':s=='中'?'mid':'lo'}">${s}</span>`;}
function counts(d){const c={高:0,中:0,低:0};d.issues.forEach(i=>c[i.sev]++);return c;}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2600);}
function can(p){ // 页面级权限
  const map={
   analyst:["ov","upload","doc","clar","review","dash"],
   business:["bov","upload","doc","clar","confirm"],
   pm:["ov","doc","review","dash"],
   admin:["users","rolescfg","rules","llm","audit"]
  };
  return map[ROLE].includes(p);
}

    h+=`<div class="navsec">系统管理</div>`

function setRole(r){
  ROLE=r; $("#rolesel").value=r;
  go(ROLES[r].home);
  toast("已切换身份："+ROLES[r].label+"（"+ROLES[r].dept+"）——菜单与操作权限已同步变化");

function go(pg){
  CURPAGE = pg.startsWith("doc")?pg:pg;
  const base = pg.startsWith("doc")?"doc":pg;
  if(!can(base)){ $("#main").innerHTML=`<div class="card"><h3>⛔ 无权限</h3><div class="mini">当前身份「${ROLES[ROLE].label}」无权访问该页面（PRD 第3章最小权限原则）。</div></div>`; renderNav(); return; }
  renderNav();
  if(pg=="ov") renderOverview();
  else if(pg=="bov") renderBov();
  else if(pg=="upload") renderUpload();
  else if(pg=="clar") renderClar();
  else if(pg=="confirm") renderConfirm();
  else if(pg=="review") renderReview();
  else if(pg=="dash") renderDash();
  else if(pg=="users") renderUsers();
  else if(pg=="rolescfg") renderPerms();
  else if(pg=="rules") renderRules();
  else if(pg=="llm") renderLlm();
  else if(pg=="audit") renderAudit();
  else if(pg.startsWith("doc")) renderDoc(pg.slice(3));
  window.scrollTo(0,0);
}

let UPLOADED=[];
function renderUpload(){
  let h=`<h1 class="page">上传与解析 <span class="rolechip">${ROLES[ROLE].label}</span></h1>
  <div class="crumb">支持 docx / doc / pdf / xlsx · 解析为章节结构并建立原文锚点（PRD F1-1）</div>

  </div>
  <div class="card"><h3>文档库（本项目）</h3>
  <table class="iss"><tr><th>文档</th><th>提交人</th><th>版本</th><th>解析</th><th>质检</th><th>分解</th><th>原型</th><th>基线</th><th>操作</th></tr>`;
  DOCS.forEach(d=>{
   h+=`<tr><td><b>${d.sys}</b><div class="mini">${d.name} · ${d.pages}页</div></td>
   <td>${d.id=='A'?'杨丽（业务）':'王工（代传）'}</td><td>V1.0</td>
   <td><span class="pill p-ok">完成</span></td>
   <td><span class="pill" style="background:${scoreColor(d.score)}">${d.score}分</span></td>
   <td><span class="pill p-ai">草稿</span></td><td><span class="pill p-ai">草稿</span></td>
   <td><span class="pill p-wait">未基线</span></td>
   <td><a style="color:var(--navy2);cursor:pointer" onclick="go('doc${d.id}')">进入</a></td></tr>`;
  });
  UPLOADED.forEach(f=>{
   h+=`<tr><td><b>${f.name}</b><div class="mini">新上传</div></td><td>${ROLES[ROLE].name}</td><td>V1.0</td>
   <td>${f.st>=1?'<span class="pill p-ok">完成</span>':'<span class="pill p-wait">解析中…</span>'}</td>
   <td>${f.st>=1?'<span class="pill p-wait">排队中</span>':'—'}</td><td>—</td><td>—</td><td>—</td>
   <td><span class="mini">待引擎处理</span></td></tr>`;
  });
  h+=`</table></div>`;
  $("#main").innerHTML=h;
  const dz=$("#drop");
  if(dz){
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");onPick(e.dataTransfer.files);});
  }
}
function onPick(files){
  if(!files||!files.length) return;
  Array.from(files).forEach(f=>{
    const rec={name:f.name,st:0};
    UPLOADED.push(rec);
    toast("「"+f.name+"」上传成功，开始解析（格式转换→章节结构→原文锚点）…");
    setTimeout(()=>{rec.st=1; if(CURPAGE=="upload")renderUpload(); toast("「"+f.name+"」解析完成，已进入质检队列（演示模式：请将文档交给分析引擎执行质检）");},1500);
  });
  renderUpload();
}

  let h=`<h1 class="page">${mine?"待我答复的澄清":"澄清管理"} <span class="rolechip">${ROLES[ROLE].label}</span></h1>

   <button class="pbtn ghost" onclick="toast('已导出澄清单 Excel（示意）')">导出澄清单</button>
  </div></div>`;
  ["A","B","C"].forEach(did=>{
    const d=DOCS.find(x=>x.id==did);
    const sub=list.filter(c=>c.doc==did);
    if(!sub.length) return;
    h+=`<div class="card"><h3>${d.sys}（${sub.filter(c=>c.status=='已答复').length}/${sub.length} 已答复）</h3>`;
    sub.forEach(c=>{
      h+=`<div class="clarcard">
      <div class="q">❓ ${c.q}</div>

   <span class="tab ${tab=='tree'?'on':''}" onclick="renderDoc('${id}tree')">② 功能分解</span>
   <span class="tab ${tab=='flow'?'on':''}" onclick="renderDoc('${id}flow')">③ 业务流程图</span>
   <span class="tab ${tab=='proto'?'on':''}" onclick="renderDoc('${id}proto')">④ 页面原型</span>
  </div>`;
  if(tab=='qa'){
    h+=`<div class="card"><div class="scorewrap">
     <div class="scorebig" style="background:${scoreColor(d.score)}"><b>${d.score}</b><span>质量评分</span></div>
     <div class="dims">`;
    DIMS.forEach((n,i)=>{h+=`<div class="dim"><label>${n}</label><div class="bar"><i style="width:${d.dims[i]}%;background:${scoreColor(d.dims[i])}"></i></div><b>${d.dims[i]}</b></div>`;});
    h+=`</div></div>
    <div class="verdict v-warn">⚠️ 低于分解阈值 70 分（PRD F2-2）。${ROLE=='business'?'科技部已针对下列问题发出澄清请求，请在「待我答复的澄清」中回复。':'建议先将高严重问题澄清修订后再分解；本项目为「强制继续」模式，已留痕。'}</div></div>
    <div class="card"><h3>问题清单（${d.issues.length} 项：高 ${c.高} / 中 ${c.中} / 低 ${c.低}）</h3>
    <table class="iss"><tr><th>#</th><th style="width:15%">位置与原文</th><th>类型</th><th>严重</th><th style="width:44%">问题说明与改写建议</th><th style="width:22%">澄清状态</th></tr>`;
    d.issues.forEach((i,n)=>{
      const cid=d.id+"-"+String(n+1).padStart(2,"0");
      const clar=CLARS.find(x=>x.id==cid);
      h+=`<tr><td>${cid}</td>
      <td><b>${i.loc}</b><div class="quote">“${i.quote}”</div></td>
      <td><span class="pill p-type">${i.type}</span></td><td>${sevPill(i.sev)}</td>
      <td>${i.desc}<div class="fix">✎ 建议：${i.fix}</div>${i.ask?`<div class="ask">❓ ${i.ask}</div>`:""}</td>
      <td>${clar?(clar.status=='已答复'?`<span class="pill p-ok">已答复</span><div class="mini" style="margin-top:4px">${clar.answer}</div>`:`<span class="pill p-wait">待业务答复</span>`):'<span style="color:#aab6c8">无需澄清</span>'}</td></tr>`;
    });
    h+=`</table>`;
    if(ROLE=='analyst') h+=`<div class="footnote"><button class="pbtn" onclick="toast('已生成澄清单并发送业务提交人（示意）')">重新发送澄清单</button> <button class="pbtn ghost" onclick="toast('已导出质检报告 Word（示意）')">导出报告</button></div>`;
    if(ROLE=='business') h+=`<div class="footnote"><button class="pbtn teal" onclick="go('clar')">去答复澄清问题</button></div>`;
    h+=`</div>`;
  }
  if(tab=='tree'){
    h+=`<div class="aibanner">🤖 功能树与详细描述为 AI 草稿——${ROLE=='analyst'?'可编辑（增删改/合并拆分），确认后进入评审':'只读展示'}。<span class="pill p-gap">缺口</span>=原文宣称但无描述；<span class="pill p-add">AI补充</span>=依据业务常识建议新增。</div>
    <div class="card"><h3>功能树 · FP 估算合计 ≈ ${d.fp}（${d.fpNote}）</h3>${renderTree(d.tree)}
    <div class="footnote">FP 为 AI 粗估，对接《项目估算表》（行内目标：功能点耗时率 ≤7.15 人时/FP），正式估算需人工复核。</div></div>
    <div class="card"><h3>结构化详细描述（样例 ${d.details.length} 个 · 其余确认功能树后批量生成）</h3>
    ${d.details.map((i,idx)=>renderDetail(d,i,idx)).join("")}`;
    if(ROLE=='analyst') h+=`<div style="display:flex;gap:8px"><button class="pbtn" onclick="toast('进入编辑模式（示意）：节点增删改、合并拆分、逐字段修改并留痕')">编辑分解结果</button><button class="pbtn teal" onclick="toast('已提交评审：负责人评审+业务确认双通过后可基线（示意）')">确认并提交评审</button></div>`;
    if(ROLE=='business') h+=`<button class="pbtn teal" onclick="go('confirm')">去确认分解结果</button>`;
    if(ROLE=='pm') h+=`<button class="pbtn gold" onclick="go('review')">去评审</button>`;
    h+=`</div>`;
  }
  if(tab=='flow'){
    const f=FLOWS[d.id];
    h+=`<div class="aibanner">🤖 AI 依据需求原文生成（草稿态）；红色虚线=原文缺失环节，对齐会上需与业务逐一确认。</div>
    <div class="card"><h3>${f.title}</h3>${f.html}<div class="flowlegend">${f.legend}</div>
    ${ROLE=='business'?`<div style="margin-top:10px"><button class="pbtn teal" onclick="go('confirm')">流程无误，去确认</button> <button class="pbtn warn" onclick="toast('已标记异议并通知分析师（示意）')">流程有误，提出异议</button></div>`:""}</div>`;
  }
  if(tab=='proto'){
    const p=PROTOS[d.id];
    h+=`<div class="aibanner">🤖 低保真可点击原型（草稿态）——用于对齐布局、字段与流程，非 UI 定稿。</div>
    <div class="card"><h3>${p.title}</h3><div class="mini">${p.note}</div>${p.html}
    ${ROLE=='business'?`<div style="margin-top:12px"><button class="pbtn teal" onclick="go('confirm')">原型符合预期，去确认</button> <button class="pbtn warn" onclick="toast('已在原型上留下异议标注（示意）')">提出修改意见</button></div>`:""}</div>`;
  }
  $("#main").innerHTML=h;
  window.scrollTo(0,0);
}

/* 原型交互 */
function pswitch(a,pg){a.parentElement.querySelectorAll("a").forEach(x=>x.classList.remove("on"));a.classList.add("on");
 document.querySelectorAll(".pg").forEach(x=>x.style.display="none");document.getElementById(pg).style.display="block";}
function ctab(a,id){a.parentElement.querySelectorAll("a").forEach(x=>x.classList.remove("on"));a.classList.add("on");
 document.querySelectorAll(".ct").forEach(x=>x.style.display="none");document.getElementById(id).style.display="block";}
function bcharge(){
 let sum=0;document.querySelectorAll(".bsel:checked").forEach(x=>sum+=parseFloat(x.dataset.v));
 const real=parseFloat($("#breal").value||0);
 if(real<sum){toast("实收("+real.toFixed(2)+") < 应收("+sum.toFixed(2)+")：部分销账是否允许待澄清（B-11）");return;}
 toast("销账成功：2笔账单已缴，流水已生成，发票打印中…找零 ¥"+(real-sum).toFixed(2));
}
document.addEventListener("change",e=>{if(e.target.classList&&e.target.classList.contains("bsel")){let s=0;document.querySelectorAll(".bsel:checked").forEach(x=>s+=parseFloat(x.dataset.v));$("#bsum").textContent=s.toFixed(2);}});

go("ov");
</script>
</body>
</html>
