<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万耀企龙 · 动态价格详情</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --navy: #0B2A4A;
    --navy-dark: #071D35;
    --navy-deep: #041221;
    --gold: #C9A84C;
    --gold-light: #E0C36A;
    --gold-dark: #A88B3A;
    --cyan: #00A3E0;
    --cyan-light: #33B8E8;
    --cyan-dark: #0089BF;
    --white: #FFFFFF;
    --gray-50: #F8F9FA;
    --gray-100: #F0F2F5;
    --gray-200: #E4E7EB;
    --gray-300: #D1D5DB;
    --gray-400: #9CA3AF;
    --gray-500: #6B7280;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-800: #1F2937;
    --text-light: rgba(255,255,255,0.85);
    --text-muted: rgba(255,255,255,0.55);
    --success: #22C55E;
    --warning: #F59E0B;
    --danger: #EF4444;
    --sidebar-width: 220px;
    --navbar-height: 64px;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--gray-800);
    background: var(--gray-50);
    overflow-x: hidden;
    line-height: 1.6;
    min-height: 100vh;
}

/* ============ NAVBAR ============ */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: var(--navbar-height);
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}

.nav-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
}

.nav-logo {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--navy), var(--cyan));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: var(--white);
    letter-spacing: -1px;
    flex-shrink: 0;
}

.nav-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.5px;
}

.nav-subtitle {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 0px;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.nav-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px 6px 10px;
    border-radius: 10px;
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    cursor: pointer;
    transition: all 0.2s ease;
}

.nav-user:hover {
    background: var(--gray-100);
}

.nav-avatar {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--navy-dark);
}

.nav-user-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
}

.nav-icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--gray-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-500);
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 15px;
}

.nav-icon-btn:hover {
    background: var(--gray-50);
    color: var(--navy);
}

/* ============ SIDEBAR ============ */
.sidebar {
    position: fixed;
    top: var(--navbar-height);
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    background: var(--white);
    border-right: 1px solid var(--gray-200);
    z-index: 999;
    padding: 20px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.sidebar-section {
    padding: 0 12px;
    margin-bottom: 8px;
}

.sidebar-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 12px 6px;
}

.sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
    text-decoration: none;
    transition: all 0.2s ease;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
}

.sidebar-item:hover {
    background: var(--gray-50);
    color: var(--navy);
}

.sidebar-item i {
    width: 20px;
    text-align: center;
    font-size: 15px;
    color: var(--gray-400);
    transition: color 0.2s ease;
}

.sidebar-item:hover i {
    color: var(--cyan);
}

.sidebar-item.active {
    background: rgba(0, 163, 224, 0.08);
    color: var(--cyan);
    font-weight: 600;
}

.sidebar-item.active i {
    color: var(--cyan);
}

.sidebar-divider {
    height: 1px;
    background: var(--gray-200);
    margin: 8px 16px;
}

/* ============ MAIN CONTENT ============ */
.main-content {
    margin-left: var(--sidebar-width);
    margin-top: var(--navbar-height);
    padding: 32px 40px;
    min-height: calc(100vh - var(--navbar-height));
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
}

.page-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -0.3px;
}

.page-title i {
    margin-right: 8px;
}

/* ============ BOOTH SELECTOR ============ */
.selector-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 16px 24px;
    border: 1px solid var(--gray-200);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.selector-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-700);
    white-space: nowrap;
}

.selector-label i {
    color: var(--cyan);
    margin-right: 6px;
}

.selector-select {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-800);
    min-width: 160px;
    cursor: pointer;
    transition: border-color 0.2s ease;
    appearance: auto;
    font-family: inherit;
}

.selector-select:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0, 163, 224, 0.1);
}

.btn-view {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}

.btn-primary-solid {
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
    color: var(--white);
    box-shadow: 0 4px 12px rgba(0, 163, 224, 0.25);
}

.btn-primary-solid:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 163, 224, 0.35);
}

/* ============ TWO-COLUMN LAYOUT ============ */
.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
}

.card {
    background: var(--white);
    border-radius: 16px;
    border: 1px solid var(--gray-200);
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    overflow: hidden;
}

.card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--gray-100);
}

.card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
}

.card-body {
    padding: 20px 24px 24px;
}

/* ============ PRICE BREAKDOWN ============ */
.price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-100);
}

.price-row:last-of-type {
    border-bottom: none;
}

.price-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gray-600);
}

.price-label i {
    width: 20px;
    text-align: center;
    font-size: 14px;
    color: var(--gray-400);
}

.price-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-800);
    text-align: right;
}

.badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-left: 8px;
}

.badge-success {
    background: rgba(34, 197, 94, 0.1);
    color: var(--success);
}

.badge-warning {
    background: rgba(245, 158, 11, 0.1);
    color: var(--warning);
}

.badge-danger {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
}

.price-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--gray-200), var(--gray-300), var(--gray-200));
    margin: 4px 0;
}

.price-total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 4px;
}

.price-total-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-800);
}

.price-total-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--cyan);
}

/* ============ CHART CONTAINER ============ */
.chart-wrapper {
    position: relative;
    width: 100%;
    height: 280px;
}

.chart-wrapper canvas {
    width: 100% !important;
    height: 100% !important;
}

.chart-info {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--gray-100);
}

.chart-stat {
    text-align: center;
    flex: 1;
}

.chart-stat-label {
    font-size: 12px;
    color: var(--gray-400);
    font-weight: 500;
}

.chart-stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-800);
    margin-top: 2px;
}

.chart-stat-value.up {
    color: var(--success);
}

.chart-stat-value.down {
    color: var(--danger);
}

/* ============ PRICE NOTES ============ */
.notes-card .card-body {
    padding: 0;
}

.note-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--gray-100);
}

.note-item:last-child {
    border-bottom: none;
}

.note-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
}

.note-icon-blue {
    background: rgba(0, 163, 224, 0.1);
    color: var(--cyan);
}

.note-icon-gold {
    background: rgba(201, 168, 76, 0.1);
    color: var(--gold);
}

.note-icon-green {
    background: rgba(34, 197, 94, 0.1);
    color: var(--success);
}

.note-text {
    font-size: 14px;
    color: var(--gray-600);
    line-height: 1.7;
}

.note-text strong {
    color: var(--gray-800);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1024px) {
    .two-col {
        grid-template-columns: 1fr;
    }
    .main-content {
        padding: 24px 20px;
    }
}

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
    }
    .sidebar.open {
        transform: translateX(0);
    }
    .main-content {
        margin-left: 0;
        padding: 20px 16px;
    }
    .navbar {
        padding: 0 16px;
    }
    .page-title {
        font-size: 20px;
    }
    .selector-bar {
        padding: 14px 16px;
    }
    .selector-select {
        min-width: 120px;
        flex: 1;
    }
    .card-body {
        padding: 16px;
    }
    .card-header {
        padding: 16px 16px 12px;
    }
    .chart-wrapper {
        height: 220px;
    }
    .price-total-value {
        font-size: 19px;
    }
    .nav-title {
        display: none;
    }

    /* Mobile hamburger */
    .mobile-toggle {
        display: flex !important;
    }
    .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 998;
    }
    .sidebar-overlay.show {
        display: block;
    }
}

@media (min-width: 769px) {
    .mobile-toggle {
        display: none !important;
    }
}

.mobile-toggle {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--gray-200);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-500);
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle sidebar">
            <i class="fas fa-bars"></i>
        </button>
        <a class="nav-brand" href="#">
            <div class="nav-logo">GE</div>
            <div>
                <div class="nav-title">GLOBUS EVENTS</div>
                <div class="nav-subtitle">万耀企龙 · 展位智能推荐系统</div>
            </div>
        </a>
    </div>
    <div class="nav-right">
        <button class="nav-icon-btn" title="通知">
            <i class="far fa-bell"></i>
        </button>
        <div class="nav-user">
            <div class="nav-avatar">企</div>
            <span class="nav-user-name">参展商</span>
            <i class="fas fa-chevron-down" style="font-size:10px;color:var(--gray-400);margin-left:2px;"></i>

</nav>

<!-- SIDEBAR OVERLAY (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
        <div class="sidebar-label">导航菜单</div>
        <a class="sidebar-item" href="#">
            <i class="fas fa-th-large"></i>
            仪表盘
        </a>
        <a class="sidebar-item" href="#">

        </a>
        <a class="sidebar-item" href="#">

        </a>

            <i class="fas fa-file-invoice"></i>

        </a>
        <a class="sidebar-item" href="#">

    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
        <div class="sidebar-label">支持</div>
        <a class="sidebar-item" href="#">
            <i class="far fa-question-circle"></i>
            帮助中心
        </a>
        <a class="sidebar-item" href="#">
            <i class="fas fa-cog"></i>
            设置
        </a>
    </div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">

    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title"><i class="fas fa-coins" style="color:var(--gold);"></i> 动态价格详情</h1>
    </div>

    <!-- Booth Selector -->
    <div class="selector-bar">
        <span class="selector-label"><i class="fas fa-map-pin"></i> 选择展位</span>
        <select class="selector-select" id="boothSelect">
            <option value="A-005">A-005（特装区·黄金转角）</option>
            <option value="A-012">A-012（特装区·主通道）</option>
            <option value="S-001">S-001（豪华区·入口）</option>
            <option value="B-022">B-022（标准区·中段）</option>

            <option value="C-008">C-008（经济区·后排）</option>
            <option value="A-003">A-003（特装区·近服务台）</option>
            <option value="S-003">S-003（豪华区·中央）</option>
        </select>
        <button class="btn-view btn-primary-solid" id="viewPriceBtn">
            <i class="fas fa-eye"></i> 查看价格
        </button>
    </div>

    <!-- Two Column Layout -->
    <div class="two-col">

        <!-- Left: Price Breakdown -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-receipt" style="color:var(--cyan);margin-right:8px;"></i> 价格构成</div>
            </div>
            <div class="card-body" id="priceBreakdown">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Right: Chart -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-chart-area" style="color:var(--cyan);margin-right:8px;"></i> 24小时价格趋势</div>
            </div>
            <div class="card-body">
                <div class="chart-wrapper">
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="chart-info">
                    <div class="chart-stat">
                        <div class="chart-stat-label">开盘价</div>

                    </div>

    </div>

    <!-- Price Notes -->
    <div class="card notes-card">
        <div class="card-header">

        </div>
        <div class="card-body">

                <div class="note-text">
                    价格基于 <strong>AI实时计算</strong>，综合考虑展位位置、面积、流量、周边展商等因子，每30分钟自动更新一次
                </div>
            </div>

                </div>
            </div>
        </div>
    </div>

</div>

<script>
// ============ DATA ============
const boothData = {
    'A-005': {
        basePrice: 22000,
        aiFactor: 1.12,
        aiLevel: '高',
        supplyFactor: 1.05,
        supplyLevel: '高',
        discount: -8,
        timeFactor: 1.02,
        timeLevel: '中',
        finalPrice: 26100,
        chartData: [
            25800, 25780, 25760, 25820, 25880, 25910,
            25950, 26000, 26080, 26120, 26150, 26180,
            26200, 26160, 26120, 26080, 26040, 26000,
            25960, 25980, 26020, 26060, 26080, 26100
        ]
    },
    'A-012': {
        basePrice: 18500,
        aiFactor: 1.08,
        aiLevel: '高',
        supplyFactor: 1.03,
        supplyLevel: '中',
        discount: -5,
        timeFactor: 1.01,
        timeLevel: '低',
        finalPrice: 21000,
        chartData: [
            20800, 20750, 20720, 20780, 20840, 20880,
            20920, 20960, 21000, 21040, 21080, 21100,
            21120, 21080, 21040, 21000, 20960, 20920,
            20880, 20860, 20880, 20920, 20960, 21000
        ]
    },
    'S-001': {
        basePrice: 35000,

// ============ CHART INSTANCE ============
let priceChart = null;

function initChart(dataPoints) {
    const ctx = document.getElementById('priceChart').getContext('2d');

    if (priceChart) {
        priceChart.destroy();
    }

    const labels = Array.from({ length: 24 }, (_, i) => i + ':00');

    const gradient = ctx.createLinearGradient(0, 0, 0, 280);
    gradient.addColorStop(0, 'rgba(0, 163, 224, 0.35)');
    gradient.addColorStop(0.5, 'rgba(0, 163, 224, 0.12)');
    gradient.addColorStop(1, 'rgba(0, 163, 224, 0.01)');

    priceChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '价格 (¥)',
                data: dataPoints,
                borderColor: '#00A3E0',
                backgroundColor: gradient,
                borderWidth: 2.5,
                fill: true,
                tension: 0.4,
                pointRadius: 3,
                pointBackgroundColor: '#00A3E0',
                pointBorderColor: '#fff',
                pointBorderWidth: 1.5,
                pointHoverRadius: 6,
                pointHoverBackgroundColor: '#00A3E0',
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                intersect: false,
                mode: 'index'
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    backgroundColor: 'rgba(11, 42, 74, 0.9)',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    padding: 12,
                    cornerRadius: 10,
                    callbacks: {
                        label: function(context) {
                            return '¥' + context.parsed.y.toLocaleString();
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: {
                        display: false
                    },
                    ticks: {
                        font: {
                            size: 11,
                            family: "'Inter', sans-serif"
                        },
                        color: '#9CA3AF',
                        maxTicksLimit: 8
                    }
                },
                y: {
                    grid: {
                        color: 'rgba(0,0,0,0.04)',
                        drawBorder: false
                    },
                    ticks: {
                        font: {
                            size: 11,
                            family: "'Inter', sans-serif"
                        },
                        color: '#9CA3AF',
                        callback: function(value) {
                            return '¥' + value.toLocaleString();
                        }
                    }
                }
            }
        }
    });
}

// ============ UPDATE PRICE BREAKDOWN ============
function updatePriceBreakdown(boothId) {
    const data = boothData[boothId];
    if (!data) return;

    const container = document.getElementById('priceBreakdown');

    const levelBadge = (level, type) => {
        if (type === 'success') return `<span class="badge badge-success">${level}</span>`;
        if (type === 'warning') return `<span class="badge badge-warning">${level}</span>`;
        if (type === 'danger') return `<span class="badge badge-danger">${level}</span>`;
        return '';
    };

    const getLevelType = (level) => {
        if (level === '高') return 'success';
        if (level === '中') return 'warning';
        return 'danger';
    };

    // Calculate derived values for display
    const aiValue = data.basePrice * (data.aiFactor - 1);
    const supplyValue = data.basePrice * (data.supplyFactor - 1);
    const discountPercent = data.discount;
    const timeValue = data.basePrice * (data.timeFactor - 1 proiektuak);

    // Actually simpler to just show the factors directly
    const aiDisplay = '×' + data.aiFactor.toFixed(2);
    const supplyDisplay = '×' + data.supplyFactor.toFixed(2);
    const discountDisplay = data.discount + '%';
    const timeDisplay = '×' + data.timeFactor.toFixed(2);

    container.innerHTML = `
        <div class="price-row">
            <span class="price-label"><i class="fas fa-tag"></i> 基础价格</span>
            <span class="price-value">¥${data.basePrice.toLocaleString()}</span>
        </div>
        <div class="price-row">
            <span class="price-label"><i class="fas fa-brain"></i> AI价值系数</span>
            <span class="price-value">${aiDisplay} ${levelBadge(data.aiLevel, getLevelType(data.aiLevel))}</span>
        </div>
        <div class="price-row">
            <span class="price-label"><i class="fas fa-balance-scale"></i> 供需关系系数</span>
            <span class="price-value">${supplyDisplay} ${levelBadge(data.supplyLevel, getLevelType(data.supplyLevel))}</span>
        </div>
        <div class="price-row">
            <span class="price-label"><i class="fas fa-hand-holding-heart"></i> 客户权益折扣</span>
            <span class="price-value" style="color:var(--danger);">${discountDisplay} <span class="badge badge-danger">优惠</span></span>
        </div>
        <div class="price-row">
            <span class="price-label"><i class="fas fa-clock"></i> 时段浮动系数</span>
            <span class="price-value">${timeDisplay} ${levelBadge(data.timeLevel, getLevelType(data.timeLevel))}</span>
        </div>
        <div class="price-divider"></div>
        <div class="price-total-row">
            <span class="price-total-label"><i class="fas fa-calculator"></i> 最终价格</span>
            <span class="price-total-value">¥${data.finalPrice.toLocaleString()}</span>
        </div>
    `;
}

// ============ UPDATE CHART STATS ============
function updateChartStats(dataPoints) {
    const openVal = dataPoints[0];
    const currentVal = dataPoints[dataPoints.length - 1];
    const highVal = Math.max(...dataPoints);
    const lowVal = Math.min(...dataPoints);

    document.getElementById('openPrice').textContent = '¥' + openVal.toLocaleString();
    document.getElementById('currentPrice').textContent = '¥' + currentVal.toLocaleString();
    document.getElementById('highPrice').textContent = '¥' + highVal.toLocaleString();
    document.getElementById('lowPrice').textContent = '¥' + lowVal.toLocaleString();

    // Color current price based on trend
    const currentEl = document.getElementById('currentPrice');
    if (currentVal >= openVal) {
        currentEl.className = 'chart-stat-value up';
    } else {
        currentEl.className = 'chart-stat-value down';
    }
}

// ============ LOAD BOOTH ============
function loadBooth(boothId) {
    const data = boothData[boothId];
    if (!data) return;

    updatePriceBreakdown(boothId);
    initChart(data.chartData);
    updateChartStats(data.chartData);
}

// ============ EVENT LISTENERS ============
document.addEventListener('DOMContentLoaded', function() {
    // Load default booth
    const defaultBooth = document.getElementById('boothSelect').value;
    loadBooth(defaultBooth);

    // View price button
    document.getElementById('viewPriceBtn').addEventListener('click', function() {
        const selected = document.getElementById('boothSelect').value;
        loadBooth(selected);
    });

    // Also trigger on select change for convenience
    document.getElementById('boothSelect').addEventListener('change', function() {
        // Auto-load on change as well
        loadBooth(this.value);
    });

    // Mobile sidebar toggle
    const mobileToggle = document.getElementById('mobileToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');

    mobileToggle.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', function() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    });
});
