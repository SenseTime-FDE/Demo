<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>数据报表 | GLOBUS EVENTS</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B2A4A;--navy-dark:#071D35;--gold:#C9A84C;--gold-dark:#A88B3A;--cyan:#00A3E0;--cyan-light:#e6f7fe;--green:#10B981;--gray-50:#F8F9FA;--gray-100:#F0F2F5;--gray-200:#E4E7EB;--gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--white:#FFFFFF;--text-muted:rgba(255,255,255,0.55);--shadow-sm:0 1px 3px rgba(11,42,74,0.06);--radius:10px;--sidebar-w:220px;--navbar-h:64px;--transition:0.2s ease}
html{font-size:16px}
body{font-family:'Noto Sans SC',sans-serif;background:var(--gray-50);color:var(--gray-700);line-height:1.6}
.navbar{position:fixed;top:0;left:0;right:0;height:var(--navbar-h);background:var(--navy-dark);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:1000}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),#d4a843);color:var(--navy-dark);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.brand-text{font-weight:600;font-size:15px;color:var(--white)}.brand-text span{color:rgba(255,255,255,0.55);font-size:13px;font-weight:300}
.staff-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),#33B8E8);color:var(--white);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.staff-name{font-size:13px;color:rgba(255,255,255,0.85)}
.sidebar{position:fixed;top:var(--navbar-h);left:0;width:var(--sidebar-w);height:calc(100vh - var(--navbar-h));background:var(--navy-dark);overflow-y:auto;z-index:999;padding:16px 0}
.sidebar-nav li a{display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:14px;color:rgba(255,255,255,0.55);border-left:3px solid transparent;transition:all var(--transition);cursor:pointer}
.sidebar-nav li a i{width:20px;text-align:center;font-size:15px}
.sidebar-nav li a:hover{background:rgba(255,255,255,0.05);color:var(--white)}
.sidebar-nav li a.active{background:rgba(0,163,224,0.12);color:var(--cyan);border-left-color:var(--cyan)}
.main{margin-left:var(--sidebar-w);margin-top:var(--navbar-h);padding:32px 36px}
.page-header h1{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:8px}
.page-header p{font-size:14px;color:var(--gray-500);margin-bottom:28px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);padding:20px;text-align:center}
.stat-card .label{font-size:12px;color:var(--gray-500);margin-bottom:6px}
.stat-card .value{font-size:26px;font-weight:800;color:var(--navy)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);padding:20px}
.chart-card h3{font-size:15px;font-weight:700;color:var(--gray-800);margin-bottom:16px}
.chart-container{height:260px;position:relative}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:6px;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:all var(--transition)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--white)}
.btn-outline{background:transparent;color:var(--gray-600);border:1px solid var(--gray-300)}.btn-outline:hover{border-color:var(--cyan);color:var(--cyan)}
.action-bar{display:flex;gap:12px;justify-content:flex-end;margin-bottom:24px}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--gray-200);text-align:center;font-size:13px;color:var(--gray-400)}
@media(max-width:1024px){.charts-row{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0;padding:20px}.stat-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="navbar">
<div style="display:flex;align-items:center;gap:12px;">
<div class="navbar-brand"><div class="logo-icon">GE</div><div class="brand-text">GLOBUS EVENTS <span>· 运营管理中心</span></div></div>
</div>
<div class="navbar-right"><span class="staff-name">管理员 · 张三</span><div class="staff-avatar">管</div></div>
</header>
<aside class="sidebar">
<ul class="sidebar-nav">
<li><a href="#"><i class="fas fa-chart-pie"></i> 运营数据看板</a></li>
<li><a href="#"><i class="fas fa-users"></i> 客户线索管理</a></li>
<li><a href="#"><i class="fas fa-building"></i> 展位资源管理</a></li>
<li><a href="#"><i class="fas fa-brain"></i> AI模型参数</a></li>
<li><a href="#"><i class="fas fa-dollar-sign"></i> 动态定价规则</a></li>
<li><a href="#"><i class="fas fa-clipboard-list"></i> 订单管理</a></li>
<li><a href="#" class="active"><i class="fas fa-chart-line"></i> 数据报表</a></li>
</ul>
</aside>
<main class="main">
<div class="page-header"><h1><i class="fas fa-chart-line" style="color:var(--cyan);margin-right:8px;"></i> 数据报表</h1><p>查看系统运营数据统计与分析</p></div>
<div class="action-bar">
<button class="btn btn-gold"><i class="fas fa-file-excel"></i> 导出Excel报表</button>
<button class="btn btn-outline"><i class="fas fa-file-pdf"></i> 导出PDF</button>
</div>
<div class="stat-row">
<div class="stat-card"><div class="label">总成交额</div><div class="value">¥117,700</div></div>
<div class="stat-card"><div class="label">总订单数</div><div class="value">5</div></div>
<div class="stat-card"><div class="label">平均客单价</div><div class="value">¥23,540</div></div>
<div class="stat-card"><div class="label">AI转化率</div><div class="value">67.5%</div></div>
</div>
<div class="charts-row">
<div class="chart-card"><h3>月度成交趋势</h3><div class="chart-container"><canvas id="monthlyChart"></canvas></div></div>
<div class="chart-card"><h3>展位等级分布</h3><div class="chart-container"><canvas id="levelChart"></canvas></div></div>
</div>
<footer class="footer">&copy; 2026 GLOBUS EVENTS</footer>
</main>
<script>
new Chart(document.getElementById('monthlyChart'),{
type:'bar',
data:{labels:['1月','2月','3月','4月','5月','6月'],datasets:[{label:'成交额(万元)',data:[0,0,0,0,4.56,7.21],backgroundColor:'rgba(0,163,224,0.7)',borderColor:'#00A3E0',borderWidth:1}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
});
new Chart(document.getElementById('levelChart'),{
type:'pie',
data:{labels:['S级旗舰','A级优选','B级标准','C级基础'],datasets:[{data:[20,40,30,10],backgroundColor:['#C9A84C','#00A3E0','#10B981','#9CA3AF'],borderWidth:0}]},
options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}
});
</script>
</body>
</html>
