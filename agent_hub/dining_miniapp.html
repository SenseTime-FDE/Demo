<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字餐饮 · 小程序 · 灵犀统一 Agent 运营中台</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* —— 顾客点餐小程序（第三方壳 + 商汤 AI 能力），局部样式，仅作用于手机内 —— */
    .mini-app { flex: 1; display: flex; flex-direction: column; background: #f2f3f5; min-height: 0; color: #1c1c1e; font-size: 13px; }
    .mini-head { background: linear-gradient(135deg, var(--accent), #e07d0a); color: #fff; padding: 10px 16px 16px; }
    .mini-head .st { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .mini-head .sub { font-size: 11px; opacity: .9; margin-top: 2px; }
    .mini-body { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
    .mini-screen { display: none; } .mini-screen.active { display: block; }
    .mini-voice { display: flex; align-items: center; justify-content: center; gap: 8px; background: #fff; border: 1px dashed var(--accent); color: var(--accent); font-weight: 700; border-radius: 12px; padding: 11px; margin-bottom: 12px; cursor: pointer; font-size: 13.5px; }
    .mini-voice.live { background: #fff6e8; }
    .mini-cats { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 10px; }
    .mini-cat { font-size: 11.5px; padding: 4px 11px; border-radius: 14px; background: #fff; color: #666; border: 1px solid #eee; }
    .mini-cat.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mini-card { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .mini-dish { display: flex; gap: 11px; align-items: center; }
    .mini-dish .thumb { width: 54px; height: 54px; border-radius: 11px; flex: none; display: grid; place-items: center; font-size: 26px; background: linear-gradient(135deg, #fff0d6, #ffe0ad); }
    .mini-dish .info { flex: 1; min-width: 0; }
    .mini-dish .nm { font-weight: 700; font-size: 13.5px; }
    .mini-dish .tg { font-size: 10.5px; color: var(--accent); margin-top: 2px; }
    .mini-dish .price { color: #e07d0a; font-weight: 800; font-size: 15px; }
    .mini-dish .price small { font-size: 10px; font-weight: 400; }
    .mini-add { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
    .mini-qty { display: flex; align-items: center; gap: 9px; }
    .mini-qty button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); background: #fff; color: var(--accent); font-size: 15px; cursor: pointer; }
    .mini-qty .n { min-width: 14px; text-align: center; font-weight: 700; }
    .mini-cartbar { position: sticky; bottom: 0; margin-top: 8px; background: #1c1c1e; color: #fff; border-radius: 26px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
    .mini-cartbar .tt { flex: 1; font-size: 13px; }
    .mini-cartbar .tt b { color: var(--accent); font-size: 17px; }
    .mini-cartbar .go { background: var(--accent); color: #fff; border: none; border-radius: 22px; padding: 9px 20px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .mini-cartbar.empty { background: #e9e9ec; color: #999; }
    .mini-cartbar.empty .go { background: #c9c9cd; }
    .mini-sec { font-size: 12px; color: #888; font-weight: 700; margin: 4px 2px 8px; }
    .mini-order { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .mini-order .oh { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 6px; }
    .mini-order .ob { font-size: 13px; } .mini-order .of { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #eee; }
    .mini-me { text-align: center; padding: 14px 0 6px; }
    .mini-me .av { width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 8px; display: grid; place-items: center; font-size: 26px; color: #fff; background: linear-gradient(135deg, var(--accent), #e07d0a); }
    .mini-me .nm { font-weight: 800; font-size: 16px; } .mini-me .lv { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .mini-stats { display: flex; background: #fff; border-radius: 12px; padding: 12px 0; margin: 10px 0; }
    .mini-stats .c { flex: 1; text-align: center; border-right: 1px solid #f0f0f0; }
    .mini-stats .c:last-child { border: none; } .mini-stats .c b { display: block; font-size: 17px; color: #e07d0a; } .mini-stats .c span { font-size: 11px; color: #999; }
    .mini-list { background: #fff; border-radius: 12px; overflow: hidden; }
    .mini-li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #f4f4f4; font-size: 13px; }
    .mini-li:last-child { border: none; } .mini-li .ar { margin-left: auto; color: #ccc; }
    .mini-tabbar { display: flex; background: #fff; border-top: 1px solid #e8e8e8; }
    .mini-tab { flex: 1; text-align: center; padding: 7px 0 9px; font-size: 10.5px; color: #999; cursor: pointer; position: relative; }
    .mini-tab .i { font-size: 20px; display: block; line-height: 1.3; }
    .mini-tab.on { color: var(--accent); }
    .mini-tab .cbadge { position: absolute; top: 4px; left: 54%; background: #f5384e; color: #fff; font-size: 9px; border-radius: 10px; padding: 0 5px; font-weight: 700; }
    .mini-ai { background: #fff6e8; border: 1px solid #ffe0ad; border-radius: 12px; padding: 11px 13px; font-size: 12.5px; color: #7a5200; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="assets/app.js"></script>
  <script>
    Hub.boot({ page: 'dining_miniapp', scenario: 'dining' }).then(({ data, me, perms }) => {
      const V = document.getElementById('view');
      const dishes = Hub.data.dining.dishes;
      const emoji = { dm1: '🥩', dm2: '🥗', dm3: '🍱' };
      const combos = [
        { icon: '👨‍👩‍👧', name: '家庭欢享套餐', items: '招牌牛肉套餐 + 儿童营养餐 + 饮品×2', price: 78, note: 'AI 根据「2 大 1 小」画像推荐' },
        { icon: '💪', name: '轻卡健身组合', items: '低卡轻食碗 + 无糖饮品', price: 39, note: '你近 3 单偏好低卡，已优先' },
      ];
      const orders = [
        { no: '#20260716-0921', time: '今天 09:21', items: '招牌牛肉套餐 ×1 · 儿童营养餐 ×1', total: 66, status: '制作中' },
        { no: '#20260715-1840', time: '昨天 18:40', items: '低卡轻食碗 ×2', total: 64, status: '已完成' },
      ];

      let cart = {};
      let cat = '全部';
      const money = () => dishes.reduce((s, d) => s + (cart[d.id] || 0) * d.price, 0);
      const count = () => Object.values(cart).reduce((a, b) => a + b, 0);

      V.innerHTML = `
        <div class="wrap">
          ${Hub.sceneSubnav('dining', '_miniapp')}
          <div class="page-intro">
            <b>顾客点餐小程序</b> —— 面向 C 端就餐顾客：语音点餐、忌口识别、套餐智能推荐、订单与会员一体。
            小程序由第三方 ISV 开发，<span class="tacc">点餐语音识别、个性化推荐、智能问答由商汤 AI 能力提供</span>。
          </div>
          <div class="grid g2" style="align-items:start">
            <div class="phone-stage">
              <div class="phone">
                <div class="notch"></div>
                <div class="screen">
                  <div class="statusbar"><span>9:41</span><span class="right">●●●●● 5G ▮▮▮</span></div>
                  <div class="mini-app">
                    <div class="mini-head">
                      <div class="st">🍽️ 味见食堂 · 中心广场店</div>
                      <div class="sub">堂食 · 桌号 A12 · 营业中 10:00–22:00</div>
                    </div>
                    <div class="mini-body">
                      <section class="mini-screen active" data-s="order"></section>
                      <section class="mini-screen" data-s="rec"></section>
                      <section class="mini-screen" data-s="orders"></section>
                      <section class="mini-screen" data-s="me"></section>
                    </div>
                    <div class="mini-tabbar">
                      <div class="mini-tab on" data-s="order"><span class="i">🍽️</span>点餐</div>
                      <div class="mini-tab" data-s="rec"><span class="i">✨</span>推荐</div>
                      <div class="mini-tab" data-s="orders"><span class="i">📋</span>订单</div>
                      <div class="mini-tab" data-s="me"><span class="i">👤</span>我的</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <div class="panel">
                <div class="panel-t"><h3>📱 小程序说明</h3><span class="sub">第三方开发 · 商汤 AI 赋能</span></div>
                <div class="chips">
                  <span class="chip-tag">🎙 语音点餐（ASR）</span>
                  <span class="chip-tag">🚫 忌口/过敏识别</span>
                  <span class="chip-tag">✨ 千人千面套餐推荐</span>
                  <span class="chip-tag">💬 智能客服问答</span>
                </div>
                <div class="section-t" style="margin-top:16px">能力分工</div>
                <div class="kv mt8"><span class="k">第三方</span><span class="t2">小程序界面、下单交易、会员与营销</span></div>
                <div class="kv mt8"><span class="k">商汤</span><span class="t2">语音识别、意图理解、推荐与问答模型（日日新 + SenseAudio）</span></div>
                <div class="hint mt16">点手机内「🎙 说出你想吃的」体验语音点餐与忌口识别；底部 4 个 Tab 可切换点餐 / 推荐 / 订单 / 我的。</div>
              </div>
            </div>
          </div>
        </div>`;

      const $s = (s) => document.querySelector(`.mini-screen[data-s="${s}"]`);

      // —— 点餐屏 ——
      function renderOrder() {
        const cats = ['全部', '热销', '新品', '推荐'];
        const list = dishes.filter(d => cat === '全部' || d.tag === cat);
        const rows = list.map(d => {
          const q = cart[d.id] || 0;
          const right = q > 0
            ? `<div class="mini-qty"><button data-act="minus" data-id="${d.id}">−</button><span class="n">${q}</span><button data-act="plus" data-id="${d.id}">＋</button></div>`
            : `<button class="mini-add" data-act="plus" data-id="${d.id}">＋</button>`;
          return `<div class="mini-card"><div class="mini-dish">
            <div class="thumb">${emoji[d.id] || '🍽️'}</div>
            <div class="info"><div class="nm">${Hub.esc(d.name)}</div>
              <div class="tg">${Hub.esc(d.tag)} · 库存${Hub.esc(d.stock)}</div>
              <div class="price">¥${Hub.esc(d.price)}<small>/份</small></div></div>
            ${right}
          </div></div>`;
        }).join('');
        const c = count();
        const bar = `<div class="mini-cartbar ${c ? '' : 'empty'}">
          <div class="tt">${c ? `已选 ${c} 件 · 合计 <b>¥${money()}</b>` : '购物车是空的'}</div>
          <button class="go" data-act="checkout">去结算</button></div>`;
        $s('order').innerHTML = `
          <div class="mini-voice" data-act="voice"><span>🎙</span> 说出你想吃的（支持忌口）</div>
          <div class="mini-cats">${cats.map(x => `<span class="mini-cat ${x === cat ? 'on' : ''}" data-cat="${x}">${x}</span>`).join('')}</div>
          ${rows || '<div class="empty">该分类暂无菜品</div>'}
          ${bar}`;
        updateBadge();
      }

      function renderRec() {
        $s('rec').innerHTML = `
          <div class="mini-ai">✨ 你好，${Hub.esc(me.name)}。根据你的口味画像与门店热销，为你精选以下组合：</div>
          ${combos.map((c, i) => `<div class="mini-card">
            <div class="mini-dish">
              <div class="thumb">${c.icon}</div>
              <div class="info"><div class="nm">${Hub.esc(c.name)}</div>
                <div class="tg" style="color:#888">${Hub.esc(c.items)}</div>
                <div class="price">¥${c.price}</div></div>
              <button class="mini-add" data-act="combo" data-i="${i}">＋</button>
            </div>
            <div class="hint" style="color:#a97f2e;margin-top:8px">🤖 ${Hub.esc(c.note)}</div>
          </div>`).join('')}
          <div class="mini-sec">大家都在点</div>
          ${dishes.filter(d => d.tag === '热销' || d.tag === '推荐').map(d => `<div class="mini-card"><div class="mini-dish">
            <div class="thumb">${emoji[d.id] || '🍽️'}</div>
            <div class="info"><div class="nm">${Hub.esc(d.name)}</div><div class="price">¥${Hub.esc(d.price)}</div></div>
            <button class="mini-add" data-act="plus" data-id="${d.id}">＋</button></div></div>`).join('')}`;
      }

      function renderOrders() {
        $s('orders').innerHTML = `
          <div class="mini-sec">我的订单</div>
          ${orders.map(o => `<div class="mini-order">
            <div class="oh"><span>${Hub.esc(o.no)}</span><span>${Hub.esc(o.time)}</span></div>
            <div class="ob">${Hub.esc(o.items)}</div>
            <div class="of"><span style="color:${o.status === '已完成' ? '#4caf50' : '#e07d0a'}">${Hub.esc(o.status)}</span><b style="color:#e07d0a">¥${o.total}</b></div>
          </div>`).join('')}`;
      }

      function renderMe() {
        $s('me').innerHTML = `
          <div class="mini-me">
            <div class="av">${Hub.esc((me.name || 'U').slice(-1))}</div>
            <div class="nm">${Hub.esc(me.name)}</div>
            <div class="lv">🏅 黄金会员 · 味见食堂</div>
          </div>
          <div class="mini-stats">
            <div class="c"><b>1280</b><span>积分</span></div>
            <div class="c"><b>3</b><span>优惠券</span></div>
            <div class="c"><b>¥86</b><span>余额</span></div>
          </div>
          <div class="mini-list">
            <div class="mini-li">🚫 我的忌口偏好<span class="ar">花生过敏 ›</span></div>
            <div class="mini-li">🎟️ 卡券中心<span class="ar">›</span></div>
            <div class="mini-li">💬 智能客服<span class="ar">商汤 AI ›</span></div>
            <div class="mini-li">📍 收货/餐桌地址<span class="ar">A12 ›</span></div>
            <div class="mini-li">⚙️ 设置<span class="ar">›</span></div>
          </div>
          <div class="hint" style="text-align:center;margin-top:14px;color:#aaa">灵犀 · 数字餐饮 · 商汤 AI 技术底座</div>`;
      }

      function updateBadge() {
        const tab = document.querySelector('.mini-tab[data-s="order"]');
        if (!tab) return;
        const old = tab.querySelector('.cbadge'); if (old) old.remove();
        const c = count();
        if (c) { const b = document.createElement('span'); b.className = 'cbadge'; b.textContent = c; tab.appendChild(b); }
      }

      renderOrder(); renderRec(); renderOrders(); renderMe();

      // —— Tab 切换 ——
      document.querySelector('.mini-tabbar').addEventListener('click', (e) => {
        const t = e.target.closest('.mini-tab'); if (!t) return;
        const s = t.dataset.s;
        document.querySelectorAll('.mini-tab').forEach(x => x.classList.toggle('on', x === t));
        document.querySelectorAll('.mini-screen').forEach(p => p.classList.toggle('active', p.dataset.s === s));
      });

      // —— 屏内交互（事件委托）——
      document.querySelector('.mini-body').addEventListener('click', (e) => {
        const a = e.target.closest('[data-act], [data-cat]'); if (!a) return;
        if (a.dataset.cat) { cat = a.dataset.cat; renderOrder(); return; }
        const act = a.dataset.act;
        if (act === 'plus') { const id = a.dataset.id; cart[id] = (cart[id] || 0) + 1; renderOrder(); }
        else if (act === 'minus') { const id = a.dataset.id; cart[id] = Math.max(0, (cart[id] || 0) - 1); if (!cart[id]) delete cart[id]; renderOrder(); }
        else if (act === 'combo') { cart['dm1'] = (cart['dm1'] || 0) + 1; cart['dm3'] = (cart['dm3'] || 0) + 1; Hub.toast('已加入套餐到购物车'); document.querySelector('.mini-tab[data-s="order"]').click(); renderOrder(); }
        else if (act === 'voice') {
          const btn = a; btn.classList.add('live'); btn.innerHTML = '<span>🔴</span> 识别中…请说话';
          setTimeout(() => {
            cart['dm1'] = (cart['dm1'] || 0) + 1;
            renderOrder();
            Hub.toast('已识别：招牌牛肉套餐 ×1（忌口：花生）');
          }, 1100);
        }
        else if (act === 'checkout') {
          if (!count()) { Hub.toast('购物车是空的', true); return; }
          const total = money(), items = dishes.filter(d => cart[d.id]).map(d => `${d.name} ×${cart[d.id]}`).join(' · ');
          const now = new Date();
          orders.unshift({ no: '#' + now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '-' + now.toTimeString().slice(0, 5).replace(':', ''), time: '刚刚', items, total, status: '制作中' });
          cart = {};
          renderOrder(); renderOrders();
          Hub.toast('下单成功，预计 12 分钟出餐');
          document.querySelector('.mini-tab[data-s="orders"]').click();
        }
      });
    });
  </script>
</body>
</html>
