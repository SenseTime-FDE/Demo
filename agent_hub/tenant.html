<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>租户首页 · 商汤灵犀</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* 局部微调：租户首页（沿用深色科技风，仅补齐入口卡 / 成员卡细节）。
       Hub.modal 挂在 document.body（#view 之外），故表单相关样式不加 #view 作用域。*/
    #view .entry-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media (max-width: 1080px) { #view .entry-grid { grid-template-columns: 1fr; } }
    #view .entry-card .go { margin-top: auto; color: var(--sc-accent); font-weight: 700; font-size: 12.5px; }
    #view .entry-card { display: flex; flex-direction: column; min-height: 150px; }
    #view .mbr { display: flex; gap: 12px; align-items: flex-start; }
    #view .mbr .mbr-ic { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 19px; background: color-mix(in srgb, var(--accent) 16%, var(--panel-3)); }
    #view .mbr .mbr-nm { font-weight: 700; }
    #view .mbr .mbr-ds { font-size: 12px; color: var(--txt-3); margin-top: 3px; }
    #view .vox-card .vx-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
    #view .vox-card .vx-row:last-child { border-bottom: none; }
    #view .vox-card .vx-k { color: var(--txt-3); min-width: 76px; font-size: 12px; }
    #view .col-act { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="view"></div>
  <script src="assets/app.js"></script>
  <script src="assets/models.js"></script>
  <script>
    Hub.boot({ page: 'tenant' }).then(({ data, me, perms }) => {
      const V = document.getElementById('view');
      const bizId = Hub.me.businessId, tid = Hub.me.tenantId;
      const B = Hub.business(bizId), T = Hub.tenant(tid);
      const esc = Hub.esc;
      const fmtN = (n) => Number(n || 0).toLocaleString('en-US');

      // ---- 防御：非租户上下文（如观察员直连本页）----
      if (!B || !T) {
        V.innerHTML = `<div class="wrap"><div class="empty">
          未找到当前账号绑定的租户上下文。<br>
          本页面面向「租户管理员」，请用租户管理员账号登录（如 <span class="mono">media_t1 / campus_t1 / elder_t1 / dining_t1</span>）。
        </div></div>`;
        return;
      }

      const voxPill = (s) => `<span class="pill ${s === '已接入' ? 'ok' : (s === '待接入' ? 'warn' : '')}">${esc(s || '—')}</span>`;
      const canOp = perms.manageAgents;   // 租户管理员：可管本租户 Agent（后端再强制本租户）
      const vox = B.voxone || {};

      // ---- 页面骨架 ----
      V.innerHTML = `
        <div class="wrap">
          <div class="page-intro">
            <b>${esc(T.name)}</b>（${esc(T.type)} · ${esc(T.plan)}） —— 隶属 <b>${esc(B.icon + ' ' + B.name)}</b>。
            本页为租户管理员工作台：管理本租户 Agent、查看成员与共享的声渡语音。
            <span class="tr">所有写操作由后端按「角色 × 业务 × 租户」强制授权，越权将被拒绝。</span>
          </div>

          <div class="section-t">快速进入</div>
          <div class="entry-grid">
            <a class="scene-card entry-card" href="assistant.html" style="--sc-accent:${esc(B.accent)}">
              <div class="ic">💬</div>
              <div class="tag">${esc(B.assistant ? B.assistant.name : '个人 AI 助理')}</div>
              <h3>个人 AI 助理</h3>
              <div class="ds">${esc(B.assistant ? B.assistant.persona : '面向本人的个人 AI 助理')}，语音问答、全程留痕可查。</div>
              <div class="go">进入助理 →</div>
            </a>
            <a class="scene-card entry-card" href="${esc(bizId)}_agent.html" style="--sc-accent:${esc(B.accent)}">
              <div class="ic">🎙</div>
              <div class="tag">一线使用场景</div>
              <h3>Agent 语音原型</h3>
              <div class="ds">${esc(B.name)} 一线 Agent 语音交互原型，贴近真实业务、由声渡拟真人语音驱动。</div>
              <div class="go">体验原型 →</div>
            </a>
            <a class="scene-card entry-card" href="${esc(bizId)}_miniapp.html" style="--sc-accent:${esc(B.accent)}">
              <div class="ic">📱</div>
              <div class="tag">终端用户</div>
              <h3>业务小程序</h3>
              <div class="ds">面向终端用户的 ${esc(B.name)} 小程序体验，随本租户开通即可使用。</div>
              <div class="go">打开小程序 →</div>
            </a>
          </div>

          <div class="section-t">本租户概览</div>
          <div id="kpiBox"></div>

          <div class="section-t">本租户 Agent</div>
          <div class="panel">
            <div class="panel-t">
              <h3>🤖 Agent 列表</h3>
              <span class="sub">仅本租户 · ${esc(T.name)}</span>
              <span class="sp"></span>
              ${canOp
                ? `<button class="btn btn-primary btn-sm" id="btn-new">＋ 新建 Agent</button>`
                : `<span class="ro-note">👁 当前角色为只读，可查看 Agent 但不可编辑</span>`}
            </div>
            <div id="tableBox" class="tbl-wrap"></div>
            ${canOp ? '<div class="hint mt12">说明：租户管理员仅能管理本租户 Agent，归属租户由后端强制为本租户，不可跨租户操作。</div>' : ''}
          </div>

          <div class="grid g2 mt16" style="grid-template-columns: 1.3fr .7fr; align-items:start">
            <div class="panel">
              <div class="panel-t"><h3>👥 租户成员</h3><span class="sub">角色 · 示意</span></div>
              <div class="grid g2">
                <div class="card mbr">
                  <div class="mbr-ic">🛡️</div>
                  <div>
                    <div class="mbr-nm">${esc(me.name)} <span class="pill acc" style="font-size:10px">${esc(me.roleLabel)}</span></div>
                    <div class="mbr-ds">管理本租户 Agent 与成员；可进入个人 AI 助理并全程留痕。</div>
                  </div>
                </div>
                <div class="card mbr">
                  <div class="mbr-ic">🎧</div>
                  <div>
                    <div class="mbr-nm">一线用户 · 座席 <span class="pill" style="font-size:10px">示意</span></div>
                    <div class="mbr-ds">通过「个人 AI 助理」使用 ${esc(B.name)} 拟真人语音服务，交互全程留痕、可回溯。</div>
                  </div>
                </div>
              </div>
              <div class="ro-note mt12">成员邀请由业务管理员 / 平台运营统一开通，本页仅示意展示租户下的角色构成。</div>
            </div>

            <div class="panel vox-card">
              <div class="panel-t"><h3>🎚️ 声渡语音</h3><span class="sub">拟真人 · 全业务共享</span></div>
              <div class="vx-row"><span class="vx-k">平台</span><span>${esc(vox.platform || '商汤声渡 VoxOne')}</span></div>
              <div class="vx-row"><span class="vx-k">音色</span><span>${esc(vox.voice || '—')}</span></div>
              <div class="vx-row"><span class="vx-k">状态</span>${voxPill(vox.status)}</div>
              <div class="vx-row"><span class="vx-k">时延</span><span class="mono">${esc(vox.latency || '—')}</span></div>
              <div class="hint mt12">本租户共享 ${esc(B.name)} 的一套声渡拟真人语音；接入配置由业务管理员 / 平台运营维护。</div>
              <div class="ro-note mt8">👁 声渡接入为业务级配置，租户侧只读。</div>
            </div>
          </div>

          <div class="hint mt24">口径：调用数等为目标态示意，非真实经营数据。配置以真后端 SQLite 持久化，权限由服务器强制校验。</div>
        </div>`;

      const kpiBox = document.getElementById('kpiBox');
      const tableBox = document.getElementById('tableBox');

      // ---- 渲染：KPI（读 Hub.data，保证 refresh 后取新数据）----
      function renderKpis() {
        const list = Hub.agentsOfTenant(tid);
        const on = list.filter(a => a.status === 'on').length;
        kpiBox.innerHTML = `<div class="grid g4">${[
          { k: '本租户 Agent', v: list.length, u: '个', d: on + ' 个在用 / ' + (list.length - on) + ' 个停用' },
          { k: '在用 Agent', v: on, u: '个', d: list.length ? '占比 ' + Math.round(on / list.length * 100) + '%' : '暂无 Agent' },
          { k: '订阅套餐', v: T.plan, d: T.status + ' · ' + (T.region || '—') },
          { k: '开通时间', v: T.since, d: '联系人 ' + (T.contact || '—') },
        ].map(k => Hub.kpi(k)).join('')}</div>`;
      }

      // ---- 渲染：Agent 表格 ----
      function renderTable() {
        const list = Hub.agentsOfTenant(tid);
        if (!list.length) {
          tableBox.innerHTML = `<div class="empty">本租户暂无 Agent${canOp ? '，点击右上角「＋ 新建 Agent」开始编排。' : '。'}</div>`;
          return;
        }
        const head = `
          <tr>
            <th>Agent 名称</th><th>面向角色</th><th>状态</th><th>运行模型</th>
            <th>知识库</th><th>调用数</th><th>更新时间</th>${canOp ? '<th>操作</th>' : ''}
          </tr>`;
        const rows = list.map(a => {
          const kbN = (a.kbIds || []).length;
          const actCell = canOp ? `<td class="col-act"><div class="btn-row">
              <button class="btn btn-sm" data-act="toggle" data-id="${a.id}">${a.status === 'on' ? '停用' : '启用'}</button>
              <button class="btn btn-sm" data-act="edit" data-id="${a.id}">编辑</button>
              <button class="btn btn-sm" data-act="del" data-id="${a.id}">删除</button>
            </div></td>` : '';
          return `<tr>
            <td><div class="b">${esc(a.name)}</div><div class="tr small">${esc(a.desc || '')}</div></td>
            <td>${esc(a.role || '—')}</td>
            <td>${Hub.statusPill(a.status)}</td>
            <td>${a.model ? `<span class="mono small">${esc(a.model)}</span>` : '<span class="tr small">默认</span>'}</td>
            <td class="num">${kbN || '<span class="tr small">—</span>'}</td>
            <td class="num">${fmtN(a.calls)}</td>
            <td class="num tr small">${esc(a.updated || '—')}</td>
            ${actCell}
          </tr>`;
        }).join('');
        tableBox.innerHTML = `<table class="tbl">${head}${rows}</table>`;
      }

      async function reload() { await Hub.refresh(); renderKpis(); renderTable(); }

      // ---- 新建 / 编辑 表单 ----
      function openAgentForm(existing) {
        if (!perms.manageAgents) { Hub.toast('无权管理 Agent', true); return; }
        const ex = existing || null;
        const body = `
          <div class="grid g2">
            <div class="field"><label>Agent 名称</label><input id="f-name" value="${ex ? esc(ex.name) : ''}" placeholder="如：家属沟通 Agent"></div>
            <div class="field"><label>面向角色</label><input id="f-role" value="${ex ? esc(ex.role || '') : ''}" placeholder="如：客服 / 社工"></div>
          </div>
          <div class="field"><label>功能描述</label><textarea id="f-desc" rows="2" placeholder="一句话描述该 Agent 的能力">${ex ? esc(ex.desc || '') : ''}</textarea></div>
          <div class="grid g2">
            <div class="field"><label>初始状态</label><select id="f-status">
              <option value="on" ${(!ex || ex.status === 'on') ? 'selected' : ''}>启用（在架）</option>
              <option value="off" ${ex && ex.status === 'off' ? 'selected' : ''}>停用</option>
            </select></div>
            <div class="field"><label>运行模型（留空用平台默认）</label><select id="f-model"><option value="">（平台默认聊天模型）</option>${(window.CHAT_MODELS || []).map(m => `<option value="${m.id}" ${ex && ex.model === m.id ? 'selected' : ''}>${esc(m.name)} · ${esc(m.id)}</option>`).join('')}</select></div>
          </div>
          <div class="hint mt8">所属业务：${esc(B.icon + ' ' + B.name)} · 归属租户：<b>${esc(T.name)}</b>（后端强制，仅可管理本租户 Agent）</div>
          <div class="btn-row" style="justify-content:flex-end;margin-top:12px">
            <button class="btn" id="f-cancel">取消</button>
            <button class="btn btn-primary" id="f-save">${ex ? '保存修改' : '创建 Agent'}</button>
          </div>`;
        Hub.modal(ex ? '编辑 Agent' : '新建 Agent', body, (root, close) => {
          root.querySelector('#f-cancel').onclick = close;
          root.querySelector('#f-save').onclick = async () => {
            const name = root.querySelector('#f-name').value.trim();
            const role = root.querySelector('#f-role').value.trim();
            const desc = root.querySelector('#f-desc').value.trim();
            const status = root.querySelector('#f-status').value;
            const model = root.querySelector('#f-model').value;
            if (!name) { Hub.toast('请填写 Agent 名称', true); return; }
            const today = new Date().toISOString().slice(0, 10);
            const obj = ex
              ? { ...ex, name, role, desc, status, model, scenario: bizId, businessId: bizId, tenantId: tid, updated: today }
              : { id: 'x_' + Date.now(), scenario: bizId, businessId: bizId, tenantId: tid, name, role, desc, status, model, version: 'v1.0', owner: me.name, calls: 0, skills: [], kbIds: [], sopIds: [], updated: today };
            try {
              await Hub.change('agent.upsert', { scenario: bizId, agent: obj });
              close();
              Hub.toast(ex ? '已保存「' + obj.name + '」' : '已创建「' + obj.name + '」');
              await reload();
            } catch (_) { /* Hub.change 已 toast 403 */ }
          };
        });
      }

      // ---- 事件绑定（委托）----
      tableBox.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-act]'); if (!btn) return;
        const id = btn.dataset.id, act = btn.dataset.act;
        const a = Hub.data.agents.find(x => x.id === id); if (!a) return;
        if (act === 'edit') { openAgentForm(a); return; }
        if (act === 'toggle') {
          try { await Hub.change('agent.toggle', { id }); Hub.toast('已' + (a.status === 'on' ? '停用' : '启用') + '「' + a.name + '」'); await reload(); } catch (_) {}
          return;
        }
        if (act === 'del') {
          Hub.confirm('确定删除 Agent「' + a.name + '」？删除后不可恢复。', async () => {
            try { await Hub.change('agent.delete', { id }); Hub.toast('已删除「' + a.name + '」'); await reload(); } catch (_) {}
          });
        }
      });
      const btnNew = document.getElementById('btn-new');
      if (btnNew) btnNew.onclick = () => openAgentForm();

      // ---- 首屏渲染 ----
      renderKpis();
      renderTable();
    });
  </script>
</body>
</html>
